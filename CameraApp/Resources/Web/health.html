<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Health</title>
<link rel="stylesheet" href="/css/style.css?v=2.4.11">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content has-cards">
    <h1 data-i18n="health">Health Monitor</h1>
    
    <div class="grid" id="healthGrid"></div>
    
    <h2 style="margin-top:36px;" data-i18n="recentAlerts">Recent Alerts</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th data-i18n="type">Type</th>
                    <th data-i18n="message">Message</th>
                    <th data-i18n="time">Time</th>
                    <th data-i18n="resolved">Resolved</th>
                </tr>
            </thead>
            <tbody id="alertList"></tbody>
        </table>
    </div>
    
    <div class="task-cards" id="alertCards"></div>
</main>

<script src="/js/i18n.js?v=2.4.11"></script>
<script src="/js/app.js?v=2.4.11"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('health');
});

function dot(color) { return '<span class="status-dot dot-' + color + '"></span>'; }

async function loadHealth() {
    const h = await api('/api/health');
    if (!h) return;
    document.getElementById('healthGrid').innerHTML = `
        <div class="status-card">
            <span class="status-card-title">${t('monitoring')}</span>
            <div class="status-card-value">${h.isMonitoring ? dot('green') + t('active') : dot('gray') + t('inactive')}</div>
        </div>
        <div class="status-card">
            <span class="status-card-title">${t('diskFree')}</span>
            <div class="status-card-value">${h.diskFreeMB} MB</div>
        </div>
        <div class="status-card">
            <span class="status-card-title">${t('telegramFailures')}</span>
            <div class="status-card-value" style="color:${h.consecutiveTelegramFailures > 0 ? 'var(--warning)' : 'var(--text-primary)'};">${h.consecutiveTelegramFailures}</div>
        </div>
    `;
    const alerts = await api('/api/health/alerts');
    if (alerts) {
        document.getElementById('alertList').innerHTML = alerts.alerts.map(a =>
            `<tr>
                <td><strong>${a.type}</strong></td>
                <td><span style="font-weight:600; color:var(--text-primary);">${a.message}</span></td>
                <td style="font-size:13px; color:var(--text-secondary);">${new Date(a.timestamp).toLocaleString()}</td>
                <td>${a.isResolved ? '<span class="badge badge-green">' + t('yes') + '</span>' : '<span class="badge badge-orange">' + t('no') + '</span>'}</td>
            </tr>`
        ).join('');
        
        // Mobile cards
        document.getElementById('alertCards').innerHTML = alerts.alerts.map(a => {
            const badgeClass = a.isResolved ? 'badge-green' : 'badge-orange';
            return `<div class="task-card">
                <div class="task-card-header">
                    <span class="task-card-title">${a.type}</span>
                    <span class="badge ${badgeClass}">Resolved: ${a.isResolved ? t('yes') : t('no')}</span>
                </div>
                <div style="font-size:14px; color:var(--text-primary); font-weight:500; margin-bottom:4px;">${a.message}</div>
                <div class="task-card-meta">
                    <span>Time: <strong>${new Date(a.timestamp).toLocaleString()}</strong></span>
                </div>
            </div>`;
        }).join('');
    }
}
loadHealth();
setInterval(loadHealth, 10000);
</script>
</body>
</html>

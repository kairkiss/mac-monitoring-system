<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="macMonitorSystem">Mac监控系统 - Health</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar">
    <div class="sidebar-header" data-i18n="appName">Mac监控系统</div>
    <a href="/" class="nav-item" data-i18n="dashboard">Dashboard</a>
    <a href="/live.html" class="nav-item" data-i18n="liveView">Live View</a>
    <a href="/media.html" class="nav-item" data-i18n="mediaLibrary">Media Library</a>
    <a href="/tasks.html" class="nav-item" data-i18n="automation">Automation</a>
    <a href="/uploads.html" class="nav-item" data-i18n="uploadQueue">Upload Queue</a>
    <a href="/health.html" class="nav-item active" data-i18n="health">Health</a>
    <a href="/logs.html" class="nav-item" data-i18n="activityLog">Activity Log</a>
    <a href="/settings.html" class="nav-item" data-i18n="settings">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout" data-i18n="logout">Logout</a></div>
</nav>
<main class="content">
    <button class="hamburger" id="menuBtn">&#9776;</button>
    <h1 data-i18n="health">Health Monitor</h1>
    <div class="grid" id="healthGrid"></div>
    <h2 style="margin-top:24px;font-size:18px;" data-i18n="recentAlerts">Recent Alerts</h2>
    <table>
        <thead><tr><th data-i18n="type">Type</th><th data-i18n="message">Message</th><th data-i18n="time">Time</th><th data-i18n="resolved">Resolved</th></tr></thead>
        <tbody id="alertList"></tbody>
    </table>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('health');
});

async function loadHealth() {
    const h = await api('/api/health');
    if (!h) return;
    document.getElementById('healthGrid').innerHTML = `
        <div class="card"><h3>${t('monitoring')}</h3><p>${h.isMonitoring ? t('active') : t('inactive')}</p></div>
        <div class="card"><h3>${t('diskFree')}</h3><p>${h.diskFreeMB} MB</p></div>
        <div class="card"><h3>${t('telegramFailures')}</h3><p>${h.consecutiveTelegramFailures}</p></div>
    `;
    const alerts = await api('/api/health/alerts');
    if (alerts) {
        document.getElementById('alertList').innerHTML = alerts.alerts.map(a =>
            `<tr><td>${a.type}</td><td>${a.message}</td><td>${a.timestamp}</td>
            <td>${a.isResolved ? '<span class="badge badge-green">' + t('yes') + '</span>' : '<span class="badge badge-orange">' + t('no') + '</span>'}</td></tr>`
        ).join('');
    }
}
loadHealth();
setInterval(loadHealth, 10000);
</script>
</body>
</html>

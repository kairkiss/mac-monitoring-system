<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Audit Log</title>
<link rel="stylesheet" href="/css/style.css?v=2.4.10">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content has-cards">
    <h1 data-i18n="auditLog">Audit Log</h1>
    
    <div class="filter-chips" style="margin-bottom: 20px;">
        <div class="chip" style="cursor: default;">
            <span data-i18n="total">Total</span>: <strong id="totalEntries" style="margin-left: 6px; color: var(--text-primary);">0</strong>
        </div>
    </div>
    
    <div style="margin-bottom:20px; display:flex; gap:10px;">
        <button onclick="loadAudit()" style="min-height: 38px;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            <span data-i18n="refresh">Refresh</span>
        </button>
        <button class="danger" onclick="clearAudit()" style="min-height: 38px;" data-i18n="clear">Clear</button>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th data-i18n="time">Time</th>
                    <th>Method</th>
                    <th>Path</th>
                    <th>Status</th>
                    <th data-i18n="user">User</th>
                    <th>IP</th>
                    <th>ms</th>
                </tr>
            </thead>
            <tbody id="auditList"></tbody>
        </table>
    </div>
    
    <div class="task-cards" id="auditCards"></div>
    <p id="emptyMsg" style="color:var(--text-secondary); display:none; text-align:center; padding:60px 0; font-weight:600;">No audit entries.</p>
</main>

<script src="/js/i18n.js?v=2.4.10"></script>
<script src="/js/app.js?v=2.4.10"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('auditLog');
});

function statusColor(s) {
    if (s >= 500) return 'badge-red';
    if (s >= 400) return 'badge-orange';
    return 'badge-green';
}

function methodColor(m) {
    if (m === 'DELETE') return 'color:var(--danger)';
    if (m === 'POST' || m === 'PUT') return 'color:var(--accent)';
    return 'color:var(--text-secondary)';
}

async function loadAudit() {
    const data = await api('/api/audit?limit=200');
    if (!data) return;
    document.getElementById('totalEntries').textContent = data.total;
    const tbody = document.getElementById('auditList');
    const empty = document.getElementById('emptyMsg');
    
    if (data.entries.length === 0) {
        tbody.innerHTML = '';
        document.getElementById('auditCards').innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    
    tbody.innerHTML = data.entries.map(e => {
        const d = new Date(e.timestamp);
        const time = d.toLocaleTimeString();
        return '<tr>' +
            '<td style="font-size:13px; color:var(--text-secondary);">' + time + '</td>' +
            '<td style="' + methodColor(e.method) + '; font-weight:700;">' + e.method + '</td>' +
            '<td style="font-size:13px; max-width:300px; overflow:hidden; text-overflow:ellipsis;">' + e.path + '</td>' +
            '<td><span class="badge ' + statusColor(e.status) + '">' + e.status + '</span></td>' +
            '<td><strong>' + (e.user || '-') + '</strong></td>' +
            '<td style="font-size:12px; color:var(--text-secondary);">' + e.remoteAddress + '</td>' +
            '<td style="font-size:12px; color:var(--text-secondary); font-weight:600;">' + e.duration + ' ms</td>' +
            '</tr>';
    }).join('');
    
    // Mobile cards
    const cardsEl = document.getElementById('auditCards');
    cardsEl.innerHTML = data.entries.map(e => {
        const d = new Date(e.timestamp);
        const time = d.toLocaleTimeString();
        return `<div class="task-card">
            <div class="task-card-header">
                <span style="${methodColor(e.method)}; font-weight:700; font-size:15px;">${e.method}</span>
                <span class="badge ${statusColor(e.status)}">${e.status}</span>
            </div>
            <div style="font-size:13px; color:var(--text-primary); font-weight:600; margin-top:2px; word-break:break-all;">${e.path}</div>
            <div class="task-card-meta">
                <span>Time: <strong>${time}</strong></span>
                <span>User: <strong>${e.user || '-'}</strong></span>
                <span>IP: <strong>${e.remoteAddress}</strong></span>
                <span>Duration: <strong>${e.duration} ms</strong></span>
            </div>
        </div>`;
    }).join('');
}

async function clearAudit() {
    if (!confirm('Clear all audit log entries?')) return;
    await api('/api/audit', { method: 'DELETE' });
    loadAudit();
}

loadAudit();
setInterval(loadAudit, 10000);
</script>
</body>
</html>

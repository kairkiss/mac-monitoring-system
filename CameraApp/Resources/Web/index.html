<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content">
    <h1 data-i18n="dashboard">Dashboard</h1>
    
    <div class="grid">
        <div class="card">
            <h3 data-i18n="camera">Camera</h3>
            <p class="stat-value" id="cameraStatus">-</p>
            <p class="stat-sub" id="cameraSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="recording">Recording</h3>
            <p class="stat-value" id="recordStatus">-</p>
            <p class="stat-sub" id="recordSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="automation">Automation</h3>
            <p class="stat-value" id="automationStatus">-</p>
            <p class="stat-sub" id="automationSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="storage">Storage Provider</h3>
            <p class="stat-value" id="storageStatus">-</p>
            <p class="stat-sub" id="storageSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="uploadQueue">Upload Queue</h3>
            <p class="stat-value" id="uploadStatus">-</p>
            <p class="stat-sub" id="uploadSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="mediaLibrary">Media Library</h3>
            <p class="stat-value" id="mediaStatus">-</p>
            <p class="stat-sub" id="mediaSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="health">Health</h3>
            <p class="stat-value" id="healthStatus">-</p>
            <p class="stat-sub" id="healthSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="googleDriveStatus">Google Drive</h3>
            <p class="stat-value" id="gdStatus">-</p>
            <p class="stat-sub" id="gdSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="lastCapture">Last Capture</h3>
            <p class="stat-value" id="lastCaptureStatus" style="font-size:16px; word-break:break-all;">-</p>
            <p class="stat-sub" id="lastCaptureSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="lastUpload">Last Upload</h3>
            <p class="stat-value" id="lastUploadStatus" style="font-size:16px; word-break:break-all;">-</p>
            <p class="stat-sub" id="lastUploadSub"></p>
        </div>
        <div class="card">
            <h3>System</h3>
            <p class="stat-value" id="versionInfo" style="font-size:16px;">-</p>
            <p class="stat-sub" id="uptimeInfo"></p>
        </div>
    </div>

    <h2 data-i18n="quickActions" style="margin-top: 32px; font-weight: 700;">Quick Actions</h2>
    <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin-top: 16px;">
        <a href="/live.html" class="card" style="text-decoration:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding: 24px 16px;">
            <div class="more-icon-wrap" style="color:var(--accent); background:rgba(0,122,255,0.08); width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 7a2 2 0 0 0-2-2h-4.2l-1.4-2.1A2 2 0 0 0 13.8 2H10.2a2 2 0 0 0-1.6.9L7.2 5H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V7z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </div>
            <span style="font-weight:600; font-size:14px; color:var(--text-primary);" data-i18n="liveView">Open Live</span>
        </a>
        <div onclick="triggerQuickAction('capture')" class="card" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding: 24px 16px; cursor:pointer;">
            <div class="more-icon-wrap" style="color:var(--success); background:rgba(48,209,88,0.08); width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </div>
            <span style="font-weight:600; font-size:14px; color:var(--text-primary);" data-i18n="capturePhoto">Capture Photo</span>
        </div>
        <div id="quickRecordBtn" onclick="triggerQuickAction('record')" class="card" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding: 24px 16px; cursor:pointer;">
            <div class="more-icon-wrap" id="quickRecordIcon" style="color:var(--danger); background:rgba(255,69,58,0.08); width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
                </svg>
            </div>
            <span id="quickRecordLabel" style="font-weight:600; font-size:14px; color:var(--text-primary);" data-i18n="startRecording">Start Recording</span>
        </div>
        <a href="/media.html" class="card" style="text-decoration:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding: 24px 16px;">
            <div class="more-icon-wrap" style="color:#5ac8fa; background:rgba(90,200,250,0.08); width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
            </div>
            <span style="font-weight:600; font-size:14px; color:var(--text-primary);" data-i18n="mediaLibrary">Open Media</span>
        </a>
        <a href="/settings.html" class="card" style="text-decoration:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding: 24px 16px;">
            <div class="more-icon-wrap" style="color:var(--warning); background:rgba(255,159,10,0.08); width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <span style="font-weight:600; font-size:14px; color:var(--text-primary);" data-i18n="remoteAccess">Remote Access</span>
        </a>
        <a href="/uploads.html" class="card" style="text-decoration:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding: 24px 16px;">
            <div class="more-icon-wrap" style="color:var(--accent); background:rgba(0,122,255,0.08); width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
                    <path d="M16 16l-4-4-4 4M12 12v9"></path>
                </svg>
            </div>
            <span style="font-weight:600; font-size:14px; color:var(--text-primary);" data-i18n="uploadQueue">Open Uploads</span>
        </a>
    </div>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('dashboard');
});

function dot(color) { return '<span class="status-dot dot-' + color + '"></span>'; }

let isRecordingGlobal = false;

async function refreshStatus() {
    const data = await api('/api/status');
    if (!data) return;

    // Camera
    const camEl = document.getElementById('cameraStatus');
    const camSub = document.getElementById('cameraSub');
    if (data.camera.isRunning) {
        camEl.innerHTML = dot('green') + t('running');
        camSub.textContent = data.camera.deviceName || '';
    } else {
        camEl.innerHTML = dot('red') + t('stopped');
        camSub.textContent = '';
    }

    // Recording
    const recEl = document.getElementById('recordStatus');
    const recSub = document.getElementById('recordSub');
    isRecordingGlobal = data.camera.isRecording;
    
    // Sync record button UI
    const quickRecordLabel = document.getElementById('quickRecordLabel');
    const quickRecordIcon = document.getElementById('quickRecordIcon');
    if (isRecordingGlobal) {
        recEl.innerHTML = dot('red') + t('recording');
        recSub.textContent = t('inProgress');
        if (quickRecordLabel) quickRecordLabel.textContent = t('stopRecording');
        if (quickRecordIcon) {
            quickRecordIcon.style.color = 'var(--text-secondary)';
            quickRecordIcon.style.background = 'rgba(255,255,255,0.06)';
        }
    } else {
        recEl.innerHTML = dot('gray') + t('idle');
        recSub.textContent = '';
        if (quickRecordLabel) quickRecordLabel.textContent = t('startRecording');
        if (quickRecordIcon) {
            quickRecordIcon.style.color = 'var(--danger)';
            quickRecordIcon.style.background = 'rgba(255,69,58,0.08)';
        }
    }

    // Automation
    const autoEl = document.getElementById('automationStatus');
    const autoSub = document.getElementById('automationSub');
    if (data.automation.isEnabled) {
        autoEl.innerHTML = dot('green') + t('enabled');
        autoSub.textContent = data.automation.taskCount + ' ' + t('tasks');
    } else {
        autoEl.innerHTML = dot('gray') + t('disabled');
        autoSub.textContent = '';
    }

    // Storage
    const storEl = document.getElementById('storageStatus');
    const storSub = document.getElementById('storageSub');
    if (data.storage.provider === 'none' || !data.storage.provider) {
        storEl.innerHTML = dot('gray') + t('none');
        storSub.textContent = t('notConfigured');
    } else {
        storEl.innerHTML = dot('green') + data.storage.provider;
        storSub.textContent = '';
    }

    // Upload queue
    const upEl = document.getElementById('uploadStatus');
    const upSub = document.getElementById('uploadSub');
    const pending = data.uploadQueue.pending || 0;
    const active = data.uploadQueue.active || 0;
    const failed = data.uploadQueue.failed || 0;
    const waiting = data.uploadQueue.waiting || 0;
    if (failed > 0) {
        upEl.innerHTML = dot('orange') + pending + ' ' + t('queued2');
        upSub.textContent = failed + ' ' + t('failed') + ', ' + active + ' ' + t('uploading2');
    } else if (active > 0) {
        upEl.innerHTML = dot('green') + active + ' ' + t('uploading2');
        upSub.textContent = pending + ' ' + t('queued2') + (waiting > 0 ? ', ' + waiting + ' ' + t('waitingForProvider') : '');
    } else {
        upEl.innerHTML = dot('gray') + pending + ' ' + t('queued2');
        upSub.textContent = waiting > 0 ? waiting + ' ' + t('waitingForProvider') : '';
    }

    // Google Drive
    const gdEl = document.getElementById('gdStatus');
    const gdSub = document.getElementById('gdSub');
    if (data.storage.provider === 'googleDrive') {
        if (data.storage.googleDriveConnected) {
            gdEl.innerHTML = dot('green') + t('googleDriveAuthenticated');
            gdSub.textContent = data.storage.googleDriveEmail || '';
        } else if (data.storage.googleDriveNeedsReconnect) {
            gdEl.innerHTML = dot('orange') + t('needsReconnect');
            gdSub.textContent = '';
        } else {
            gdEl.innerHTML = dot('red') + t('notConfigured');
            gdSub.textContent = '';
        }
    } else {
        gdEl.innerHTML = dot('gray') + t('none');
        gdSub.textContent = '';
    }

    // Version
    document.getElementById('versionInfo').textContent = 'v' + (data.version || '?') + ' (' + (data.build || '?') + ')';
}

async function triggerQuickAction(action) {
    if (action === 'capture') {
        try {
            const data = await api('/api/camera/capture', { method: 'POST', body: {} });
            if (data) toast(t('captured') + ': ' + data.fileName, 'success');
        } catch (e) {}
    } else if (action === 'record') {
        const url = isRecordingGlobal ? '/api/camera/record/stop' : '/api/camera/record/start';
        try {
            const data = await api(url, { method: 'POST', body: {} });
            if (data) {
                toast(data.status === 'recording' ? t('recordingStarted') : t('recordingSaved') + ': ' + data.fileName, 'success');
                refreshStatus();
            }
        } catch (e) {}
    }
}

async function refreshHealth() {
    try {
        const data = await api('/api/health');
        if (!data) return;
        const el = document.getElementById('healthStatus');
        const sub = document.getElementById('healthSub');
        if (data.alerts && data.alerts.length > 0) {
            el.innerHTML = dot('orange') + data.alerts.length + ' ' + t('alert');
            sub.textContent = data.alerts[0].message || '';
        } else {
            el.innerHTML = dot('green') + t('ok');
            sub.textContent = t('noIssues');
        }
    } catch (e) {}
}

async function refreshMediaCount() {
    try {
        const data = await api('/api/media?perPage=1');
        if (!data) return;
        document.getElementById('mediaStatus').textContent = data.total || 0;
        document.getElementById('mediaSub').textContent = t('totalItems');
    } catch (e) {}
}

async function refreshLastCapture() {
    try {
        const data = await api('/api/media?perPage=1&sortBy=date');
        if (!data || !data.items || data.items.length === 0) return;
        const item = data.items[0];
        document.getElementById('lastCaptureStatus').textContent = item.fileName || '-';
        document.getElementById('lastCaptureSub').textContent = item.date ? new Date(item.date).toLocaleString() : '';
    } catch (e) {}
}

async function refreshLastUpload() {
    try {
        const data = await api('/api/uploads');
        if (!data || !data.jobs) return;
        const completed = data.jobs.filter(j => j.status === 'completed' || j.status === 'verified');
        if (completed.length > 0) {
            const latest = completed[0];
            document.getElementById('lastUploadStatus').textContent = latest.fileName || '-';
            document.getElementById('lastUploadSub').textContent = latest.completedAt ? new Date(latest.completedAt).toLocaleString() : '';
        }
    } catch (e) {}
}

refreshStatus();
refreshHealth();
refreshMediaCount();
refreshLastCapture();
refreshLastUpload();
setInterval(refreshStatus, 5000);
setInterval(refreshHealth, 30000);
</script>
</body>
</html>

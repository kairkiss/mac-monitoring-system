<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="macMonitorSystem">Mac监控系统 - Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.stat-value { font-size: 28px; font-weight: 700; }
.stat-sub { font-size: 12px; color: var(--fg2); margin-top: 4px; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dot-green { background: var(--green); }
.dot-red { background: var(--red); }
.dot-orange { background: var(--orange); }
.dot-gray { background: #666; }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar">
    <div class="sidebar-header" data-i18n="appName">Mac监控系统</div>
    <a href="/" class="nav-item active" data-i18n="dashboard">Dashboard</a>
    <a href="/live.html" class="nav-item" data-i18n="liveView">Live View</a>
    <a href="/media.html" class="nav-item" data-i18n="mediaLibrary">Media Library</a>
    <a href="/tasks.html" class="nav-item" data-i18n="automation">Automation</a>
    <a href="/uploads.html" class="nav-item" data-i18n="uploadQueue">Upload Queue</a>
    <a href="/health.html" class="nav-item" data-i18n="health">Health</a>
    <a href="/logs.html" class="nav-item" data-i18n="activityLog">Activity Log</a>
    <a href="/audit.html" class="nav-item" data-i18n="auditLog">Audit Log</a>
    <a href="/settings.html" class="nav-item" data-i18n="settings">Settings</a>
    <div class="sidebar-footer">
        <span id="userInfo"></span>
        <a href="#" id="logoutBtn" class="logout" data-i18n="logout">Logout</a>
    </div>
</nav>
<main class="content">
    <button class="hamburger" id="menuBtn">&#9776;</button>
    <h1 data-i18n="dashboard">Dashboard</h1>
    <div class="grid">
        <div class="card">
            <h3 data-i18n="camera">Camera</h3>
            <p class="stat-value" id="cameraStatus">-</p>
            <p class="stat-sub" id="cameraSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="recording">Recording</h3>
            <p class="stat-value" id="recordStatus">-</p>
            <p class="stat-sub" id="recordSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="automation">Automation</h3>
            <p class="stat-value" id="automationStatus">-</p>
            <p class="stat-sub" id="automationSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="storage">Storage Provider</h3>
            <p class="stat-value" id="storageStatus">-</p>
            <p class="stat-sub" id="storageSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="uploadQueue">Upload Queue</h3>
            <p class="stat-value" id="uploadStatus">-</p>
            <p class="stat-sub" id="uploadSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="mediaLibrary">Media Library</h3>
            <p class="stat-value" id="mediaStatus">-</p>
            <p class="stat-sub" id="mediaSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="health">Health</h3>
            <p class="stat-value" id="healthStatus">-</p>
            <p class="stat-sub" id="healthSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="googleDriveStatus">Google Drive</h3>
            <p class="stat-value" id="gdStatus">-</p>
            <p class="stat-sub" id="gdSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="lastCapture">Last Capture</h3>
            <p class="stat-value" id="lastCaptureStatus" style="font-size:18px;">-</p>
            <p class="stat-sub" id="lastCaptureSub"></p>
        </div>
        <div class="card">
            <h3 data-i18n="lastUpload">Last Upload</h3>
            <p class="stat-value" id="lastUploadStatus" style="font-size:18px;">-</p>
            <p class="stat-sub" id="lastUploadSub"></p>
        </div>
        <div class="card">
            <h3>System</h3>
            <p class="stat-value" id="versionInfo" style="font-size:18px;">-</p>
            <p class="stat-sub" id="uptimeInfo"></p>
        </div>
    </div>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('dashboard');
});

function dot(color) { return '<span class="status-dot dot-' + color + '"></span>'; }

async function refreshStatus() {
    const data = await api('/api/status');
    if (!data) return;

    // Camera
    const camEl = document.getElementById('cameraStatus');
    const camSub = document.getElementById('cameraSub');
    if (data.camera.isRunning) {
        camEl.innerHTML = dot('green') + t('running');
        camSub.textContent = data.camera.deviceName || '';
    } else {
        camEl.innerHTML = dot('red') + t('stopped');
        camSub.textContent = '';
    }

    // Recording
    const recEl = document.getElementById('recordStatus');
    const recSub = document.getElementById('recordSub');
    if (data.camera.isRecording) {
        recEl.innerHTML = dot('red') + t('recording');
        recSub.textContent = t('inProgress');
    } else {
        recEl.innerHTML = dot('gray') + t('idle');
        recSub.textContent = '';
    }

    // Automation
    const autoEl = document.getElementById('automationStatus');
    const autoSub = document.getElementById('automationSub');
    if (data.automation.isEnabled) {
        autoEl.innerHTML = dot('green') + t('enabled');
        autoSub.textContent = data.automation.taskCount + ' ' + t('tasks');
    } else {
        autoEl.innerHTML = dot('gray') + t('disabled');
        autoSub.textContent = '';
    }

    // Storage
    const storEl = document.getElementById('storageStatus');
    const storSub = document.getElementById('storageSub');
    if (data.storage.provider === 'none' || !data.storage.provider) {
        storEl.innerHTML = dot('gray') + t('none');
        storSub.textContent = t('notConfigured');
    } else {
        storEl.innerHTML = dot('green') + data.storage.provider;
        storSub.textContent = '';
    }

    // Upload queue
    const upEl = document.getElementById('uploadStatus');
    const upSub = document.getElementById('uploadSub');
    const pending = data.uploadQueue.pending || 0;
    const active = data.uploadQueue.active || 0;
    const failed = data.uploadQueue.failed || 0;
    const waiting = data.uploadQueue.waiting || 0;
    if (failed > 0) {
        upEl.innerHTML = dot('orange') + pending + ' ' + t('queued2');
        upSub.textContent = failed + ' ' + t('failed') + ', ' + active + ' ' + t('uploading2');
    } else if (active > 0) {
        upEl.innerHTML = dot('green') + active + ' ' + t('uploading2');
        upSub.textContent = pending + ' ' + t('queued2') + (waiting > 0 ? ', ' + waiting + ' ' + t('waitingForProvider') : '');
    } else {
        upEl.innerHTML = dot('gray') + pending + ' ' + t('queued2');
        upSub.textContent = waiting > 0 ? waiting + ' ' + t('waitingForProvider') : '';
    }

    // Google Drive
    const gdEl = document.getElementById('gdStatus');
    const gdSub = document.getElementById('gdSub');
    if (data.storage.provider === 'googleDrive') {
        if (data.storage.googleDriveConnected) {
            gdEl.innerHTML = dot('green') + t('googleDriveAuthenticated');
            gdSub.textContent = data.storage.googleDriveEmail || '';
        } else if (data.storage.googleDriveNeedsReconnect) {
            gdEl.innerHTML = dot('orange') + t('needsReconnect');
            gdSub.textContent = '';
        } else {
            gdEl.innerHTML = dot('red') + t('notConfigured');
            gdSub.textContent = '';
        }
    } else {
        gdEl.innerHTML = dot('gray') + t('none');
        gdSub.textContent = '';
    }

    // Version
    document.getElementById('versionInfo').textContent = 'v' + (data.version || '?') + ' (' + (data.build || '?') + ')';
}

async function refreshHealth() {
    try {
        const data = await api('/api/health');
        if (!data) return;
        const el = document.getElementById('healthStatus');
        const sub = document.getElementById('healthSub');
        if (data.alerts && data.alerts.length > 0) {
            el.innerHTML = dot('orange') + data.alerts.length + ' ' + t('alert');
            sub.textContent = data.alerts[0].message || '';
        } else {
            el.innerHTML = dot('green') + t('ok');
            sub.textContent = t('noIssues');
        }
    } catch (e) {}
}

async function refreshMediaCount() {
    try {
        const data = await api('/api/media?perPage=1');
        if (!data) return;
        document.getElementById('mediaStatus').textContent = data.total || 0;
        document.getElementById('mediaSub').textContent = t('totalItems');
    } catch (e) {}
}

async function refreshLastCapture() {
    try {
        const data = await api('/api/media?perPage=1&sortBy=date');
        if (!data || !data.items || data.items.length === 0) return;
        const item = data.items[0];
        document.getElementById('lastCaptureStatus').textContent = item.fileName || '-';
        document.getElementById('lastCaptureSub').textContent = item.date ? new Date(item.date).toLocaleString() : '';
    } catch (e) {}
}

async function refreshLastUpload() {
    try {
        const data = await api('/api/uploads');
        if (!data || !data.jobs) return;
        const completed = data.jobs.filter(j => j.status === 'completed' || j.status === 'verified');
        if (completed.length > 0) {
            const latest = completed[0];
            document.getElementById('lastUploadStatus').textContent = latest.fileName || '-';
            document.getElementById('lastUploadSub').textContent = latest.completedAt ? new Date(latest.completedAt).toLocaleString() : '';
        }
    } catch (e) {}
}

refreshStatus();
refreshHealth();
refreshMediaCount();
refreshLastCapture();
refreshLastUpload();
setInterval(refreshStatus, 5000);
setInterval(refreshHealth, 30000);
</script>
</body>
</html>

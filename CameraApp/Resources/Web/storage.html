<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Storage Center</title>
<link rel="stylesheet" href="/css/style.css?v=2.4.13">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content">
    <div class="page-header">
        <h1 data-i18n="storageCenter">Storage Center</h1>
        <div class="page-header-subtitle" data-i18n="manageStorageDesc">Manage cloud uploads, local retention filters, and storage providers.</div>
    </div>

    <!-- Storage Usage Summary Card -->
    <div class="section-card">
        <h3 data-i18n="storageQuota">Storage Quota</h3>
        <div id="storageInfo" style="color:var(--text-secondary); line-height:1.6; font-size:14px;" data-i18n="loading">Loading...</div>
    </div>

    <!-- Storage Providers Section -->
    <div class="section-card">
        <h3 data-i18n="storageProviders">Storage Providers</h3>
        <div id="providerList" style="display:flex; flex-direction:column; gap:12px; margin-bottom: 16px;"></div>
        <div style="display:flex; gap:12px;">
            <a href="/uploads.html" class="btn" style="text-decoration:none;" data-i18n="openUploads">Open Uploads</a>
        </div>
    </div>

    <!-- Storage Connection Diagnostics -->
    <div class="section-card">
        <h3 data-i18n="storageDiagnostics">Storage Diagnostics</h3>
        <div id="diagInfo" style="color:var(--text-secondary); font-size:14px; margin-bottom: 16px;" data-i18n="loading">Loading...</div>
        <button onclick="runTestConnection()" id="testConnBtn" class="primary-action" style="max-width:200px;" data-i18n="testConnection">Test Connection</button>
        <div id="testResult" style="margin-top:14px; font-size:13px; font-weight: 600;"></div>
    </div>

    <!-- Dry Run Retention Preview -->
    <div class="section-card">
        <h3 data-i18n="retentionPreview">Retention Preview</h3>
        <p style="color:var(--text-secondary); font-size:13px; margin-bottom:14px; line-height:1.45;" data-i18n="runDryRun">Preview what local files retention cleanup would delete.</p>
        <button onclick="runDryRun()" id="dryRunBtn" class="secondary" style="min-height:38px;" data-i18n="previewCleanup">Preview Cleanup</button>
        <pre id="dryRunResult" style="margin-top:14px; font-size:12px; white-space: pre-wrap; font-family: monospace; background:rgba(0,0,0,0.3); padding: 12px; border-radius:var(--radius-md); border:1px solid var(--border-subtle); max-height: 220px; overflow-y: auto; display:none; color:#ff9f0a;"></pre>
    </div>
</main>

<script src="/js/i18n.js?v=2.4.13"></script>
<script src="/js/app.js?v=2.4.13"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('storageCenter');
    loadStorage();
    loadProviders();
    loadDiagnostics();
});

async function loadStorage() {
    const data = await api('/api/storage/status');
    if (!data) return;
    const sizeMB = (data.totalStorageBytes / 1048576).toFixed(1);
    document.getElementById('storageInfo').innerHTML =
        `<div class="status-row"><span class="status-row-label">${t('activeProvider')}</span><span class="status-row-value">${data.providerDisplayName}</span></div>` +
        `<div class="status-row"><span class="status-row-label">${t('photos')} / ${t('videos')}</span><span class="status-row-value">📸 ${data.totalPhotos} | 🎥 ${data.totalVideos}</span></div>` +
        `<div class="status-row"><span class="status-row-label">${t('storageUsed')} / ${t('free')}</span><span class="status-row-value">${sizeMB} MB / ${data.diskFreeMB} MB</span></div>`;
}

async function loadProviders() {
    const data = await api('/api/storage/providers');
    if (!data) return;
    document.getElementById('providerList').innerHTML = data.providers.map(p => {
        // v2.4.13: Use correct field names from backend
        const isActive = p.isActive || p.isCurrent;
        const isAvailable = p.isAvailable || p.isConnected;
        const isPlanned = p.isPlanned || false;
        const detail = p.detail || p.email || p.type;

        const activeBadge = isActive ? '<span class="badge badge-green" style="margin-left:8px;">Active</span>' : '';

        let statusBadge = '';
        if (isPlanned) {
            statusBadge = '<span class="badge badge-neutral">' + t('planned') + '</span>';
        } else if (p.type === 'googleDrive' && isAvailable) {
            statusBadge = '<span class="badge badge-blue">' + t('googleDriveConnected') + '</span>';
        } else if (p.type === 'googleDrive' && !isAvailable) {
            statusBadge = '<span class="badge badge-orange">' + t('notConfigured') + '</span>';
        } else if (isAvailable) {
            statusBadge = '<span class="badge badge-green">' + t('connected') + '</span>';
        } else {
            statusBadge = '<span class="badge badge-neutral">' + t('notConfigured') + '</span>';
        }

        return `<div class="provider-card">
            <div>
                <strong style="color:var(--text-primary); font-size:15px;">${p.displayName}</strong> ${activeBadge}
                <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">${detail || ''}</div>
            </div>
            <div>${statusBadge}</div>
        </div>`;
    }).join('');
}

async function loadDiagnostics() {
    const data = await api('/api/storage/diagnostics');
    if (!data) return;
    document.getElementById('diagInfo').innerHTML =
        `<div class="status-row"><span class="status-row-label">${t('queueJobsTotal')}</span><span class="status-row-value">${data.queueJobsTotal || data.recentUploadCount || 0}</span></div>` +
        `<div class="status-row"><span class="status-row-label">${t('activeUploaders')}</span><span class="status-row-value">${data.activeUploaders || 0}</span></div>` +
        `<div class="status-row"><span class="status-row-label">${t('networkReachable')}</span><span class="status-row-value">${data.isNetworkReachable ? '✅ ' + t('yes') : '❌ ' + t('no')}</span></div>`;
}

async function runTestConnection() {
    const el = document.getElementById('testResult');
    const btn = document.getElementById('testConnBtn');
    el.textContent = t('testingConnection');
    el.style.color = 'var(--text-secondary)';
    if (btn) btn.disabled = true;
    try {
        // v2.4.13: Use /api/storage/test (primary), fallback to /api/storage/test-connection
        let data = await api('/api/storage/test', { method: 'POST' }).catch(() => null);
        if (!data) {
            data = await api('/api/storage/test-connection', { method: 'POST' });
        }
        if (data) {
            // v2.4.13: Read correct fields from backend
            const connected = data.connected;
            const email = data.email || '';
            const error = data.error || '';
            const errorClass = data.errorClass || '';
            const quotaUsed = data.quotaUsedGB;
            const quotaTotal = data.quotaTotalGB;

            if (connected) {
                let msg = '✅ ' + t('connectionSuccess');
                if (email) msg += ' (' + email + ')';
                if (quotaUsed !== undefined && quotaTotal !== undefined) {
                    msg += ' — ' + quotaUsed + ' / ' + quotaTotal + ' GB';
                }
                el.textContent = msg;
                el.style.color = 'var(--success)';
            } else {
                let msg = '❌ ' + t('connectionFailed');
                if (errorClass) msg += ' [' + errorClass + ']';
                if (error) msg += ': ' + error;
                el.textContent = msg;
                el.style.color = 'var(--danger)';
            }
        }
    } catch(e) {
        el.textContent = '❌ ' + t('connectionFailed');
        el.style.color = 'var(--danger)';
    } finally {
        if (btn) btn.disabled = false;
    }
}

async function runDryRun() {
    const el = document.getElementById('dryRunResult');
    const btn = document.getElementById('dryRunBtn');
    el.textContent = t('runningDryRun');
    el.style.display = 'block';
    if (btn) btn.disabled = true;
    try {
        const data = await api('/api/storage/retention/dry-run', { method: 'POST' });
        if (data) {
            // v2.4.13: Support both new and legacy field names
            const deleteCount = data.deletedFilesCount ?? data.wouldDelete ?? 0;
            const skippedCount = data.skipped ?? 0;
            const files = data.details ?? data.files ?? [];
            const reason = data.reason || '';

            if (deleteCount === 0 && files.length === 0) {
                el.textContent = t('noFilesWouldBeDeleted');
            } else {
                let html = t('willDeleteCount') + ': ' + deleteCount + ' ' + t('files');
                if (skippedCount > 0) html += ' (' + t('skipped') + ': ' + skippedCount + ')';
                if (reason) html += '\n' + t('reason') + ': ' + reason;
                html += '\n\n';
                if (files.length > 0) {
                    html += files.map(d => {
                        const name = d.fileName || d.name || '?';
                        const size = d.sizeBytes ? ' (' + (d.sizeBytes/1024).toFixed(1) + ' KB)' : '';
                        const action = d.action || '';
                        const r = d.reason || '';
                        return (action ? '[' + action + '] ' : '') + name + size + (r ? ' — ' + r : '');
                    }).join('\n');
                }
                el.textContent = html;
            }
        }
    } catch (e) {
        el.textContent = '❌ ' + t('failed');
    } finally {
        if (btn) btn.disabled = false;
    }
}
</script>
</body>
</html>

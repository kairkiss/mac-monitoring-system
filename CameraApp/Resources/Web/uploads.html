<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="macMonitorSystem">Mac监控系统 - Upload Queue</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.progress-bar { width: 100%; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
.retry-countdown { color: var(--orange); font-size: 12px; }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar">
    <div class="sidebar-header" data-i18n="appName">Mac监控系统</div>
    <a href="/" class="nav-item" data-i18n="dashboard">Dashboard</a>
    <a href="/live.html" class="nav-item" data-i18n="liveView">Live View</a>
    <a href="/media.html" class="nav-item" data-i18n="mediaLibrary">Media Library</a>
    <a href="/tasks.html" class="nav-item" data-i18n="automation">Automation</a>
    <a href="/uploads.html" class="nav-item active" data-i18n="uploadQueue">Upload Queue</a>
    <a href="/health.html" class="nav-item" data-i18n="health">Health</a>
    <a href="/logs.html" class="nav-item" data-i18n="activityLog">Activity Log</a>
    <a href="/audit.html" class="nav-item" data-i18n="auditLog">Audit Log</a>
    <a href="/settings.html" class="nav-item" data-i18n="settings">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout" data-i18n="logout">Logout</a></div>
</nav>
<main class="content">
    <button class="hamburger" id="menuBtn">&#9776;</button>
    <h1 data-i18n="uploadQueue">Upload Queue</h1>
    <div class="stats-bar">
        <div class="stat"><span class="stat-value" id="totalCount">0</span><span class="stat-label" data-i18n="total">Total</span></div>
        <div class="stat"><span class="stat-value" id="pendingCount">0</span><span class="stat-label" data-i18n="pending">Pending</span></div>
        <div class="stat"><span class="stat-value" id="retryingCount">0</span><span class="stat-label" data-i18n="retrying">Retrying</span></div>
        <div class="stat"><span class="stat-value" id="failedCount">0</span><span class="stat-label" data-i18n="failed">Failed</span></div>
        <div class="stat"><span class="stat-value" id="waitingCount">0</span><span class="stat-label" data-i18n="waitingForProvider">Waiting</span></div>
        <div class="stat"><span class="stat-value" id="pauseStatus" data-i18n="active">Active</span><span class="stat-label" data-i18n="status">Status</span></div>
    </div>
    <div style="margin-bottom:16px; display:flex; gap:8px;">
        <button onclick="retryFailed()" data-i18n="retryAllFailed">Retry All Failed</button>
        <button onclick="togglePause()" id="pauseBtn" data-i18n="pause">Pause</button>
    </div>
    <div class="card">
        <table>
            <thead><tr>
                <th data-i18n="taskName">File</th>
                <th data-i18n="status">Status</th>
                <th data-i18n="provider">Provider</th>
                <th data-i18n="progress">Progress</th>
                <th data-i18n="attempts">Attempts</th>
                <th data-i18n="retryAt">Retry At</th>
                <th data-i18n="error">Error</th>
                <th data-i18n="actions">Actions</th>
            </tr></thead>
            <tbody id="queueList"></tbody>
        </table>
        <div class="task-cards" id="queueCards"></div>
        <p id="emptyMsg" style="color:var(--fg2);display:none;text-align:center;padding:20px;" data-i18n="noUploadJobs">No upload jobs in queue.</p>
    </div>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('uploadQueue');
});

let isPaused = false;

function formatTime(isoStr) {
    if (!isoStr) return '-';
    try {
        const d = new Date(isoStr);
        return d.toLocaleTimeString();
    } catch { return '-'; }
}

function retryCountdown(nextRetryAt) {
    if (!nextRetryAt) return '';
    const now = new Date();
    const retry = new Date(nextRetryAt);
    const diff = Math.max(0, Math.round((retry - now) / 1000));
    if (diff <= 0) return t('retrying') + '...';
    return formatTime(nextRetryAt) + ' (' + diff + 's)';
}

function progressDisplay(progress, status) {
    if (status === 'completed') return '100%';
    if (status !== 'uploading' && status !== 'retrying') return '-';
    const pct = Math.round((progress || 0) * 100);
    if (pct > 0) {
        return '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div><span style="font-size:11px;color:var(--fg2);">' + pct + '%</span>';
    }
    return '0%';
}

async function loadQueue() {
    const data = await api('/api/upload/queue');
    if (!data) return;
    isPaused = data.isPaused;
    document.getElementById('totalCount').textContent = data.totalJobs;
    document.getElementById('pendingCount').textContent = data.pendingCount;
    document.getElementById('retryingCount').textContent = data.retryingCount || 0;
    document.getElementById('failedCount').textContent = data.failedCount;
    document.getElementById('waitingCount').textContent = data.waitingCount || 0;
    document.getElementById('pauseStatus').textContent = isPaused ? t('paused') : t('active');
    document.getElementById('pauseBtn').textContent = isPaused ? t('resume') : t('pause');

    const tbody = document.getElementById('queueList');
    const empty = document.getElementById('emptyMsg');
    if (data.jobs.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = data.jobs.map(j => {
        const statusColors = {
            failed: 'color:#f44336', completed: 'color:#4caf50',
            uploading: 'color:var(--accent)', retrying: 'color:var(--orange)',
            cancelled: 'color:var(--fg2)', waitingForProvider: 'color:#ff9800'
        };
        const statusClass = statusColors[j.status] || '';
        const statusText = t(j.status) || j.status;

        let actions = '';
        if (j.status === 'failed' || j.status === 'retrying' || j.status === 'waitingForProvider') {
            actions += '<button onclick="retryJob(\'' + j.id + '\')">' + t('retry') + '</button>';
        }
        if (j.status !== 'completed' && j.status !== 'cancelled') {
            actions += ' <button class="secondary" onclick="cancelJob(\'' + j.id + '\')">' + t('cancel') + '</button>';
        }

        const retryInfo = j.status === 'retrying' && j.nextRetryAt
            ? '<div class="retry-countdown">' + t('retryAt') + ' ' + retryCountdown(j.nextRetryAt) + '</div>'
            : '';

        return '<tr>' +
            '<td>' + j.fileName + '</td>' +
            '<td style="' + statusClass + '">' + statusText + '</td>' +
            '<td>' + j.provider + '</td>' +
            '<td>' + progressDisplay(j.progress, j.status) + '</td>' +
            '<td>' + j.attempts + '/' + j.maxRetries + '</td>' +
            '<td>' + retryInfo + '</td>' +
            '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">' + (j.errorClass ? '<span class="error-class-badge">' + j.errorClass + '</span> ' : '') + (j.lastError || '-') + '</td>' +
            '<td>' + actions + '</td>' +
            '</tr>';
    }).join('');
    // Mobile cards
    const cardsEl = document.getElementById('queueCards');
    cardsEl.innerHTML = data.jobs.map(j => {
        const statusBadgeColors = { failed: 'badge-red', completed: 'badge-green', uploading: 'badge-blue', retrying: 'badge-orange', waitingForProvider: 'badge-orange' };
        const badgeClass = statusBadgeColors[j.status] || '';
        const statusText = t(j.status) || j.status;
        let actions = '';
        if (j.status === 'failed' || j.status === 'retrying' || j.status === 'waitingForProvider') {
            actions += '<button onclick="retryJob(\'' + j.id + '\')">' + t('retry') + '</button>';
        }
        if (j.status !== 'completed' && j.status !== 'cancelled') {
            actions += '<button class="secondary" onclick="cancelJob(\'' + j.id + '\')">' + t('cancel') + '</button>';
        }
        return '<div class="task-card"><div class="task-card-header"><span class="task-card-title">' + j.fileName + '</span><span class="badge ' + badgeClass + '">' + statusText + '</span></div><div class="task-card-meta"><span>' + j.provider + '</span> &middot; <span>' + j.attempts + '/' + j.maxRetries + '</span>' + (j.errorClass ? ' &middot; <span class="error-class-badge">' + j.errorClass + '</span>' : '') + '</div>' + (j.lastError ? '<div style="font-size:12px;color:var(--red);margin-bottom:6px;">' + j.lastError + '</div>' : '') + '<div class="task-card-actions">' + actions + '</div></div>';
    }).join('');
}

async function retryJob(id) { await api('/api/upload/retry', { method: 'POST', body: { jobID: id } }); loadQueue(); }
async function cancelJob(id) { await api('/api/upload/cancel', { method: 'POST', body: { jobID: id } }); loadQueue(); }
async function retryFailed() { await api('/api/upload/retry-failed', { method: 'POST' }); loadQueue(); }
async function togglePause() {
    const url = isPaused ? '/api/upload/resume' : '/api/upload/pause';
    await api(url, { method: 'POST' });
    loadQueue();
}

loadQueue();
setInterval(loadQueue, 5000);
</script>
</body>
</html>

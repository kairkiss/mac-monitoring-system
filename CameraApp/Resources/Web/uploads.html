<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="macMonitorSystem">Mac监控系统 - Upload Queue</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header" data-i18n="appName">Mac监控系统</div>
    <a href="/" class="nav-item" data-i18n="dashboard">Dashboard</a>
    <a href="/live.html" class="nav-item" data-i18n="liveView">Live View</a>
    <a href="/media.html" class="nav-item" data-i18n="mediaLibrary">Media Library</a>
    <a href="/tasks.html" class="nav-item" data-i18n="automation">Automation</a>
    <a href="/uploads.html" class="nav-item active" data-i18n="uploadQueue">Upload Queue</a>
    <a href="/health.html" class="nav-item" data-i18n="health">Health</a>
    <a href="/logs.html" class="nav-item" data-i18n="activityLog">Activity Log</a>
    <a href="/settings.html" class="nav-item" data-i18n="settings">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout" data-i18n="logout">Logout</a></div>
</nav>
<main class="content">
    <h1 data-i18n="uploadQueue">Upload Queue</h1>
    <div class="stats-bar">
        <div class="stat"><span class="stat-value" id="totalCount">0</span><span class="stat-label" data-i18n="total">Total</span></div>
        <div class="stat"><span class="stat-value" id="pendingCount">0</span><span class="stat-label" data-i18n="pending">Pending</span></div>
        <div class="stat"><span class="stat-value" id="failedCount">0</span><span class="stat-label" data-i18n="failed">Failed</span></div>
        <div class="stat"><span class="stat-value" id="pauseStatus" data-i18n="active">Active</span><span class="stat-label" data-i18n="status">Status</span></div>
    </div>
    <div style="margin-bottom:16px; display:flex; gap:8px;">
        <button onclick="retryFailed()" data-i18n="retryAllFailed">Retry All Failed</button>
        <button onclick="togglePause()" id="pauseBtn" data-i18n="pause">Pause</button>
    </div>
    <div class="card">
        <table>
            <thead><tr><th data-i18n="taskName">File</th><th data-i18n="status">Status</th><th data-i18n="provider">Provider</th><th data-i18n="attempts">Attempts</th><th data-i18n="error">Error</th><th data-i18n="actions">Actions</th></tr></thead>
            <tbody id="queueList"></tbody>
        </table>
        <p id="emptyMsg" style="color:var(--fg2);display:none;text-align:center;padding:20px;" data-i18n="noUploadJobs">No upload jobs in queue.</p>
    </div>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('uploadQueue');
});

let isPaused = false;

async function loadQueue() {
    const data = await api('/api/upload/queue');
    if (!data) return;
    isPaused = data.isPaused;
    document.getElementById('totalCount').textContent = data.totalJobs;
    document.getElementById('pendingCount').textContent = data.pendingCount;
    document.getElementById('failedCount').textContent = data.failedCount;
    document.getElementById('pauseStatus').textContent = isPaused ? t('paused') : t('active');
    document.getElementById('pauseBtn').textContent = isPaused ? t('resume') : t('pause');

    const tbody = document.getElementById('queueList');
    const empty = document.getElementById('emptyMsg');
    if (data.jobs.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = data.jobs.map(j => {
        const statusClass = j.status === 'failed' ? 'color:#f44336' : j.status === 'completed' ? 'color:#4caf50' : '';
        const actions = j.status === 'failed' ? `<button onclick="retryJob('${j.id}')">${t('retry')}</button>` :
                        j.status !== 'completed' && j.status !== 'cancelled' ? `<button onclick="cancelJob('${j.id}')">${t('cancel')}</button>` : '';
        return `<tr><td>${j.fileName}</td><td style="${statusClass}">${j.status}</td><td>${j.provider}</td><td>${j.attempts}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${j.lastError || '-'}</td><td>${actions}</td></tr>`;
    }).join('');
}

async function retryJob(id) { await api('/api/upload/retry', { method: 'POST', body: { jobID: id } }); loadQueue(); }
async function cancelJob(id) { await api('/api/upload/cancel', { method: 'POST', body: { jobID: id } }); loadQueue(); }
async function retryFailed() { await api('/api/upload/retry-failed', { method: 'POST' }); loadQueue(); }
async function togglePause() {
    const url = isPaused ? '/api/upload/resume' : '/api/upload/pause';
    await api(url, { method: 'POST' });
    loadQueue();
}

loadQueue();
setInterval(loadQueue, 5000);
</script>
</body>
</html>

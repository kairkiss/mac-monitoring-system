<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Upload Queue</title>
<link rel="stylesheet" href="/css/style.css?v=2.5.0">
<style>
    /* Uploads page-specific styles */
    .provider-banner {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: var(--warning-light);
        border: 1px solid rgba(255, 159, 10, 0.25);
        border-radius: var(--radius-md);
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 500;
        color: var(--warning);
    }
    .provider-banner a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
    }
    .provider-banner svg { flex-shrink: 0; }
    .error-group-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        margin-top: 12px;
        margin-bottom: 4px;
        background: rgba(255, 69, 58, 0.06);
        border: 1px solid rgba(255, 69, 58, 0.15);
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        color: var(--danger);
    }
    .error-group-header .error-group-count {
        background: var(--danger-light);
        color: var(--danger);
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
    }
    .error-group-header .error-group-desc {
        color: var(--text-secondary);
        font-weight: 500;
        margin-left: 4px;
    }
    .chip-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 18px;
        padding: 0 6px;
        margin-left: 6px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 11px;
        font-weight: 700;
        color: var(--text-secondary);
    }
    .chip.active .chip-badge {
        background: rgba(0, 122, 255, 0.2);
        color: var(--accent);
    }
    .chip-filter-all .chip-badge { color: var(--text-primary); }
    .chip-filter-pending .chip-badge { color: var(--text-secondary); }
    .chip-filter-waiting .chip-badge { color: var(--accent); }
    .chip-filter-uploading .chip-badge { color: var(--accent); }
    .chip-filter-retrying .chip-badge { color: var(--warning); }
    .chip-filter-failed .chip-badge { color: var(--danger); }
    .chip-filter-completed .chip-badge { color: var(--success); }
    .action-bar {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .action-bar button { min-height: 40px; }
    .td-error {
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .td-error-text {
        font-size: 12px;
        color: var(--text-secondary);
    }
    .td-actions {
        display: flex;
        gap: 4px;
    }
    .btn-sm {
        padding: 4px 10px;
        min-height: 28px;
        font-size: 12px;
    }
    .progress-col {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 80px;
    }
    .progress-pct {
        font-size: 11px;
        color: var(--text-secondary);
        font-weight: 600;
    }
    .card-progress {
        margin: 8px 0 4px;
    }
    .card-retry-info {
        color: var(--warning);
        font-size: 12px;
    }
    .card-error-text {
        font-size: 12px;
        color: var(--danger);
        margin-bottom: 8px;
        line-height: 1.4;
    }
    .empty-msg {
        color: var(--text-secondary);
        display: none;
        text-align: center;
        padding: 60px 0;
        font-weight: 600;
    }
    .filter-chips-scroll {
        margin-bottom: 20px;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
        padding: 4px 0 12px;
    }
    #pauseStatusChip .status-active { color: var(--success); }
    #pauseStatusChip .status-paused { color: var(--warning); }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content has-cards">
    <h1 data-i18n="uploadQueue">Upload Queue</h1>

    <!-- Google Drive not connected banner (hidden by default, shown when waitingForProvider jobs exist) -->
    <div class="provider-banner" id="providerBanner" style="display:none;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span><span data-i18n="connectGoogleDrive">Connect Google Drive in Storage Center</span> &mdash; <a href="/storage.html" data-i18n="storageCenter">Storage Center</a></span>
    </div>

    <!-- Filter chips -->
    <div class="filter-chips filter-chips-scroll" id="filterBar">
        <div class="chip chip-filter-all active" data-filter="all" onclick="setFilter('all')">
            <span data-i18n="all">All</span><span class="chip-badge" id="countAll">0</span>
        </div>
        <div class="chip chip-filter-pending" data-filter="pending" onclick="setFilter('pending')">
            <span data-i18n="pending">Pending</span><span class="chip-badge" id="countPending">0</span>
        </div>
        <div class="chip chip-filter-waiting" data-filter="waitingForProvider" onclick="setFilter('waitingForProvider')">
            <span data-i18n="waitingForProvider">Waiting</span><span class="chip-badge" id="countWaiting">0</span>
        </div>
        <div class="chip chip-filter-uploading" data-filter="uploading" onclick="setFilter('uploading')">
            <span data-i18n="uploading">Uploading</span><span class="chip-badge" id="countUploading">0</span>
        </div>
        <div class="chip chip-filter-retrying" data-filter="retrying" onclick="setFilter('retrying')">
            <span data-i18n="retrying">Retrying</span><span class="chip-badge" id="countRetrying">0</span>
        </div>
        <div class="chip chip-filter-failed" data-filter="failed" onclick="setFilter('failed')">
            <span data-i18n="failed">Failed</span><span class="chip-badge" id="countFailed">0</span>
        </div>
        <div class="chip chip-filter-completed" data-filter="completed" onclick="setFilter('completed')">
            <span data-i18n="completed">Completed</span><span class="chip-badge" id="countCompleted">0</span>
        </div>
        <div class="chip" id="pauseStatusChip" style="cursor:default; margin-left: auto;">
            <span data-i18n="status">Status</span>: <strong id="pauseStatus" data-i18n="active" class="status-active" style="margin-left:6px;">Active</strong>
        </div>
    </div>

    <!-- Quick actions with role-based access -->
    <div class="action-bar">
        <button onclick="retryFailed()" data-role-min="operator">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            <span data-i18n="retryAllFailed">Retry All Failed</span>
        </button>
        <button onclick="togglePause()" id="pauseBtn" class="secondary" data-role-min="operator">Pause</button>
    </div>

    <!-- Error grouping container (shown only when filtered to "failed") -->
    <div id="errorGroupContainer"></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th data-i18n="taskName">File</th>
                    <th data-i18n="status">Status</th>
                    <th data-i18n="provider">Provider</th>
                    <th data-i18n="progress">Progress</th>
                    <th data-i18n="attempts">Attempts</th>
                    <th data-i18n="retryAt">Retry At</th>
                    <th data-i18n="error">Error</th>
                    <th data-i18n="actions">Actions</th>
                </tr>
            </thead>
            <tbody id="queueList"></tbody>
        </table>
    </div>

    <div class="task-cards" id="queueCards"></div>
    <p id="emptyMsg" class="empty-msg" data-i18n="noUploadJobs">No upload jobs in queue.</p>
</main>

<script src="/js/i18n.js?v=2.5.0"></script>
<script src="/js/app.js?v=2.5.0"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('uploadQueue');
    applyRoleVisibility();
});

let isPaused = false;
let currentFilter = 'all';
let allJobs = [];

const ERROR_DESCRIPTIONS = {
    authExpired: 'Authentication expired — reconnect Google Drive',
    quotaExceeded: 'Storage quota exceeded',
    networkUnavailable: 'Network unavailable — will retry',
    permissionDenied: 'Permission denied',
    rateLimited: 'Rate limited — retrying with backoff',
    unknown: 'Unknown error'
};

function formatTime(isoStr) {
    if (!isoStr) return '-';
    try {
        const d = new Date(isoStr);
        return d.toLocaleTimeString();
    } catch { return '-'; }
}

function retryCountdown(nextRetryAt) {
    if (!nextRetryAt) return '';
    const now = new Date();
    const retry = new Date(nextRetryAt);
    const diff = Math.max(0, Math.round((retry - now) / 1000));
    if (diff <= 0) return t('retrying') + '...';
    return formatTime(nextRetryAt) + ' (' + diff + 's)';
}

function progressDisplay(progress, status) {
    if (status === 'completed') return '<span class="badge badge-green">100%</span>';
    if (status !== 'uploading' && status !== 'retrying') return '-';
    const pct = Math.round((progress || 0) * 100);
    return '<div class="progress-col">' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="progress-pct">' + pct + '%</span>' +
        '</div>';
}

function getFilteredJobs(jobs) {
    if (currentFilter === 'all') return jobs;
    return jobs.filter(j => j.status === currentFilter);
}

function setFilter(filter) {
    currentFilter = filter;
    // Update chip active states
    document.querySelectorAll('#filterBar .chip[data-filter]').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.filter === filter);
    });
    renderQueue(allJobs);
}

function updateCounts(jobs) {
    const counts = { all: jobs.length, pending: 0, waitingForProvider: 0, uploading: 0, retrying: 0, failed: 0, completed: 0 };
    jobs.forEach(j => {
        if (counts[j.status] !== undefined) counts[j.status]++;
    });
    document.getElementById('countAll').textContent = counts.all;
    document.getElementById('countPending').textContent = counts.pending;
    document.getElementById('countWaiting').textContent = counts.waitingForProvider;
    document.getElementById('countUploading').textContent = counts.uploading;
    document.getElementById('countRetrying').textContent = counts.retrying;
    document.getElementById('countFailed').textContent = counts.failed;
    document.getElementById('countCompleted').textContent = counts.completed;
}

function checkProviderBanner(jobs) {
    const hasWaiting = jobs.some(j => j.status === 'waitingForProvider');
    document.getElementById('providerBanner').style.display = hasWaiting ? 'flex' : 'none';
}

function renderErrorGroups(failedJobs) {
    const container = document.getElementById('errorGroupContainer');
    if (currentFilter !== 'failed' || failedJobs.length === 0) {
        container.innerHTML = '';
        return;
    }

    // Group by errorClass
    const groups = {};
    failedJobs.forEach(j => {
        const key = j.errorClass || 'unknown';
        if (!groups[key]) groups[key] = [];
        groups[key].push(j);
    });

    let html = '';
    Object.keys(groups).sort().forEach(key => {
        const desc = ERROR_DESCRIPTIONS[key] || key;
        const count = groups[key].length;
        html += '<div class="error-group-header">' +
            '<span class="error-group-count">' + count + '</span>' +
            '<span>' + key + '</span>' +
            '<span class="error-group-desc">— ' + desc + '</span>' +
            '</div>';
    });
    container.innerHTML = html;
}

function buildRowActions(job) {
    let actions = '';
    if (job.status === 'failed' || job.status === 'retrying' || job.status === 'waitingForProvider') {
        actions += '<button class="btn-sm" onclick="retryJob(\'' + job.id + '\')" data-role-min="operator">' + t('retry') + '</button>';
    }
    if (job.status !== 'completed' && job.status !== 'cancelled') {
        actions += '<button class="btn-sm secondary" onclick="cancelJob(\'' + job.id + '\')" data-role-min="operator">' + t('cancel') + '</button>';
    }
    return actions;
}

function renderTableRows(jobs) {
    const statusColors = {
        failed: 'badge-red', completed: 'badge-green',
        uploading: 'badge-blue', retrying: 'badge-orange',
        cancelled: 'badge-neutral', waitingForProvider: 'badge-orange',
        pending: 'badge-neutral'
    };

    return jobs.map(j => {
        const badgeClass = statusColors[j.status] || 'badge-neutral';
        const statusText = t(j.status) || j.status;
        const actions = buildRowActions(j);
        const retryInfo = j.status === 'retrying' && j.nextRetryAt
            ? '<div class="retry-countdown">' + retryCountdown(j.nextRetryAt) + '</div>'
            : '';
        const errorCell = (j.errorClass ? '<span class="error-class-badge" style="margin-right:4px;">' + j.errorClass + '</span>' : '') +
            '<span class="td-error-text">' + (j.lastError || '-') + '</span>';

        return '<tr data-status="' + j.status + '">' +
            '<td><strong>' + j.fileName + '</strong></td>' +
            '<td><span class="badge ' + badgeClass + '">' + statusText + '</span></td>' +
            '<td><strong>' + j.provider + '</strong></td>' +
            '<td>' + progressDisplay(j.progress, j.status) + '</td>' +
            '<td><strong>' + j.attempts + '/' + j.maxRetries + '</strong></td>' +
            '<td>' + retryInfo + '</td>' +
            '<td class="td-error">' + errorCell + '</td>' +
            '<td><div class="td-actions">' + actions + '</div></td>' +
            '</tr>';
    }).join('');
}

function renderCardItems(jobs) {
    const statusBadgeColors = {
        failed: 'badge-red', completed: 'badge-green',
        uploading: 'badge-blue', retrying: 'badge-orange',
        waitingForProvider: 'badge-orange', cancelled: 'badge-neutral',
        pending: 'badge-neutral'
    };

    return jobs.map(j => {
        const badgeClass = statusBadgeColors[j.status] || 'badge-neutral';
        const statusText = t(j.status) || j.status;
        const actions = buildRowActions(j);

        let progressSection = '';
        if (j.status === 'uploading' || j.status === 'retrying') {
            const pct = Math.round((j.progress || 0) * 100);
            progressSection = '<div class="card-progress"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div><span class="progress-pct">' + pct + '%</span></div>';
        }

        const retryInfo = j.status === 'retrying' && j.nextRetryAt
            ? '<span class="card-retry-info">Retry: ' + retryCountdown(j.nextRetryAt) + '</span>'
            : '';

        return '<div class="upload-job-card" data-status="' + j.status + '">' +
            '<div class="upload-job-card-header">' +
            '<span class="upload-job-card-title">' + j.fileName + '</span>' +
            '<span class="badge ' + badgeClass + '">' + statusText + '</span>' +
            '</div>' +
            '<div class="task-card-meta">' +
            '<span>Provider: <strong>' + j.provider + '</strong></span> &middot; ' +
            '<span>Attempts: <strong>' + j.attempts + '/' + j.maxRetries + '</strong></span>' +
            (j.errorClass ? ' &middot; <span class="error-class-badge">' + j.errorClass + '</span>' : '') +
            ' ' + retryInfo +
            '</div>' +
            progressSection +
            (j.lastError ? '<div class="card-error-text">' + j.lastError + '</div>' : '') +
            '<div class="task-card-actions">' + actions + '</div>' +
            '</div>';
    }).join('');
}

function renderQueue(data) {
    // data is the full API response (an array of jobs) or the previously cached array
    const jobs = Array.isArray(data) ? data : allJobs;
    const filtered = getFilteredJobs(jobs);
    const failedJobs = jobs.filter(j => j.status === 'failed');

    const tbody = document.getElementById('queueList');
    const cardsEl = document.getElementById('queueCards');
    const empty = document.getElementById('emptyMsg');

    if (filtered.length === 0) {
        tbody.innerHTML = '';
        cardsEl.innerHTML = '';
        empty.style.display = 'block';
    } else {
        empty.style.display = 'none';
        tbody.innerHTML = renderTableRows(filtered);
        cardsEl.innerHTML = renderCardItems(filtered);
    }

    renderErrorGroups(failedJobs);
    applyRoleVisibility();
}

async function loadQueue() {
    const data = await api('/api/upload/queue');
    if (!data) return;
    isPaused = data.isPaused;
    allJobs = data.jobs || [];

    // Update filter counts
    updateCounts(allJobs);

    // Provider banner
    checkProviderBanner(allJobs);

    // Pause status
    const statusVal = document.getElementById('pauseStatus');
    statusVal.textContent = isPaused ? t('paused') : t('active');
    statusVal.className = isPaused ? 'status-paused' : 'status-active';

    document.getElementById('pauseBtn').textContent = isPaused ? t('resume') : t('pause');

    // Render with current filter
    renderQueue(allJobs);
}

async function retryJob(id) { await api('/api/upload/retry', { method: 'POST', body: { jobID: id } }); loadQueue(); }
async function cancelJob(id) { await api('/api/upload/cancel', { method: 'POST', body: { jobID: id } }); loadQueue(); }
async function retryFailed() { await api('/api/upload/retry-failed', { method: 'POST' }); loadQueue(); }
async function togglePause() {
    const url = isPaused ? '/api/upload/resume' : '/api/upload/pause';
    await api(url, { method: 'POST' });
    loadQueue();
}

loadQueue();
setInterval(loadQueue, 5000);
</script>
</body>
</html>

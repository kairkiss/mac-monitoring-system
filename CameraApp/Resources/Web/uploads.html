<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Upload Queue</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content has-cards">
    <h1 data-i18n="uploadQueue">Upload Queue</h1>
    
    <div class="filter-chips" style="margin-bottom: 20px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; padding: 4px 0 12px;">
        <div class="chip" style="cursor: default;">
            <span data-i18n="total">Total</span>: <strong id="totalCount" style="margin-left: 6px; color: var(--text-primary);">0</strong>
        </div>
        <div class="chip active" style="cursor: default;">
            <span data-i18n="pending">Pending</span>: <strong id="pendingCount" style="margin-left: 6px;">0</strong>
        </div>
        <div class="chip" style="cursor: default; border-color: rgba(255, 159, 10, 0.2);">
            <span style="color: var(--warning); display: flex; align-items: center; gap: 4px;">
                <span data-i18n="retrying">Retrying</span>: <strong id="retryingCount">0</strong>
            </span>
        </div>
        <div class="chip" style="cursor: default; border-color: rgba(255, 69, 58, 0.2);">
            <span style="color: var(--danger); display: flex; align-items: center; gap: 4px;">
                <span data-i18n="failed">Failed</span>: <strong id="failedCount">0</strong>
            </span>
        </div>
        <div class="chip" style="cursor: default; border-color: rgba(0, 122, 255, 0.2);">
            <span style="color: var(--accent); display: flex; align-items: center; gap: 4px;">
                <span data-i18n="waitingForProvider">Waiting</span>: <strong id="waitingCount">0</strong>
            </span>
        </div>
        <div class="chip" style="cursor: default;" id="pauseStatusChip">
            <span data-i18n="status">Status</span>: <strong id="pauseStatus" data-i18n="active" style="margin-left: 6px; color: var(--success);">Active</strong>
        </div>
    </div>
    
    <div style="margin-bottom:20px; display:flex; gap:10px;">
        <button onclick="retryFailed()" style="min-height: 40px;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            <span data-i18n="retryAllFailed">Retry All Failed</span>
        </button>
        <button onclick="togglePause()" id="pauseBtn" class="secondary" style="min-height: 40px;">Pause</button>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th data-i18n="taskName">File</th>
                    <th data-i18n="status">Status</th>
                    <th data-i18n="provider">Provider</th>
                    <th data-i18n="progress">Progress</th>
                    <th data-i18n="attempts">Attempts</th>
                    <th data-i18n="retryAt">Retry At</th>
                    <th data-i18n="error">Error</th>
                    <th data-i18n="actions">Actions</th>
                </tr>
            </thead>
            <tbody id="queueList"></tbody>
        </table>
    </div>
    
    <div class="task-cards" id="queueCards"></div>
    <p id="emptyMsg" style="color:var(--text-secondary); display:none; text-align:center; padding:60px 0; font-weight:600;" data-i18n="noUploadJobs">No upload jobs in queue.</p>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('uploadQueue');
});

let isPaused = false;

function formatTime(isoStr) {
    if (!isoStr) return '-';
    try {
        const d = new Date(isoStr);
        return d.toLocaleTimeString();
    } catch { return '-'; }
}

function retryCountdown(nextRetryAt) {
    if (!nextRetryAt) return '';
    const now = new Date();
    const retry = new Date(nextRetryAt);
    const diff = Math.max(0, Math.round((retry - now) / 1000));
    if (diff <= 0) return t('retrying') + '...';
    return formatTime(nextRetryAt) + ' (' + diff + 's)';
}

function progressDisplay(progress, status) {
    if (status === 'completed') return '<span class="badge badge-green">100%</span>';
    if (status !== 'uploading' && status !== 'retrying') return '-';
    const pct = Math.round((progress || 0) * 100);
    return '<div style="display:flex; flex-direction:column; gap:4px; min-width:80px;">' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<span style="font-size:11px; color:var(--text-secondary); font-weight:600;">' + pct + '%</span>' +
        '</div>';
}

async function loadQueue() {
    const data = await api('/api/upload/queue');
    if (!data) return;
    isPaused = data.isPaused;
    document.getElementById('totalCount').textContent = data.totalJobs;
    document.getElementById('pendingCount').textContent = data.pendingCount;
    document.getElementById('retryingCount').textContent = data.retryingCount || 0;
    document.getElementById('failedCount').textContent = data.failedCount;
    document.getElementById('waitingCount').textContent = data.waitingCount || 0;
    
    const statusVal = document.getElementById('pauseStatus');
    statusVal.textContent = isPaused ? t('paused') : t('active');
    statusVal.style.color = isPaused ? 'var(--warning)' : 'var(--success)';
    
    document.getElementById('pauseBtn').textContent = isPaused ? t('resume') : t('pause');

    const tbody = document.getElementById('queueList');
    const empty = document.getElementById('emptyMsg');
    
    if (data.jobs.length === 0) {
        tbody.innerHTML = '';
        document.getElementById('queueCards').innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    
    tbody.innerHTML = data.jobs.map(j => {
        const statusColors = {
            failed: 'badge-red', completed: 'badge-green',
            uploading: 'badge-blue', retrying: 'badge-orange',
            cancelled: 'badge-neutral', waitingForProvider: 'badge-orange'
        };
        const badgeClass = statusColors[j.status] || 'badge-neutral';
        const statusText = t(j.status) || j.status;

        let actions = '';
        if (j.status === 'failed' || j.status === 'retrying' || j.status === 'waitingForProvider') {
            actions += '<button onclick="retryJob(\'' + j.id + '\')" style="padding:4px 10px; min-height:28px; font-size:12px;">' + t('retry') + '</button>';
        }
        if (j.status !== 'completed' && j.status !== 'cancelled') {
            actions += ' <button class="secondary" onclick="cancelJob(\'' + j.id + '\')" style="padding:4px 10px; min-height:28px; font-size:12px;">' + t('cancel') + '</button>';
        }

        const retryInfo = j.status === 'retrying' && j.nextRetryAt
            ? '<div class="retry-countdown">' + retryCountdown(j.nextRetryAt) + '</div>'
            : '';

        return '<tr>' +
            '<td><strong>' + j.fileName + '</strong></td>' +
            '<td><span class="badge ' + badgeClass + '">' + statusText + '</span></td>' +
            '<td><strong>' + j.provider + '</strong></td>' +
            '<td>' + progressDisplay(j.progress, j.status) + '</td>' +
            '<td><strong>' + j.attempts + '/' + j.maxRetries + '</strong></td>' +
            '<td>' + retryInfo + '</td>' +
            '<td style="max-width:200px; overflow:hidden; text-overflow:ellipsis">' + (j.errorClass ? '<span class="error-class-badge" style="margin-right:4px;">' + j.errorClass + '</span>' : '') + '<span style="font-size:12px; color:var(--text-secondary);">' + (j.lastError || '-') + '</span></td>' +
            '<td><div style="display:flex; gap:4px;">' + actions + '</div></td>' +
            '</tr>';
    }).join('');
    
    // Mobile cards
    const cardsEl = document.getElementById('queueCards');
    cardsEl.innerHTML = data.jobs.map(j => {
        const statusBadgeColors = { failed: 'badge-red', completed: 'badge-green', uploading: 'badge-blue', retrying: 'badge-orange', waitingForProvider: 'badge-orange', cancelled: 'badge-neutral' };
        const badgeClass = statusBadgeColors[j.status] || 'badge-neutral';
        const statusText = t(j.status) || j.status;
        let actions = '';
        if (j.status === 'failed' || j.status === 'retrying' || j.status === 'waitingForProvider') {
            actions += '<button onclick="retryJob(\'' + j.id + '\')">' + t('retry') + '</button>';
        }
        if (j.status !== 'completed' && j.status !== 'cancelled') {
            actions += '<button class="secondary" onclick="cancelJob(\'' + j.id + '\')">' + t('cancel') + '</button>';
        }
        
        let progressSection = '';
        if (j.status === 'uploading' || j.status === 'retrying') {
            const pct = Math.round((j.progress || 0) * 100);
            progressSection = '<div style="margin: 8px 0 4px;"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div><span style="font-size:11px; color:var(--text-secondary); font-weight:600;">' + pct + '%</span></div>';
        }

        const retryInfo = j.status === 'retrying' && j.nextRetryAt
            ? '<span style="color:var(--warning); font-size:12px;">Retry: ' + retryCountdown(j.nextRetryAt) + '</span>'
            : '';

        return '<div class="upload-job-card"><div class="upload-job-card-header"><span class="upload-job-card-title">' + j.fileName + '</span><span class="badge ' + badgeClass + '">' + statusText + '</span></div><div class="task-card-meta"><span>Provider: <strong>' + j.provider + '</strong></span> &middot; <span>Attempts: <strong>' + j.attempts + '/' + j.maxRetries + '</strong></span>' + (j.errorClass ? ' &middot; <span class="error-class-badge">' + j.errorClass + '</span>' : '') + ' ' + retryInfo + '</div>' + progressSection + (j.lastError ? '<div style="font-size:12px; color:var(--danger); margin-bottom:8px; line-height:1.4;">' + j.lastError + '</div>' : '') + '<div class="task-card-actions">' + actions + '</div></div>';
    }).join('');
}

async function retryJob(id) { await api('/api/upload/retry', { method: 'POST', body: { jobID: id } }); loadQueue(); }
async function cancelJob(id) { await api('/api/upload/cancel', { method: 'POST', body: { jobID: id } }); loadQueue(); }
async function retryFailed() { await api('/api/upload/retry-failed', { method: 'POST' }); loadQueue(); }
async function togglePause() {
    const url = isPaused ? '/api/upload/resume' : '/api/upload/pause';
    await api(url, { method: 'POST' });
    loadQueue();
}

loadQueue();
setInterval(loadQueue, 5000);
</script>
</body>
</html>

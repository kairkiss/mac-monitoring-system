<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="macMonitorSystem">Mac监控系统 - Automation</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal { background:#242424; border-radius:12px; padding:24px; width:480px; max-width:90vw; max-height:80vh; overflow-y:auto; }
.modal h2 { margin:0 0 16px; font-size:18px; }
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:13px; color:#a0a0a0; margin-bottom:4px; }
.form-group input, .form-group select { width:100%; padding:8px 10px; background:#1a1a1a; border:1px solid #333; border-radius:6px; color:#e0e0e0; font-size:14px; box-sizing:border-box; }
.form-row { display:flex; gap:10px; }
.form-row .form-group { flex:1; }
.checkbox-group { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.checkbox-group input { width:auto; }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
.weekday-btns { display:flex; gap:4px; }
.weekday-btns button { width:36px; height:36px; border-radius:50%; border:1px solid #444; background:#1a1a1a; color:#a0a0a0; cursor:pointer; font-size:12px; }
.weekday-btns button.active { background:#0a84ff; color:#fff; border-color:#0a84ff; }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar">
    <div class="sidebar-header" data-i18n="appName">Mac监控系统</div>
    <a href="/" class="nav-item" data-i18n="dashboard">Dashboard</a>
    <a href="/live.html" class="nav-item" data-i18n="liveView">Live View</a>
    <a href="/media.html" class="nav-item" data-i18n="mediaLibrary">Media Library</a>
    <a href="/tasks.html" class="nav-item active" data-i18n="automation">Automation</a>
    <a href="/uploads.html" class="nav-item" data-i18n="uploadQueue">Upload Queue</a>
    <a href="/health.html" class="nav-item" data-i18n="health">Health</a>
    <a href="/logs.html" class="nav-item" data-i18n="activityLog">Activity Log</a>
    <a href="/settings.html" class="nav-item" data-i18n="settings">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout" data-i18n="logout">Logout</a></div>
</nav>
<main class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h1 data-i18n="automation" style="margin:0;">Automation Tasks</h1>
        <button onclick="openCreateModal()" data-i18n="createTask">Create Task</button>
    </div>
    <table>
        <thead><tr><th data-i18n="taskName">Name</th><th data-i18n="taskType">Type</th><th data-i18n="status">Status</th><th data-i18n="nextFire">Next Fire</th><th data-i18n="uploadToCloud">Upload</th><th data-i18n="actions">Actions</th></tr></thead>
        <tbody id="taskList"></tbody>
    </table>
    <h2 style="margin-top:24px;font-size:18px;" data-i18n="executionHistory">Execution History</h2>
    <table>
        <thead><tr><th data-i18n="taskName">Task</th><th data-i18n="time">Time</th><th data-i18n="result">Result</th><th data-i18n="detail">Detail</th></tr></thead>
        <tbody id="historyList"></tbody>
    </table>
</main>

<!-- Task Modal -->
<div class="modal-overlay" id="taskModal">
<div class="modal">
    <h2 id="modalTitle" data-i18n="createTask">Create Task</h2>
    <div class="form-group">
        <label data-i18n="taskName">Task Name</label>
        <input type="text" id="taskNameInput" placeholder="e.g. Morning Snapshot">
    </div>
    <div class="form-row">
        <div class="form-group">
            <label data-i18n="taskType">Task Type</label>
            <select id="taskTypeInput" onchange="updateTypeFields()">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="countdown">Countdown</option>
                <option value="interval">Interval</option>
            </select>
        </div>
        <div class="form-group" id="hourGroup">
            <label>Hour</label>
            <input type="number" id="hourInput" min="0" max="23" value="8">
        </div>
        <div class="form-group" id="minuteGroup">
            <label>Minute</label>
            <input type="number" id="minuteInput" min="0" max="59" value="0">
        </div>
    </div>
    <div class="form-group" id="weekdayGroup">
        <label>Weekdays</label>
        <div class="weekday-btns" id="weekdayBtns"></div>
    </div>
    <div class="form-row" id="countdownGroup" style="display:none;">
        <div class="form-group">
            <label data-i18n="countdown">Countdown (minutes)</label>
            <input type="number" id="countdownInput" min="1" value="30">
        </div>
    </div>
    <div class="form-row" id="intervalGroup" style="display:none;">
        <div class="form-group">
            <label data-i18n="interval">Interval (minutes)</label>
            <input type="number" id="intervalInput" min="1" value="10">
        </div>
        <div class="form-group">
            <label>Duration (minutes, 0=forever)</label>
            <input type="number" id="durationInput" min="0" value="120">
        </div>
    </div>
    <div class="checkbox-group">
        <input type="checkbox" id="telegramInput">
        <label for="telegramInput">Send to Telegram</label>
    </div>
    <div class="checkbox-group">
        <input type="checkbox" id="uploadInput">
        <label for="uploadInput" data-i18n="uploadToCloud">Upload to Cloud</label>
    </div>
    <div class="checkbox-group">
        <input type="checkbox" id="enabledInput" checked>
        <label for="enabledInput" data-i18n="enabled">Enabled</label>
    </div>
    <div class="modal-actions">
        <button class="secondary" onclick="closeModal()" data-i18n="cancelEdit">Cancel</button>
        <button onclick="saveTask()" data-i18n="saveTask">Save Task</button>
    </div>
    <input type="hidden" id="editTaskId" value="">
</div>
</div>

<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('automation');
    initWeekdayBtns();
});

const WEEKDAY_LABELS = ['S','M','T','W','T','F','S'];
let selectedWeekdays = new Set([2,3,4,5,6]);

function initWeekdayBtns() {
    const container = document.getElementById('weekdayBtns');
    container.innerHTML = '';
    for (let i = 0; i < 7; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = WEEKDAY_LABELS[i];
        btn.dataset.day = i + 1;
        if (selectedWeekdays.has(i + 1)) btn.classList.add('active');
        btn.onclick = () => {
            const day = i + 1;
            if (selectedWeekdays.has(day)) { selectedWeekdays.delete(day); btn.classList.remove('active'); }
            else { selectedWeekdays.add(day); btn.classList.add('active'); }
        };
        container.appendChild(btn);
    }
}

function updateTypeFields() {
    const type = document.getElementById('taskTypeInput').value;
    document.getElementById('hourGroup').style.display = (type === 'daily' || type === 'weekly') ? '' : 'none';
    document.getElementById('minuteGroup').style.display = (type === 'daily' || type === 'weekly') ? '' : 'none';
    document.getElementById('weekdayGroup').style.display = type === 'weekly' ? '' : 'none';
    document.getElementById('countdownGroup').style.display = type === 'countdown' ? 'flex' : 'none';
    document.getElementById('intervalGroup').style.display = type === 'interval' ? 'flex' : 'none';
}

function openCreateModal() {
    document.getElementById('editTaskId').value = '';
    document.getElementById('modalTitle').textContent = t('createTask');
    document.getElementById('taskNameInput').value = '';
    document.getElementById('taskTypeInput').value = 'daily';
    document.getElementById('hourInput').value = 8;
    document.getElementById('minuteInput').value = 0;
    document.getElementById('countdownInput').value = 30;
    document.getElementById('intervalInput').value = 10;
    document.getElementById('durationInput').value = 120;
    document.getElementById('telegramInput').checked = false;
    document.getElementById('uploadInput').checked = false;
    document.getElementById('enabledInput').checked = true;
    selectedWeekdays = new Set([2,3,4,5,6]);
    initWeekdayBtns();
    updateTypeFields();
    document.getElementById('taskModal').classList.add('active');
}

function openEditModal(task) {
    document.getElementById('editTaskId').value = task.id;
    document.getElementById('modalTitle').textContent = t('editTask');
    document.getElementById('taskNameInput').value = task.name;
    document.getElementById('taskTypeInput').value = task.type;
    document.getElementById('hourInput').value = task.hour;
    document.getElementById('minuteInput').value = task.minute;
    document.getElementById('countdownInput').value = task.countdownMinutes;
    document.getElementById('intervalInput').value = task.intervalMinutes;
    document.getElementById('durationInput').value = task.durationMinutes;
    document.getElementById('telegramInput').checked = task.telegramSend;
    document.getElementById('uploadInput').checked = task.uploadToCloud;
    document.getElementById('enabledInput').checked = task.isEnabled;
    selectedWeekdays = new Set(task.weekdays || [2,3,4,5,6]);
    initWeekdayBtns();
    updateTypeFields();
    document.getElementById('taskModal').classList.add('active');
}

function closeModal() { document.getElementById('taskModal').classList.remove('active'); }

async function saveTask() {
    const editId = document.getElementById('editTaskId').value;
    const body = {
        name: document.getElementById('taskNameInput').value,
        type: document.getElementById('taskTypeInput').value,
        isEnabled: document.getElementById('enabledInput').checked,
        hour: parseInt(document.getElementById('hourInput').value) || 8,
        minute: parseInt(document.getElementById('minuteInput').value) || 0,
        weekdays: Array.from(selectedWeekdays),
        countdownMinutes: parseInt(document.getElementById('countdownInput').value) || 30,
        intervalMinutes: parseInt(document.getElementById('intervalInput').value) || 10,
        durationMinutes: parseInt(document.getElementById('durationInput').value) || 120,
        telegramSend: document.getElementById('telegramInput').checked,
        uploadToCloud: document.getElementById('uploadInput').checked
    };
    if (editId) {
        await api(`/api/tasks/${editId}`, { method: 'PUT', body });
    } else {
        await api('/api/tasks', { method: 'POST', body });
    }
    closeModal();
    loadTasks();
}

async function loadTasks() {
    const data = await api('/api/tasks');
    if (!data) return;
    document.getElementById('taskList').innerHTML = data.tasks.map(task => {
        const typeLabel = task.type === 'daily' ? t('daily') : task.type === 'weekly' ? t('weekly') : task.type === 'countdown' ? t('countdown') : t('interval');
        const uploadBadge = task.uploadToCloud ? '<span class="badge badge-blue">' + t('uploadToCloud') + '</span>' : '<span class="badge">' + t('localOnlyBadge') + '</span>';
        return `<tr>
            <td>${task.name || typeLabel}</td>
            <td>${typeLabel}</td>
            <td>${task.isEnabled ? '<span class="badge badge-green">' + t('enabled') + '</span>' : '<span class="badge badge-red">' + t('disabled') + '</span>'}</td>
            <td>${task.nextFireTime ? new Date(task.nextFireTime).toLocaleString() : '-'}</td>
            <td>${uploadBadge}</td>
            <td>
                <button class="secondary" onclick="editTask('${task.id}')" style="margin-right:4px;">${t('editTask')}</button>
                <button class="secondary" onclick="toggleTask('${task.id}')" style="margin-right:4px;">${t('toggle')}</button>
                <button class="danger" onclick="deleteTask('${task.id}')">${t('delete')}</button>
            </td>
        </tr>`;
    }).join('');
    const hist = await api('/api/tasks/history');
    if (hist) {
        document.getElementById('historyList').innerHTML = hist.history.map(h =>
            `<tr><td>${h.taskName}</td><td>${new Date(h.executedAt).toLocaleString()}</td>
            <td>${h.success ? '<span class="badge badge-green">' + t('ok') + '</span>' : '<span class="badge badge-red">' + t('failed') + '</span>'}</td>
            <td>${h.detail}</td></tr>`
        ).join('');
    }
}

async function editTask(id) {
    const data = await api(`/api/tasks/${id}`);
    if (data) openEditModal(data);
}

async function toggleTask(id) { await api(`/api/tasks/${id}/toggle`, { method: 'POST', body: {} }); loadTasks(); }

async function deleteTask(id) {
    if (!confirm(t('confirmDelete'))) return;
    await api(`/api/tasks/${id}`, { method: 'DELETE' });
    loadTasks();
}

loadTasks();
</script>
</body>
</html>

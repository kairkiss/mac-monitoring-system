<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Automation</title>
<link rel="stylesheet" href="/css/style.css?v=2.4.13">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content has-cards">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;">
        <h1 data-i18n="automation" style="margin:0;">Automation Tasks</h1>
        <button onclick="openCreateModal()" style="min-height:42px;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span data-i18n="createTask">Create Task</span>
        </button>
    </div>
    
    <!-- Table for Desktop -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th data-i18n="taskName">Name</th>
                    <th data-i18n="actionType">Action</th>
                    <th data-i18n="taskType">Type</th>
                    <th data-i18n="status">Status</th>
                    <th data-i18n="nextFire">Next Fire</th>
                    <th data-i18n="uploadTarget">Upload Target</th>
                    <th data-i18n="actions">Actions</th>
                </tr>
            </thead>
            <tbody id="taskList"></tbody>
        </table>
    </div>
    
    <!-- Cards for Mobile -->
    <div class="task-cards" id="taskCards"></div>
    
    <!-- History Feed -->
    <h2 style="margin-top:36px;" data-i18n="executionHistory">Execution History</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th data-i18n="taskName">Task</th>
                    <th data-i18n="time">Time</th>
                    <th data-i18n="result">Result</th>
                    <th data-i18n="detail">Detail</th>
                </tr>
            </thead>
            <tbody id="historyList"></tbody>
        </table>
    </div>
</main>

<!-- Step-like Redesigned Task Modal -->
<div class="modal-overlay" id="taskModal">
<div class="modal" style="padding: 24px; max-width: 480px;">
    <h2 id="modalTitle" style="font-size:18px; margin-bottom:16px;" data-i18n="createTask">Create Task</h2>
    
    <div style="display:flex; flex-direction:column; gap:20px;">
        
        <!-- SECTION 1: What to Capture -->
        <div style="border-bottom:1px solid var(--border-subtle); padding-bottom:16px;">
            <div style="font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;" data-i18n="whatToCapture">What to Capture</div>
            <div class="form-group">
                <label data-i18n="taskName">Task Name</label>
                <input type="text" id="taskNameInput" placeholder="e.g. Morning Snapshot">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label data-i18n="actionType">Action Type</label>
                    <select id="actionTypeInput" onchange="updateActionFields()">
                        <option value="photo" data-i18n="photo">Photo</option>
                        <option value="video" data-i18n="video">Video</option>
                    </select>
                </div>
                <div class="form-group" id="videoDurationGroup" style="display:none;">
                    <label data-i18n="videoDuration">Video Duration (sec)</label>
                    <input type="number" id="videoDurationInput" min="5" max="3600" value="30">
                </div>
            </div>
        </div>

        <!-- SECTION 2: When to Run -->
        <div style="border-bottom:1px solid var(--border-subtle); padding-bottom:16px;">
            <div style="font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;" data-i18n="whenToRun">When to Run</div>
            <div class="form-group">
                <label data-i18n="taskType">Task Type</label>
                <select id="taskTypeInput" onchange="updateTypeFields()">
                    <option value="daily" data-i18n="daily">Daily</option>
                    <option value="weekly" data-i18n="weekly">Weekly</option>
                    <option value="countdown" data-i18n="countdown">Countdown</option>
                    <option value="interval" data-i18n="interval">Interval</option>
                </select>
            </div>
            
            <!-- Daily/Weekly Hour & Minute -->
            <div class="form-row" id="timeFields">
                <div class="form-group" id="hourGroup">
                    <label>Hour</label>
                    <input type="number" id="hourInput" min="0" max="23" value="8">
                </div>
                <div class="form-group" id="minuteGroup">
                    <label>Minute</label>
                    <input type="number" id="minuteInput" min="0" max="59" value="0">
                </div>
            </div>
            
            <!-- Weekly Day Selector -->
            <div class="form-group" id="weekdayGroup" style="display:none;">
                <label>Weekdays</label>
                <div class="weekday-btns" id="weekdayBtns"></div>
            </div>
            
            <!-- Countdown minutes selector -->
            <div class="form-row" id="countdownGroup" style="display:none;">
                <div class="form-group">
                    <label data-i18n="countdown">Countdown (minutes)</label>
                    <input type="number" id="countdownInput" min="1" value="30">
                </div>
            </div>
            
            <!-- Interval settings selector -->
            <div class="form-row" id="intervalGroup" style="display:none;">
                <div class="form-group">
                    <label data-i18n="interval">Interval (minutes)</label>
                    <input type="number" id="intervalInput" min="1" value="10">
                </div>
                <div class="form-group">
                    <label>Run Duration (minutes, 0=forever)</label>
                    <input type="number" id="intervalRunDurationInput" min="0" value="120">
                </div>
            </div>
        </div>

        <!-- SECTION 3: Cloud Upload -->
        <div style="border-bottom:1px solid var(--border-subtle); padding-bottom:16px;">
            <div style="font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;" data-i18n="cloudUpload">Cloud Upload</div>
            <div class="checkbox-group">
                <input type="checkbox" id="uploadInput" class="ios-toggle" onchange="toggleUploadProvider()">
                <label for="uploadInput" class="ios-toggle-label" style="margin-right:8px;"></label>
                <label for="uploadInput" data-i18n="uploadToCloud">Upload to Cloud</label>
            </div>
            
            <!-- Provider selector -->
            <div class="form-group" id="uploadProviderGroup" style="display:none; margin-top:10px;">
                <label data-i18n="uploadProvider">Upload Provider</label>
                <select id="uploadProviderInput" onchange="updateGDWarning()">
                    <option value="">Default</option>
                    <option value="localFolder">Local Folder</option>
                    <option value="mountedFolder">Mounted Folder</option>
                    <option value="googleDrive">Google Drive</option>
                </select>
                
                <!-- GDrive disconnected warning alert -->
                <div id="gdWarning" style="display:none; background:rgba(255,69,58,0.06); border:1px solid rgba(255,69,58,0.2); padding:10px 14px; margin-top:8px; border-radius:var(--radius-md); display:flex; align-items:center; gap:8px;">
                    <span style="color:var(--danger); font-size:18px;">⚠️</span>
                    <span style="font-size:12px; color:var(--text-primary); font-weight:600;" data-i18n="googleDriveNotConnected">Google Drive not connected. Go to Storage to connect.</span>
                </div>
            </div>
        </div>

        <!-- SECTION 4: Options -->
        <div>
            <div style="font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;" data-i18n="taskOptions">Task Options</div>
            <div class="checkbox-group">
                <input type="checkbox" id="telegramInput" class="ios-toggle">
                <label for="telegramInput" class="ios-toggle-label" style="margin-right:8px;"></label>
                <label for="telegramInput">Send to Telegram</label>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="enabledInput" class="ios-toggle" checked>
                <label for="enabledInput" class="ios-toggle-label" style="margin-right:8px;"></label>
                <label for="enabledInput" data-i18n="enabled">Enabled</label>
            </div>
        </div>
    </div>
    
    <div class="modal-actions" style="margin-top: 24px;">
        <button class="secondary" onclick="closeModal()" data-i18n="cancelEdit" style="min-height:38px;">Cancel</button>
        <button onclick="saveTask()" data-i18n="saveTask" style="min-height:38px;">Save Task</button>
    </div>
    <input type="hidden" id="editTaskId" value="">
</div>
</div>

<script src="/js/i18n.js?v=2.4.13"></script>
<script src="/js/app.js?v=2.4.13"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('automation');
    initWeekdayBtns();
    loadTasks();
});

const WEEKDAY_LABELS = ['S','M','T','W','T','F','S'];
let selectedWeekdays = new Set([2,3,4,5,6]);
let isGDConnected = false;

function initWeekdayBtns() {
    const container = document.getElementById('weekdayBtns');
    container.innerHTML = '';
    for (let i = 0; i < 7; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = WEEKDAY_LABELS[i];
        btn.dataset.day = i + 1;
        if (selectedWeekdays.has(i + 1)) btn.classList.add('active');
        btn.onclick = () => {
            const day = i + 1;
            if (selectedWeekdays.has(day)) { selectedWeekdays.delete(day); btn.classList.remove('active'); }
            else { selectedWeekdays.add(day); btn.classList.add('active'); }
        };
        container.appendChild(btn);
    }
}

function updateTypeFields() {
    const type = document.getElementById('taskTypeInput').value;
    const isScheduled = (type === 'daily' || type === 'weekly');
    document.getElementById('timeFields').style.display = isScheduled ? 'flex' : 'none';
    document.getElementById('weekdayGroup').style.display = type === 'weekly' ? 'block' : 'none';
    document.getElementById('countdownGroup').style.display = type === 'countdown' ? 'flex' : 'none';
    document.getElementById('intervalGroup').style.display = type === 'interval' ? 'flex' : 'none';
}

function updateActionFields() {
    const action = document.getElementById('actionTypeInput').value;
    document.getElementById('videoDurationGroup').style.display = action === 'video' ? 'block' : 'none';
}

function toggleUploadProvider() {
    const checked = document.getElementById('uploadInput').checked;
    document.getElementById('uploadProviderGroup').style.display = checked ? 'block' : 'none';
    if (checked) {
        checkGDConnection();
    }
}

async function checkGDConnection() {
    try {
        const data = await api('/api/storage/providers');
        if (data) {
            const gd = data.providers.find(p => p.type === 'googleDrive');
            isGDConnected = gd && gd.isConnected;
        }
    } catch (e) {
        isGDConnected = false;
    }
    updateGDWarning();
}

function updateGDWarning() {
    const provider = document.getElementById('uploadProviderInput').value;
    const warnEl = document.getElementById('gdWarning');
    if (provider === 'googleDrive' && !isGDConnected) {
        warnEl.style.display = 'flex';
    } else {
        warnEl.style.display = 'none';
    }
}

function openCreateModal() {
    document.getElementById('editTaskId').value = '';
    document.getElementById('modalTitle').textContent = t('createTask');
    document.getElementById('taskNameInput').value = '';
    document.getElementById('actionTypeInput').value = 'photo';
    document.getElementById('taskTypeInput').value = 'daily';
    document.getElementById('hourInput').value = 8;
    document.getElementById('minuteInput').value = 0;
    document.getElementById('countdownInput').value = 30;
    document.getElementById('intervalInput').value = 10;
    document.getElementById('intervalRunDurationInput').value = 120;
    document.getElementById('videoDurationInput').value = 30;
    document.getElementById('telegramInput').checked = false;
    document.getElementById('uploadInput').checked = false;
    document.getElementById('uploadProviderInput').value = '';
    document.getElementById('enabledInput').checked = true;
    selectedWeekdays = new Set([2,3,4,5,6]);
    initWeekdayBtns();
    updateTypeFields();
    updateActionFields();
    toggleUploadProvider();
    document.getElementById('taskModal').classList.add('active');
}

function openEditModal(task) {
    document.getElementById('editTaskId').value = task.id;
    document.getElementById('modalTitle').textContent = t('editTask');
    document.getElementById('taskNameInput').value = task.name;
    document.getElementById('actionTypeInput').value = task.actionType || 'photo';
    document.getElementById('taskTypeInput').value = task.type;
    document.getElementById('hourInput').value = task.hour;
    document.getElementById('minuteInput').value = task.minute;
    document.getElementById('countdownInput').value = task.countdownMinutes;
    document.getElementById('intervalInput').value = task.intervalMinutes;
    document.getElementById('intervalRunDurationInput').value = task.intervalRunDurationMinutes || task.durationMinutes || 120;
    document.getElementById('videoDurationInput').value = task.videoDurationSeconds || 30;
    document.getElementById('telegramInput').checked = task.telegramSend;
    document.getElementById('uploadInput').checked = task.uploadToCloud;
    document.getElementById('uploadProviderInput').value = task.uploadProvider || '';
    document.getElementById('enabledInput').checked = task.isEnabled;
    selectedWeekdays = new Set(task.weekdays || [2,3,4,5,6]);
    initWeekdayBtns();
    updateTypeFields();
    updateActionFields();
    toggleUploadProvider();
    document.getElementById('taskModal').classList.add('active');
}

function closeModal() { document.getElementById('taskModal').classList.remove('active'); }

async function saveTask() {
    const editId = document.getElementById('editTaskId').value;
    const actionType = document.getElementById('actionTypeInput').value;
    const uploadProvider = document.getElementById('uploadProviderInput').value;
    const body = {
        name: document.getElementById('taskNameInput').value,
        type: document.getElementById('taskTypeInput').value,
        actionType: actionType,
        isEnabled: document.getElementById('enabledInput').checked,
        hour: parseInt(document.getElementById('hourInput').value) || 8,
        minute: parseInt(document.getElementById('minuteInput').value) || 0,
        weekdays: Array.from(selectedWeekdays),
        countdownMinutes: parseInt(document.getElementById('countdownInput').value) || 30,
        intervalMinutes: parseInt(document.getElementById('intervalInput').value) || 10,
        intervalRunDurationMinutes: parseInt(document.getElementById('intervalRunDurationInput').value) || 0,
        durationMinutes: parseInt(document.getElementById('intervalRunDurationInput').value) || 120,
        videoDurationSeconds: parseInt(document.getElementById('videoDurationInput').value) || 30,
        telegramSend: document.getElementById('telegramInput').checked,
        uploadToCloud: document.getElementById('uploadInput').checked,
        uploadProvider: uploadProvider || null
    };
    if (editId) {
        await api(`/api/tasks/${editId}`, { method: 'PUT', body });
    } else {
        await api('/api/tasks', { method: 'POST', body });
    }
    closeModal();
    loadTasks();
}

async function loadTasks() {
    const data = await api('/api/tasks');
    if (!data) return;
    document.getElementById('taskList').innerHTML = data.tasks.map(task => {
        const typeLabel = task.type === 'daily' ? t('daily') : task.type === 'weekly' ? t('weekly') : task.type === 'countdown' ? t('countdown') : t('interval');
        const actionLabel = task.actionType === 'video' ? t('video') : t('photo');
        const providerLabel = task.uploadProvider === 'googleDrive' ? 'Google Drive' : task.uploadProvider === 'localFolder' ? 'Local Folder' : task.uploadProvider === 'mountedFolder' ? 'Mounted Folder' : (task.uploadProvider || '');
        const uploadBadge = task.uploadToCloud ? '<span class="badge badge-blue">' + t('uploadToCloud') + (providerLabel ? ' (' + providerLabel + ')' : '') + '</span>' : '<span class="badge badge-neutral">' + t('localOnly') + '</span>';
        return `<tr>
            <td><strong>${task.name || typeLabel}</strong></td>
            <td><span class="badge ${task.actionType === 'video' ? 'badge-orange' : 'badge-blue'}">${actionLabel}</span></td>
            <td>${typeLabel}</td>
            <td>${task.isEnabled ? '<span class="badge badge-green">' + t('enabled') + '</span>' : '<span class="badge badge-red">' + t('disabled') + '</span>'}</td>
            <td>${task.nextFireTime ? new Date(task.nextFireTime).toLocaleString() : '-'}</td>
            <td>${uploadBadge}</td>
            <td>
                <button class="secondary" onclick="editTask('${task.id}')" style="margin-right:4px;">${t('edit')}</button>
                <button class="secondary" onclick="toggleTask('${task.id}')" style="margin-right:4px;">${t('toggle')}</button>
                <button class="danger" onclick="deleteTask('${task.id}')">${t('delete')}</button>
            </td>
        </tr>`;
    }).join('');
    
    // Mobile cards
    document.getElementById('taskCards').innerHTML = data.tasks.map(task => {
        const typeLabel = task.type === 'daily' ? t('daily') : task.type === 'weekly' ? t('weekly') : task.type === 'countdown' ? t('countdown') : t('interval');
        const actionLabel = task.actionType === 'video' ? t('video') : t('photo');
        const providerLabel = task.uploadProvider === 'googleDrive' ? 'Google Drive' : task.uploadProvider === 'localFolder' ? 'Local Folder' : task.uploadProvider === 'mountedFolder' ? 'Mounted Folder' : (task.uploadProvider || '');
        const uploadBadge = task.uploadToCloud ? '<span class="badge badge-blue">' + t('uploadToCloud') + (providerLabel ? ' (' + providerLabel + ')' : '') + '</span>' : '<span class="badge badge-neutral">' + t('localOnly') + '</span>';
        const statusBadge = task.isEnabled ? '<span class="badge badge-green">' + t('enabled') + '</span>' : '<span class="badge badge-red">' + t('disabled') + '</span>';
        const nextFire = task.nextFireTime ? new Date(task.nextFireTime).toLocaleString() : '-';
        return `<div class="task-card">
            <div class="task-card-header">
                <span class="task-card-title">${task.name || typeLabel}</span>
                ${statusBadge}
            </div>
            <div class="task-card-meta">
                <span><span class="badge ${task.actionType === 'video' ? 'badge-orange' : 'badge-blue'}" style="font-size:9px; padding:1px 4px;">${actionLabel}</span></span>
                <span>Type: <strong>${typeLabel}</strong></span>
                <span>Next: <strong>${nextFire}</strong></span>
                ${uploadBadge}
            </div>
            <div class="task-card-actions">
                <button class="secondary" onclick="editTask('${task.id}')">${t('edit')}</button>
                <button class="secondary" onclick="toggleTask('${task.id}')">${t('toggle')}</button>
                <button class="danger" onclick="deleteTask('${task.id}')">${t('delete')}</button>
            </div>
        </div>`;
    }).join('');
    
    // Execution History List
    const hist = await api('/api/tasks/history');
    if (hist) {
        document.getElementById('historyList').innerHTML = hist.history.map(h =>
            `<tr>
                <td><strong>${h.taskName}</strong></td>
                <td>${new Date(h.executedAt).toLocaleString()}</td>
                <td>${h.success ? '<span class="badge badge-green">' + t('ok') + '</span>' : '<span class="badge badge-red">' + t('failed') + '</span>'}</td>
                <td style="font-size:13px; color:var(--text-secondary);">${h.detail}</td>
            </tr>`
        ).join('');
    }
}

async function editTask(id) {
    const data = await api(`/api/tasks/${id}`);
    if (data) openEditModal(data);
}

async function toggleTask(id) { await api(`/api/tasks/${id}/toggle`, { method: 'POST', body: {} }); loadTasks(); }

async function deleteTask(id) {
    if (!confirm(t('confirmDelete'))) return;
    await api(`/api/tasks/${id}`, { method: 'DELETE' });
    loadTasks();
}
</script>
</body>
</html>

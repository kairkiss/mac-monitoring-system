<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="macMonitorSystem">Mac监控系统 - Automation</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header" data-i18n="appName">Mac监控系统</div>
    <a href="/" class="nav-item" data-i18n="dashboard">Dashboard</a>
    <a href="/live.html" class="nav-item" data-i18n="liveView">Live View</a>
    <a href="/media.html" class="nav-item" data-i18n="mediaLibrary">Media Library</a>
    <a href="/tasks.html" class="nav-item active" data-i18n="automation">Automation</a>
    <a href="/uploads.html" class="nav-item" data-i18n="uploadQueue">Upload Queue</a>
    <a href="/health.html" class="nav-item" data-i18n="health">Health</a>
    <a href="/logs.html" class="nav-item" data-i18n="activityLog">Activity Log</a>
    <a href="/settings.html" class="nav-item" data-i18n="settings">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout" data-i18n="logout">Logout</a></div>
</nav>
<main class="content">
    <h1 data-i18n="automation">Automation Tasks</h1>
    <table>
        <thead><tr><th data-i18n="taskName">Name</th><th data-i18n="taskType">Type</th><th data-i18n="status">Status</th><th data-i18n="nextFire">Next Fire</th><th data-i18n="actions">Actions</th></tr></thead>
        <tbody id="taskList"></tbody>
    </table>
    <h2 style="margin-top:24px;font-size:18px;" data-i18n="executionHistory">Execution History</h2>
    <table>
        <thead><tr><th data-i18n="taskName">Task</th><th data-i18n="time">Time</th><th data-i18n="result">Result</th><th data-i18n="detail">Detail</th></tr></thead>
        <tbody id="historyList"></tbody>
    </table>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('automation');
});

async function loadTasks() {
    const data = await api('/api/tasks');
    if (!data) return;
    document.getElementById('taskList').innerHTML = data.tasks.map(task =>
        `<tr>
            <td>${task.name}</td><td>${task.type}</td>
            <td>${task.isEnabled ? '<span class="badge badge-green">' + t('enabled') + '</span>' : '<span class="badge badge-red">' + t('disabled') + '</span>'}</td>
            <td>${task.nextFireTime || '-'}</td>
            <td><button class="secondary" onclick="toggleTask('${task.id}')">${t('toggle')}</button></td>
        </tr>`
    ).join('');
    const hist = await api('/api/tasks/history');
    if (hist) {
        document.getElementById('historyList').innerHTML = hist.history.map(h =>
            `<tr><td>${h.taskName}</td><td>${h.executedAt}</td>
            <td>${h.success ? '<span class="badge badge-green">' + t('ok') + '</span>' : '<span class="badge badge-red">' + t('failed') + '</span>'}</td>
            <td>${h.detail}</td></tr>`
        ).join('');
    }
}
async function toggleTask(id) { await api(`/api/tasks/${id}/toggle`, { method: 'POST', body: {} }); loadTasks(); }
loadTasks();
</script>
</body>
</html>

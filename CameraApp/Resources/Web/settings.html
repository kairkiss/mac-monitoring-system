<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Settings</title>
<link rel="stylesheet" href="/css/style.css?v=2.4.12">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content">
    <div class="page-header">
        <h1 data-i18n="settings">Settings</h1>
        <div class="page-header-subtitle">Manage your account settings, security options, and language preferences.</div>
    </div>

    <!-- Account Profile Card -->
    <div class="section-card">
        <h3 data-i18n="currentUser">Current User</h3>
        <div id="currentUserCard" style="color:var(--text-secondary); font-size:14px; line-height: 1.5;">Loading profile...</div>
    </div>

    <!-- Security (Change Password) -->
    <div class="section-card">
        <h3 data-i18n="security">Security</h3>
        <div style="display:flex; flex-direction:column; gap:12px; max-width:360px;">
            <div class="form-group" style="margin-bottom: 0;">
                <label data-i18n="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" placeholder="Current Password" autocomplete="current-password">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label data-i18n="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="New Password" autocomplete="new-password">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label data-i18n="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password">
            </div>
            <button onclick="changePassword()" class="primary-action" data-i18n="savePassword">Save Password</button>
            <p id="passwordMsg" style="font-size:13px; margin-top:4px; font-weight:600;"></p>
        </div>
    </div>

    <!-- Change Username Card (Admin only) -->
    <div class="section-card" id="changeUsernameCard" style="display:none;">
        <h3 data-i18n="changeUsername">Change Username</h3>
        <div style="display:flex; flex-direction:column; gap:12px; max-width:360px;">
            <div class="form-group" style="margin-bottom: 0;">
                <label data-i18n="newUsername">New Username</label>
                <input type="text" id="newUsername" placeholder="New Username" autocomplete="username">
            </div>
            <button onclick="changeUsername()" class="primary-action" data-i18n="saveUsername">Save Username</button>
            <p id="usernameMsg" style="font-size:13px; margin-top:4px; font-weight:600;"></p>
        </div>
    </div>

    <!-- Web Users Card -->
    <div class="section-card">
        <h3 data-i18n="webUsers">Web Users</h3>
        <div id="userList" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>

    <!-- Language Selection -->
    <div class="section-card">
        <h3 data-i18n="language">Language</h3>
        <div style="display:flex; gap:12px; max-width: 360px;">
            <button onclick="setLanguage('en')" data-i18n="english" class="secondary" style="flex:1;">English</button>
            <button onclick="setLanguage('zh')" data-i18n="chinese" class="secondary" style="flex:1;">中文</button>
        </div>
    </div>

    <!-- About Section -->
    <div class="section-card" style="background:rgba(255,255,255,0.01);">
        <h3 data-i18n="about">About</h3>
        <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.6;">
            <div>System Name: <strong style="color:var(--text-primary);" data-i18n="appName">Mac Monitor</strong></div>
            <div id="aboutVersion">Version: -</div>
            <div style="margin-top: 8px;" data-i18n="adminOnlyAction">Bilingual admin panel built for macOS Monitoring Node.</div>
        </div>
    </div>
</main>

<script src="/js/i18n.js?v=2.4.12"></script>
<script src="/js/app.js?v=2.4.12"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('settings');
    loadCurrentUser();
    loadUsers();
    loadVersion();
});

async function loadVersion() {
    try {
        const data = await api('/api/status');
        if (data) {
            document.getElementById('aboutVersion').innerHTML = `${t('version')}: <strong style="color:var(--text-primary);">v${data.version || '?'} (${data.build || '?'})</strong>`;
        }
    } catch(e){}
}

async function loadCurrentUser() {
    try {
        const data = await api('/api/auth/me');
        if (!data) return;
        const card = document.getElementById('currentUserCard');
        card.innerHTML = `<p>${t('username')}: <strong style="color:var(--text-primary);">${data.username}</strong></p>` +
                         `<p style="margin-top:6px;">${t('role')}: <strong style="color:var(--text-primary);">${data.role}</strong></p>`;
        if (data.role === 'admin') {
            document.getElementById('changeUsernameCard').style.display = 'block';
        }
    } catch (e) {}
}

async function changePassword() {
    const msgEl = document.getElementById('passwordMsg');
    const current = document.getElementById('currentPassword').value;
    const newPwd = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    msgEl.textContent = '';
    msgEl.style.color = 'var(--danger)';
    if (newPwd.length < 8) { msgEl.textContent = t('passwordTooShort'); return; }
    if (newPwd !== confirm) { msgEl.textContent = t('passwordMismatch'); return; }
    try {
        const res = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
            body: JSON.stringify({ currentPassword: current, newPassword: newPwd })
        });
        const data = await res.json();
        if (res.ok) {
            msgEl.style.color = 'var(--success)';
            msgEl.textContent = t('passwordChanged');
            localStorage.removeItem('token');
            setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        } else {
            msgEl.textContent = data.error || t('connectionError');
        }
    } catch (e) {
        msgEl.textContent = t('connectionError');
    }
}

async function changeUsername() {
    const msgEl = document.getElementById('usernameMsg');
    const newU = document.getElementById('newUsername').value.trim();
    msgEl.textContent = '';
    msgEl.style.color = 'var(--danger)';
    if (newU.length < 3 || newU.length > 32 || !/^[a-zA-Z0-9_-]+$/.test(newU)) {
        msgEl.textContent = t('usernameInvalid'); return;
    }
    try {
        const res = await fetch('/api/auth/change-username', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
            body: JSON.stringify({ newUsername: newU })
        });
        const data = await res.json();
        if (res.ok) {
            msgEl.style.color = 'var(--success)';
            msgEl.textContent = t('usernameChanged');
            localStorage.removeItem('token');
            setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        } else {
            msgEl.textContent = data.error || t('connectionError');
        }
    } catch (e) {
        msgEl.textContent = t('connectionError');
    }
}

async function loadUsers() {
    const data = await api('/api/auth/users');
    if (!data) return;
    document.getElementById('userList').innerHTML = data.users.map(u => {
        const activeBadge = u.isEnabled ? '<span class="badge badge-green">' + t('enabled') + '</span>' : '<span class="badge badge-red">' + t('disabled') + '</span>';
        return `<div class="mini-card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <strong style="color:var(--text-primary);">${u.username}</strong>
                <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">Role: ${u.role}</div>
            </div>
            <div>${activeBadge}</div>
        </div>`;
    }).join('');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac监控系统 - Settings</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header">Mac监控系统</div>
    <a href="/" class="nav-item">Dashboard</a>
    <a href="/live.html" class="nav-item">Live View</a>
    <a href="/media.html" class="nav-item">Media Library</a>
    <a href="/tasks.html" class="nav-item">Automation</a>
    <a href="/uploads.html" class="nav-item">Upload Queue</a>
    <a href="/health.html" class="nav-item">Health</a>
    <a href="/logs.html" class="nav-item">Activity Log</a>
    <a href="/settings.html" class="nav-item active">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout">Logout</a></div>
</nav>
<main class="content">
    <h1>Settings</h1>

    <div class="card">
        <h3>Storage</h3>
        <div id="storageInfo" style="color:var(--fg2)">Loading...</div>
    </div>

    <div class="card">
        <h3>Web Users</h3>
        <table>
            <thead><tr><th>Username</th><th>Role</th><th>Enabled</th></tr></thead>
            <tbody id="userList"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>Storage Providers</h3>
        <p style="color:var(--fg2);font-size:13px;margin-bottom:12px;">Google Drive and WebDAV are planned features. Configure storage providers in the macOS app.</p>
        <div id="providerList"></div>
    </div>
</main>
<script src="/js/app.js"></script>
<script>
async function loadStorage() {
    const data = await api('/api/storage/status');
    if (!data) return;
    const sizeMB = (data.totalStorageBytes / 1048576).toFixed(1);
    document.getElementById('storageInfo').innerHTML =
        `<p>Active Provider: <strong>${data.providerDisplayName}</strong></p>` +
        `<p>Photos: ${data.totalPhotos} | Videos: ${data.totalVideos}</p>` +
        `<p>Storage Used: ${sizeMB} MB | Free: ${data.diskFreeMB} MB</p>`;
}

async function loadUsers() {
    const data = await api('/api/auth/users');
    if (!data) return;
    document.getElementById('userList').innerHTML = data.users.map(u =>
        `<tr><td>${u.username}</td><td>${u.role}</td><td>${u.enabled ? 'Yes' : 'No'}</td></tr>`
    ).join('');
}

async function loadProviders() {
    const data = await api('/api/storage/providers');
    if (!data) return;
    document.getElementById('providerList').innerHTML = data.providers.map(p => {
        const badge = p.isPlanned ? '<span style="color:#ff9800;font-size:12px;">Planned</span>' :
                      p.isAvailable ? '<span style="color:#4caf50;font-size:12px;">Available</span>' : '';
        return `<div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">` +
               `<span>${p.displayName}</span>${badge}</div>`;
    }).join('');
}

loadStorage();
loadUsers();
loadProviders();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Login</title>
<link rel="stylesheet" href="/css/style.css?v=2.4.11">
</head>
<body class="login-page">
<div class="login-card">
    <div class="login-logo-wrap">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
            <circle cx="12" cy="10" r="3"></circle>
        </svg>
    </div>
    <h1 data-i18n="macMonitorSystem">Mac Monitor</h1>
    <p class="subtitle" data-i18n="webDashboard">Web Dashboard</p>
    <form id="loginForm">
        <div class="form-group">
            <label for="username" data-i18n="username">Username</label>
            <input type="text" id="username" placeholder="Username" data-i18n="username" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password" data-i18n="password">Password</label>
            <input type="password" id="password" placeholder="Password" data-i18n="password" autocomplete="current-password" required>
        </div>
        <button type="submit" data-i18n="login">Login</button>
        <p id="error" class="error-msg"></p>
    </form>
    
    <div class="login-lang-switch">
        <button onclick="setLanguage('en')" data-i18n="english">English</button>
        <button onclick="setLanguage('zh')" data-i18n="chinese">中文</button>
    </div>
</div>
<script src="/js/i18n.js?v=2.4.11"></script>
<script src="/js/app.js?v=2.4.11"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('login');
});
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('username', data.username);
            localStorage.setItem('role', data.role);
            window.location.href = '/';
        } else {
            errorEl.textContent = data.error || t('loginFailed');
        }
    } catch (err) {
        errorEl.textContent = t('connectionError');
    }
});
</script>
</body>
</html>

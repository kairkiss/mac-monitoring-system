<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="macMonitorSystem">Mac监控系统 - Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<div class="login-card">
    <h1 data-i18n="macMonitorSystem">Mac监控系统</h1>
    <p class="subtitle" data-i18n="webDashboard">Web Dashboard</p>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" data-i18n="username" autocomplete="username" required>
        <input type="password" id="password" placeholder="Password" data-i18n="password" autocomplete="current-password" required>
        <button type="submit" data-i18n="login">Login</button>
        <p id="error" class="error-msg"></p>
    </form>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('login');
});
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('username', data.username);
            localStorage.setItem('role', data.role);
            window.location.href = '/';
        } else {
            errorEl.textContent = data.error || t('loginFailed');
        }
    } catch (err) {
        errorEl.textContent = t('connectionError');
    }
});
</script>
</body>
</html>

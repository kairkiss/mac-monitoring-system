<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac监控系统 - Media Library</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50;
    display: flex; align-items: center; justify-content: center;
}
.detail-card {
    background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px;
    width: 90vw; max-width: 800px; max-height: 90vh; overflow: auto; padding: 0;
}
.detail-card img { max-width: 100%; display: block; border-radius: 12px 12px 0 0; }
.detail-body { padding: 16px 20px; }
.detail-body h2 { font-size: 14px; word-break: break-all; margin-bottom: 12px; }
.detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; color: var(--fg2); margin-bottom: 16px; }
.detail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.detail-actions button { font-size: 13px; padding: 6px 14px; }
.close-btn { position: absolute; top: 12px; right: 16px; background: rgba(0,0,0,0.6); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.archived-badge { background: rgba(255,152,0,0.15); color: var(--orange); font-size: 11px; padding: 2px 6px; border-radius: 8px; margin-left: 6px; }
</style>
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header">Mac监控系统</div>
    <a href="/" class="nav-item">Dashboard</a>
    <a href="/live.html" class="nav-item">Live View</a>
    <a href="/media.html" class="nav-item active">Media Library</a>
    <a href="/tasks.html" class="nav-item">Automation</a>
    <a href="/uploads.html" class="nav-item">Upload Queue</a>
    <a href="/health.html" class="nav-item">Health</a>
    <a href="/logs.html" class="nav-item">Activity Log</a>
    <a href="/settings.html" class="nav-item">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout">Logout</a></div>
</nav>
<main class="content">
    <h1>Media Library <span id="totalCount" style="font-size:14px;color:var(--fg2);font-weight:400;"></span></h1>
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search filename..." style="width:180px;">
        <select id="typeFilter"><option value="">All Types</option><option value="photo">Photos</option><option value="video">Videos</option></select>
        <select id="sourceFilter"><option value="">All Sources</option><option value="manual">Manual</option><option value="automation">Automation</option><option value="motion">Motion</option></select>
        <select id="statusFilter"><option value="">All Status</option><option value="notQueued">Not uploaded</option><option value="queued">Queued</option><option value="uploading">Uploading</option><option value="completed">Uploaded</option><option value="failed">Failed</option></select>
        <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--fg2);cursor:pointer;">
            <input type="checkbox" id="favFilter" style="width:auto;margin:0;"> Favorites
        </label>
    </div>
    <div class="media-grid" id="mediaGrid"></div>
    <div class="pagination" id="pagination"></div>
</main>
<div id="detailModal"></div>
<script src="/js/app.js"></script>
<script>
let currentPage = 1;
const perPage = 30;

function buildURL() {
    let url = '/api/media?page=' + currentPage + '&perPage=' + perPage;
    const search = document.getElementById('searchInput').value.trim();
    const type = document.getElementById('typeFilter').value;
    const source = document.getElementById('sourceFilter').value;
    const status = document.getElementById('statusFilter').value;
    const fav = document.getElementById('favFilter').checked;
    if (search) url += '&search=' + encodeURIComponent(search);
    if (type) url += '&type=' + type;
    if (source) url += '&source=' + source;
    if (status) url += '&uploadStatus=' + status;
    if (fav) url += '&favorite=true';
    return url;
}

async function loadMedia() {
    const data = await api(buildURL());
    if (!data) return;
    document.getElementById('totalCount').textContent = '(' + data.total + ')';
    const grid = document.getElementById('mediaGrid');
    if (data.items.length === 0) {
        grid.innerHTML = '<p style="color:var(--fg2);padding:40px 0;text-align:center;">No media found</p>';
    } else {
        grid.innerHTML = data.items.map(item => {
            const archived = !item.localOriginalExists && item.verified;
            const badges = [];
            if (item.isFavorite) badges.push('<span style="color:#f44336;">&#9829;</span>');
            if (item.protected) badges.push('<span style="color:var(--accent);">&#128274;</span>');
            if (archived) badges.push('<span class="archived-badge">Archived</span>');
            return '<div class="media-item" onclick="showDetail(\'' + item.fileName + '\')">' +
                '<img src="/api/media/' + item.fileName + '/thumbnail" alt="" loading="lazy" onerror="this.style.display=\'none\'">' +
                '<div class="overlay"><span>' + item.type + '</span> ' + badges.join(' ') + '</div></div>';
        }).join('');
    }
    renderPagination(data.page, data.totalPages);
}

function renderPagination(page, totalPages) {
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = '<span style="font-size:13px;color:var(--fg2);">Page ' + page + ' / ' + totalPages + '</span>';
    if (page > 1) html += '<button class="secondary" onclick="goPage(' + (page-1) + ')">Prev</button>';
    if (page < totalPages) html += '<button class="secondary" onclick="goPage(' + (page+1) + ')">Next</button>';
    el.innerHTML = html;
}

function goPage(p) { currentPage = p; loadMedia(); }

async function showDetail(fileName) {
    const data = await api('/api/media/' + encodeURIComponent(fileName));
    if (!data) return;
    const archived = !data.localOriginalExists && data.verified;
    const statusColors = { notQueued:'var(--fg2)', queued:'var(--accent)', uploading:'var(--orange)', completed:'var(--green)', failed:'var(--red)', retrying:'var(--orange)' };
    const statusColor = statusColors[data.uploadStatus] || 'var(--fg2)';
    let actions = '';
    if (data.localOriginalExists) {
        actions += '<button onclick="downloadFile(\'' + fileName + '\')">Download</button>';
    }
    actions += '<button class="secondary" onclick="toggleFav(\'' + fileName + '\')">' + (data.isFavorite ? 'Unfavorite' : 'Favorite') + '</button>';
    actions += '<button class="secondary" onclick="toggleProtect(\'' + fileName + '\')">' + (data.protected ? 'Unprotect' : 'Protect') + '</button>';
    if (data.uploadStatus === 'notQueued' && data.localOriginalExists) {
        actions += '<button class="secondary" onclick="queueUpload(\'' + fileName + '\')">Upload Now</button>';
    }
    if (!data.protected) {
        actions += '<button class="danger" onclick="deleteMedia(\'' + fileName + '\')">Delete</button>';
    }
    const modal = document.getElementById('detailModal');
    modal.innerHTML = '<div class="detail-overlay" onclick="closeDetail(event)">' +
        '<div class="detail-card" onclick="event.stopPropagation()">' +
        (data.localOriginalExists ? '<img src="/api/media/' + fileName + '/file" alt="">' : '<div style="padding:60px;text-align:center;color:var(--fg2);">Original file not locally available</div>') +
        '<div class="detail-body">' +
        '<h2>' + fileName + (archived ? ' <span class="archived-badge">Archived</span>' : '') + '</h2>' +
        '<div class="detail-meta">' +
        '<span>Type: ' + data.type + '</span>' +
        '<span>Source: ' + data.source + '</span>' +
        '<span>Size: ' + formatSize(data.fileSize) + '</span>' +
        '<span>Status: <span style="color:' + statusColor + ';">' + data.uploadStatus + '</span></span>' +
        '<span>Provider: ' + (data.uploadProvider || '-') + '</span>' +
        '<span>Verified: ' + (data.verified ? 'Yes' : 'No') + '</span>' +
        (data.remoteURL ? '<span style="grid-column:span 2;word-break:break-all;">Remote: ' + data.remoteURL + '</span>' : '') +
        (data.uploadDate ? '<span>Uploaded: ' + new Date(data.uploadDate).toLocaleString() + '</span>' : '') +
        (data.localDeletedAt ? '<span>Local deleted: ' + new Date(data.localDeletedAt).toLocaleString() + '</span>' : '') +
        '</div>' +
        '<div class="detail-actions">' + actions + '</div>' +
        '</div></div>';
}

function closeDetail(e) {
    if (e.target.classList.contains('detail-overlay')) document.getElementById('detailModal').innerHTML = '';
}

async function downloadFile(fileName) {
    const token = getToken();
    const a = document.createElement('a');
    a.href = '/api/media/' + encodeURIComponent(fileName) + '/file?token=' + token;
    a.download = fileName;
    a.click();
}

async function toggleFav(fileName) {
    await api('/api/media/' + encodeURIComponent(fileName) + '/favorite', { method: 'POST', body: {} });
    showDetail(fileName);
    loadMedia();
}

async function toggleProtect(fileName) {
    await api('/api/media/' + encodeURIComponent(fileName) + '/protect', { method: 'POST', body: {} });
    showDetail(fileName);
    loadMedia();
}

async function queueUpload(fileName) {
    try {
        await api('/api/media/' + encodeURIComponent(fileName) + '/upload', { method: 'POST', body: {} });
        toast('Queued for upload');
        showDetail(fileName);
    } catch (e) {}
}

async function deleteMedia(fileName) {
    if (!confirm('Delete ' + fileName + '?')) return;
    try {
        await api('/api/media/' + encodeURIComponent(fileName), { method: 'DELETE' });
        document.getElementById('detailModal').innerHTML = '';
        toast('Deleted');
        loadMedia();
    } catch (e) {}
}

function formatSize(bytes) {
    if (!bytes || bytes === 0) return '-';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
    return (bytes/1073741824).toFixed(1) + ' GB';
}

// Debounce search
let searchTimer;
document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentPage = 1; loadMedia(); }, 300);
});
document.getElementById('typeFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });
document.getElementById('sourceFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });
document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });
document.getElementById('favFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });

// ESC to close modal
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.getElementById('detailModal').innerHTML = '';
});

loadMedia();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Media Library</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content">
    <h1>
        <span data-i18n="mediaLibrary">Media Library</span>
        <span id="totalCount" style="font-size:14px; color:var(--text-secondary); font-weight:400; margin-left: 6px;"></span>
    </h1>
    
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search filename..." data-i18n="search">
        <select id="typeFilter">
            <option value="" data-i18n="allTypes">All Types</option>
            <option value="photo" data-i18n="photos">Photos</option>
            <option value="video" data-i18n="videos">Videos</option>
        </select>
        <select id="sourceFilter">
            <option value="" data-i18n="allSources">All Sources</option>
            <option value="manual" data-i18n="manual">Manual</option>
            <option value="automation" data-i18n="automationSrc">Automation</option>
            <option value="motion" data-i18n="motion">Motion</option>
        </select>
        <select id="statusFilter">
            <option value="" data-i18n="allStatus">All Status</option>
            <option value="notQueued" data-i18n="notUploaded">Not uploaded</option>
            <option value="queued" data-i18n="queued">Queued</option>
            <option value="uploading" data-i18n="uploading">Uploading</option>
            <option value="completed" data-i18n="uploaded">Uploaded</option>
            <option value="failed" data-i18n="failed">Failed</option>
        </select>
        <label style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text-secondary); cursor:pointer; user-select:none;">
            <input type="checkbox" id="favFilter" style="width:18px; height:18px; margin:0;">
            <span data-i18n="favorites">Favorites</span>
        </label>
    </div>
    
    <div class="media-grid" id="mediaGrid"></div>
    <div class="pagination" id="pagination"></div>
</main>

<div id="detailModal"></div>

<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('mediaLibrary');
});

let currentPage = 1;
const perPage = 30;
const blobURLs = new Set();

function revokeBlobURLs() {
    for (const u of blobURLs) URL.revokeObjectURL(u);
    blobURLs.clear();
}

async function authFetch(url) {
    const token = getToken();
    const res = await fetch(url, {
        headers: { 'Authorization': 'Bearer ' + token },
        cache: 'no-cache'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res;
}

async function fetchBlobURL(url) {
    const res = await authFetch(url);
    const blob = await res.blob();
    const blobURL = URL.createObjectURL(blob);
    blobURLs.add(blobURL);
    return blobURL;
}

function buildURL() {
    let url = '/api/media?page=' + currentPage + '&perPage=' + perPage;
    const search = document.getElementById('searchInput').value.trim();
    const type = document.getElementById('typeFilter').value;
    const source = document.getElementById('sourceFilter').value;
    const status = document.getElementById('statusFilter').value;
    const fav = document.getElementById('favFilter').checked;
    if (search) url += '&search=' + encodeURIComponent(search);
    if (type) url += '&type=' + type;
    if (source) url += '&source=' + source;
    if (status) url += '&uploadStatus=' + status;
    if (fav) url += '&favorite=true';
    return url;
}

async function loadMedia() {
    revokeBlobURLs();
    const data = await api(buildURL());
    if (!data) return;
    document.getElementById('totalCount').textContent = '(' + data.total + ')';
    const grid = document.getElementById('mediaGrid');
    if (data.items.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-secondary); grid-column:1/-1; padding:60px 0; text-align:center; font-weight:500;">' + t('noMediaFound') + '</p>';
    } else {
        grid.innerHTML = data.items.map(item => {
            const archived = !item.localOriginalExists && item.verified;
            const badges = [];
            if (item.isFavorite) badges.push('<span style="color:var(--danger);">&#9829;</span>');
            if (item.protected) badges.push('<span style="color:var(--accent);">&#128274;</span>');
            if (item.verified) badges.push('<span class="verified-badge" style="margin-left:2px; font-size:9px; padding:1px 4px;">' + t('verified') + '</span>');
            if (item.remoteFileID) badges.push('<span class="cloud-badge" style="margin-left:2px; font-size:9px; padding:1px 4px;">Cloud</span>');
            if (archived) badges.push('<span class="archived-badge" style="margin-left:2px; font-size:9px; padding:1px 4px;">' + t('archived') + '</span>');
            
            let iconText = item.type === 'video' ? 'VIDEO' : 'PHOTO';
            return '<div class="media-item" onclick="showDetail(\'' + item.fileName + '\')">' +
                '<div class="thumb-placeholder">' + t('noPreview') + '</div>' +
                '<img class="loading" data-file="' + item.fileName + '" alt="">' +
                '<div class="overlay"><span style="font-weight:700; font-size:10px; background:rgba(0,0,0,0.5); padding:2px 6px; border-radius:4px;">' + iconText + '</span> <div style="display:flex; gap:2px; align-items:center;">' + badges.join('') + '</div></div></div>';
        }).join('');
        loadVisibleThumbnails(data.items);
    }
    renderPagination(data.page, data.totalPages);
}

async function loadVisibleThumbnails(items) {
    const concurrency = 4;
    let idx = 0;
    async function next() {
        while (idx < items.length) {
            const item = items[idx++];
            const img = document.querySelector('img[data-file="' + item.fileName + '"]');
            if (!img) continue;
            try {
                const url = await fetchBlobURL('/api/media/' + encodeURIComponent(item.fileName) + '/thumbnail');
                img.src = url;
                img.classList.remove('loading');
            } catch {
                img.style.display = 'none';
                const ph = img.parentElement.querySelector('.thumb-placeholder');
                if (ph) ph.style.display = 'flex';
            }
        }
    }
    const workers = [];
    for (let i = 0; i < concurrency; i++) workers.push(next());
    await Promise.all(workers);
}

function renderPagination(page, totalPages) {
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = '<span style="font-size:13px; color:var(--text-secondary); font-weight:500;">' + t('page') + ' ' + page + ' / ' + totalPages + '</span>';
    if (page > 1) html += '<button class="secondary" onclick="goPage(' + (page-1) + ')">' + t('prev') + '</button>';
    if (page < totalPages) html += '<button class="secondary" onclick="goPage(' + (page+1) + ')">' + t('next') + '</button>';
    el.innerHTML = html;
}

function goPage(p) { currentPage = p; loadMedia(); }

async function showDetail(fileName) {
    const data = await api('/api/media/' + encodeURIComponent(fileName));
    if (!data) return;
    const archived = !data.localOriginalExists && data.verified;
    const statusColors = { notQueued:'var(--text-secondary)', queued:'var(--accent)', uploading:'var(--warning)', completed:'var(--success)', failed:'var(--danger)', retrying:'var(--warning)' };
    const statusColor = statusColors[data.uploadStatus] || 'var(--text-secondary)';

    let actions = '';
    if (data.localOriginalExists) {
        actions += '<button onclick="downloadFile(\'' + fileName + '\')">' + t('download') + '</button>';
    } else if (archived) {
        actions += '<button disabled style="opacity:0.4; cursor:not-allowed;">' + t('download') + '</button>';
    }
    if (data.remoteURL) {
        actions += '<button class="secondary" onclick="window.open(\'' + data.remoteURL + '\',\'_blank\')">GDrive</button>';
    }
    actions += '<button class="secondary" onclick="toggleFav(\'' + fileName + '\')">' + (data.isFavorite ? t('unfavorite') : t('favorite')) + '</button>';
    actions += '<button class="secondary" onclick="toggleProtect(\'' + fileName + '\')">' + (data.protected ? t('unprotect') : t('protect')) + '</button>';
    if (data.uploadStatus === 'notQueued' && data.localOriginalExists) {
        actions += '<button class="secondary" onclick="queueUpload(\'' + fileName + '\')">' + t('uploadNow') + '</button>';
    }
    if (!data.protected) {
        actions += '<button class="danger" onclick="deleteMedia(\'' + fileName + '\')">' + t('delete') + '</button>';
    }

    const previewHTML = '<div class="preview-area" id="detailPreview"><span style="color:var(--text-secondary); font-weight:600;">' + t('loadingPreview') + '</span></div>';
    const modal = document.getElementById('detailModal');
    
    // Status Display
    let statusText = t(data.uploadStatus) || data.uploadStatus;
    if (archived) statusText = t('archived');

    modal.innerHTML = '<div class="detail-overlay" onclick="closeDetail(event)">' +
        '<div class="detail-card" onclick="event.stopPropagation()">' +
        '<button class="close-btn" onclick="document.getElementById(\'detailModal\').innerHTML=\'\'">&times;</button>' +
        previewHTML +
        '<div class="detail-body">' +
        '<h2>' + fileName + (data.verified ? ' <span class="verified-badge">' + t('verified') + '</span>' : '') + (data.remoteFileID ? ' <span class="cloud-badge">Cloud</span>' : '') + (archived ? ' <span class="archived-badge">' + t('archived') + '</span>' : '') + '</h2>' +
        '<div class="detail-meta">' +
        '<span>' + t('type') + ': <strong>' + data.type + '</strong></span>' +
        '<span>' + t('source') + ': <strong>' + data.source + '</strong></span>' +
        '<span>' + t('size') + ': <strong>' + formatSize(data.fileSize) + '</strong></span>' +
        '<span>' + t('status') + ': <strong style="color:' + statusColor + ';">' + statusText + '</strong></span>' +
        '<span>' + t('provider') + ': <strong>' + (data.uploadProvider || '-') + '</strong></span>' +
        '<span>' + t('verified') + ': <strong>' + (data.verified ? t('yes') : t('no')) + '</strong></span>' +
        (data.remoteURL ? '<span style="grid-column:1/-1; word-break:break-all;">' + t('remote') + ': <a href="' + data.remoteURL + '" target="_blank" style="color:var(--accent);">' + data.remoteURL + '</a></span>' : '') +
        (data.uploadDate ? '<span>' + t('uploadedAt') + ': <strong>' + new Date(data.uploadDate).toLocaleString() + '</strong></span>' : '') +
        (data.localDeletedAt ? '<span>' + t('localDeleted') + ': <strong>' + new Date(data.localDeletedAt).toLocaleString() + '</strong></span>' : '') +
        '</div>' +
        '<div class="detail-actions">' + actions + '</div>' +
        '</div></div>';

    loadDetailPreview(fileName, data);
}

function closeDetail(event) {
    if (event.target.classList.contains('detail-overlay')) {
        document.getElementById('detailModal').innerHTML = '';
    }
}

async function loadDetailPreview(fileName, data) {
    const el = document.getElementById('detailPreview');
    if (!el) return;

    if (!data.localOriginalExists) {
        el.innerHTML = '<div style="padding:60px 20px; text-align:center; color:var(--text-secondary);">' +
            '<p style="margin-bottom:12px; font-weight:600;">' + t('originalArchived') + '</p>' +
            (data.remoteURL ? '<a href="' + data.remoteURL + '" target="_blank" class="btn">' + t('openRemote') + '</a>' : '') +
            '</div>';
        return;
    }

    const maxPreviewBytes = 50 * 1024 * 1024;
    const fileSize = data.fileSize || 0;

    try {
        if (data.type === 'photo') {
            const url = await fetchBlobURL('/api/media/' + encodeURIComponent(fileName) + '/file');
            el.innerHTML = '<img src="' + url + '" alt="' + fileName + '">';
        } else if (data.type === 'video') {
            if (fileSize > maxPreviewBytes) {
                try {
                    const thumbURL = await fetchBlobURL('/api/media/' + encodeURIComponent(fileName) + '/thumbnail');
                    el.innerHTML = '<img src="' + thumbURL + '" alt="' + fileName + '">' +
                        '<div class="video-notice">' + t('largeVideoPreviewDisabled') + ' (' + formatSize(fileSize) + ')</div>';
                } catch {
                    el.innerHTML = '<div style="padding:60px; text-align:center; color:var(--text-secondary);">' + t('videoPreviewLimited') + ' (' + formatSize(fileSize) + ')</div>';
                }
            } else {
                const url = await fetchBlobURL('/api/media/' + encodeURIComponent(fileName) + '/file');
                el.innerHTML = '<video src="' + url + '" controls autoplay playsinline loop></video>';
            }
        }
    } catch (err) {
        el.innerHTML = '<div style="padding:60px 20px; text-align:center; color:var(--danger); font-weight:600;">' + t('previewFailed') + '</div>';
    }
}

async function downloadFile(fileName) {
    const token = getToken();
    const url = '/api/media/' + encodeURIComponent(fileName) + '/file';
    const a = document.createElement('a');
    a.href = url + '?token=' + encodeURIComponent(token);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

async function toggleFav(fileName) {
    try {
        const data = await api('/api/media/' + encodeURIComponent(fileName) + '/favorite', { method: 'POST' });
        if (data) {
            toast(data.isFavorite ? t('favorite') + ' ' + t('success') : t('unfavorite') + ' ' + t('success'), 'success');
            showDetail(fileName);
            loadMedia();
        }
    } catch(e){}
}

async function toggleProtect(fileName) {
    try {
        const data = await api('/api/media/' + encodeURIComponent(fileName) + '/protect', { method: 'POST' });
        if (data) {
            toast(data.protected ? t('protect') + ' ' + t('success') : t('unprotect') + ' ' + t('success'), 'success');
            showDetail(fileName);
            loadMedia();
        }
    } catch(e){}
}

async function queueUpload(fileName) {
    try {
        const data = await api('/api/media/' + encodeURIComponent(fileName) + '/upload', { method: 'POST' });
        if (data) {
            toast(t('queuedForUpload'), 'success');
            showDetail(fileName);
            loadMedia();
        }
    } catch(e){}
}

async function deleteMedia(fileName) {
    if (!confirm(t('deleteConfirm') + '\n' + fileName)) return;
    try {
        await api('/api/media/' + encodeURIComponent(fileName), { method: 'DELETE' });
        toast(t('deletedSuccess'), 'success');
        document.getElementById('detailModal').innerHTML = '';
        loadMedia();
    } catch(e){}
}

function formatSize(bytes) {
    if (!bytes) return '-';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

// Bind search and filter triggers
document.getElementById('searchInput').addEventListener('input', debounce(loadMedia, 300));
document.getElementById('typeFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });
document.getElementById('sourceFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });
document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });
document.getElementById('favFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });

function debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

loadMedia();
</script>
</body>
</html>

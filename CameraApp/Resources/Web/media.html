<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Media Library</title>
<link rel="stylesheet" href="/css/style.css?v=2.5.0">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px;">
        <h1 style="margin:0;">
            <span data-i18n="mediaLibrary">Media Library</span>
            <span id="totalCount" style="font-size:14px; color:var(--text-secondary); font-weight:400; margin-left: 6px;"></span>
        </h1>
    </div>

    <!-- Search Input -->
    <div class="toolbar" style="margin-bottom: 12px;">
        <input type="text" id="searchInput" placeholder="Search filename..." data-i18n="search" style="margin-bottom:0;">
    </div>

    <!-- Filter Chips Row -->
    <div class="filter-chips" id="filterChips">
        <button class="chip active" data-type="" data-status="" data-fav="false" data-i18n="allTypes">All</button>
        <button class="chip" data-type="photo" data-status="" data-fav="false" data-i18n="photos">Photos</button>
        <button class="chip" data-type="video" data-status="" data-fav="false" data-i18n="videos">Videos</button>
        <button class="chip" data-type="" data-status="completed" data-fav="false" data-i18n="cloud">Cloud</button>
        <button class="chip" data-type="" data-status="notQueued" data-fav="false" data-i18n="local">Local</button>
        <button class="chip" data-type="" data-status="failed" data-fav="false" data-i18n="failed">Failed</button>
        <button class="chip" data-type="" data-status="" data-fav="true" data-i18n="favorites">Favorites</button>
        <button class="chip" id="selectModeBtn" data-role-min="operator" onclick="toggleSelectionMode()" style="margin-left:auto;">Select</button>
    </div>

    <!-- Selection Bar (hidden by default) -->
    <div class="selection-bar" id="selectionBar" style="display:none;">
        <span id="selectionCount" style="font-weight:700; font-size:13px;">0 selected</span>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="secondary" onclick="selectAll()" style="height:32px; padding:0 10px; font-size:12px; font-weight:600;">Select All</button>
            <button class="secondary" onclick="deselectAll()" style="height:32px; padding:0 10px; font-size:12px; font-weight:600;">Deselect All</button>
            <button class="secondary" data-role-min="operator" onclick="batchProtect(true)" style="height:32px; padding:0 10px; font-size:12px; font-weight:600;">Protect</button>
            <button class="secondary" data-role-min="operator" onclick="batchProtect(false)" style="height:32px; padding:0 10px; font-size:12px; font-weight:600;">Unprotect</button>
            <button class="secondary" data-role-min="operator" onclick="batchFavorite()" style="height:32px; padding:0 10px; font-size:12px; font-weight:600;">Favorite</button>
            <button class="secondary" data-role-min="operator" onclick="batchUpload()" style="height:32px; padding:0 10px; font-size:12px; font-weight:600;">Upload</button>
            <button class="danger" data-role-min="admin" onclick="batchDelete()" style="height:32px; padding:0 10px; font-size:12px; font-weight:600;">Delete</button>
        </div>
    </div>

    <!-- Media Items Grid -->
    <div class="media-grid" id="mediaGrid"></div>

    <!-- Pagination Footer -->
    <div class="pagination" id="pagination" style="margin-top:20px;"></div>
</main>

<div id="detailModal"></div>

<script src="/js/i18n.js?v=2.5.0"></script>
<script src="/js/app.js?v=2.5.0"></script>
<script>
let currentPage = 1;
const perPage = 24;
const blobURLs = new Set();

let currentType = '';
let currentStatus = '';
let currentFav = false;

// --- Selection Mode State ---
const selectedIds = new Set();
let selectionMode = false;

document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('mediaLibrary');
    initFilterChips();
    loadMedia();
});

function revokeBlobURLs() {
    for (const u of blobURLs) URL.revokeObjectURL(u);
    blobURLs.clear();
}

async function authFetch(url) {
    const token = getToken();
    const res = await fetch(url, {
        headers: { 'Authorization': 'Bearer ' + token },
        cache: 'no-cache'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res;
}

async function fetchBlobURL(url) {
    const res = await authFetch(url);
    const blob = await res.blob();
    const blobURL = URL.createObjectURL(blob);
    blobURLs.add(blobURL);
    return blobURL;
}

async function fetchBlobURLSilent(url) {
    try {
        const token = getToken();
        const res = await fetch(url, {
            headers: { 'Authorization': 'Bearer ' + token },
            cache: 'no-cache'
        });
        if (!res.ok) return null;
        const blob = await res.blob();
        const blobURL = URL.createObjectURL(blob);
        blobURLs.add(blobURL);
        return blobURL;
    } catch (e) {
        console.warn('fetchBlobURLSilent failed:', url, e);
        return null;
    }
}

function initFilterChips() {
    const chips = document.querySelectorAll('#filterChips .chip');
    chips.forEach(chip => {
        if (chip.id === 'selectModeBtn') return; // skip select button
        chip.addEventListener('click', () => {
            chips.forEach(c => { if (c.id !== 'selectModeBtn') c.classList.remove('active'); });
            chip.classList.add('active');

            currentType = chip.getAttribute('data-type') || '';
            currentStatus = chip.getAttribute('data-status') || '';
            currentFav = chip.getAttribute('data-fav') === 'true';

            currentPage = 1;
            loadMedia();
        });
    });
}

function buildURL() {
    let url = '/api/media?page=' + currentPage + '&perPage=' + perPage;
    const search = document.getElementById('searchInput').value.trim();
    if (search) url += '&search=' + encodeURIComponent(search);
    if (currentType) url += '&type=' + currentType;
    if (currentStatus) url += '&uploadStatus=' + currentStatus;
    if (currentFav) url += '&favorite=true';
    return url;
}

async function loadMedia() {
    revokeBlobURLs();
    const data = await api(buildURL());
    if (!data) return;
    document.getElementById('totalCount').textContent = '(' + data.total + ')';
    const grid = document.getElementById('mediaGrid');
    if (data.items.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">
            <div class="empty-state-icon">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </div>
            <div class="empty-state-text">${t('noMediaFound')}</div>
        </div>`;
    } else {
        grid.innerHTML = data.items.map(item => {
            const archived = !item.localOriginalExists && item.verified;
            const badges = [];
            if (item.isFavorite) badges.push('<span style="color:var(--danger); font-size:13px;">&#9829;</span>');
            if (item.protected) badges.push('<span style="color:var(--accent); font-size:11px;">&#128274;</span>');

            let sourceBadge = '';
            if (item.verified) sourceBadge = `<span class="verified-badge">${t('verifiedBadge')}</span>`;
            else if (item.remoteFileID) sourceBadge = `<span class="cloud-badge">${t('cloudBadge')}</span>`;
            else if (archived) sourceBadge = `<span class="archived-badge">${t('archivedBadge')}</span>`;
            else sourceBadge = `<span class="badge badge-neutral" style="font-size:9px; padding:2px 6px;">${t('localOnlyBadge')}</span>`;

            let typeText = item.type === 'video' ? 'VIDEO' : 'PHOTO';
            const isSelected = selectedIds.has(item.fileName);
            return `<div class="media-item${isSelected ? ' checked' : ''}" data-file="${item.fileName}" onclick="handleMediaClick(event, '${item.fileName}')">
                <div class="select-check${isSelected ? ' checked' : ''}" onclick="event.stopPropagation(); toggleItemSelect('${item.fileName}', this)"></div>
                <div class="thumb-placeholder">${t('noPreview')}</div>
                <img class="loading" data-file="${item.fileName}" alt="">
                <div class="overlay">
                    <span style="font-weight:700; font-size:9px; background:rgba(0,0,0,0.6); padding:2px 6px; border-radius:4px; letter-spacing:0.3px;">${typeText}</span>
                    <div style="display:flex; gap:4px; align-items:center;">
                        ${badges.join('')}
                        ${sourceBadge}
                    </div>
                </div>
            </div>`;
        }).join('');
        if (selectionMode) {
            grid.classList.add('selection-mode');
        }
        loadVisibleThumbnails(data.items);
    }
    renderPagination(data.page, data.totalPages);
}

// --- Selection Mode Functions ---

function toggleSelectionMode() {
    selectionMode = !selectionMode;
    const grid = document.getElementById('mediaGrid');
    const bar = document.getElementById('selectionBar');
    const btn = document.getElementById('selectModeBtn');

    if (selectionMode) {
        grid.classList.add('selection-mode');
        bar.style.display = 'flex';
        btn.classList.add('active');
    } else {
        grid.classList.remove('selection-mode');
        bar.style.display = 'none';
        btn.classList.remove('active');
        selectedIds.clear();
        updateSelectionUI();
    }
}

function handleMediaClick(event, fileName) {
    if (selectionMode) {
        event.stopPropagation();
        const item = document.querySelector(`.media-item[data-file="${CSS.escape(fileName)}"]`);
        const check = item ? item.querySelector('.select-check') : null;
        toggleItemSelect(fileName, check);
    } else {
        showDetail(fileName);
    }
}

function toggleItemSelect(fileName, checkEl) {
    if (selectedIds.has(fileName)) {
        selectedIds.delete(fileName);
        if (checkEl) checkEl.classList.remove('checked');
        const item = checkEl ? checkEl.closest('.media-item') : document.querySelector(`.media-item[data-file="${CSS.escape(fileName)}"]`);
        if (item) item.classList.remove('checked');
    } else {
        selectedIds.add(fileName);
        if (checkEl) checkEl.classList.add('checked');
        const item = checkEl ? checkEl.closest('.media-item') : document.querySelector(`.media-item[data-file="${CSS.escape(fileName)}"]`);
        if (item) item.classList.add('checked');
    }
    updateSelectionUI();
}

function updateSelectionUI() {
    document.getElementById('selectionCount').textContent = selectedIds.size + ' selected';
}

function selectAll() {
    document.querySelectorAll('.media-item').forEach(item => {
        const fn = item.getAttribute('data-file');
        if (fn && !selectedIds.has(fn)) {
            selectedIds.add(fn);
            item.classList.add('checked');
            const check = item.querySelector('.select-check');
            if (check) check.classList.add('checked');
        }
    });
    updateSelectionUI();
}

function deselectAll() {
    selectedIds.clear();
    document.querySelectorAll('.media-item').forEach(item => {
        item.classList.remove('checked');
        const check = item.querySelector('.select-check');
        if (check) check.classList.remove('checked');
    });
    updateSelectionUI();
}

// --- Batch Operations ---

async function batchProtect(protect) {
    const ids = Array.from(selectedIds);
    if (ids.length === 0) return;
    let ok = 0, fail = 0;
    for (const fn of ids) {
        try {
            await api('/api/media/' + encodeURIComponent(fn) + '/protect', { method: 'POST' });
            ok++;
        } catch { fail++; }
    }
    const action = protect ? 'Protected' : 'Unprotected';
    if (fail === 0) {
        toast(action + ' ' + ok + ' of ' + ids.length + ' files', 'success');
    } else {
        toast(action + ' ' + ok + ' of ' + ids.length + ', ' + fail + ' failed', 'warning');
    }
    deselectAll();
    loadMedia();
}

async function batchFavorite() {
    const ids = Array.from(selectedIds);
    if (ids.length === 0) return;
    let ok = 0, fail = 0;
    for (const fn of ids) {
        try {
            await api('/api/media/' + encodeURIComponent(fn) + '/favorite', { method: 'POST' });
            ok++;
        } catch { fail++; }
    }
    if (fail === 0) {
        toast('Favorited ' + ok + ' of ' + ids.length + ' files', 'success');
    } else {
        toast('Favorited ' + ok + ' of ' + ids.length + ', ' + fail + ' failed', 'warning');
    }
    deselectAll();
    loadMedia();
}

async function batchUpload() {
    const ids = Array.from(selectedIds);
    if (ids.length === 0) return;
    let ok = 0, fail = 0;
    for (const fn of ids) {
        try {
            await api('/api/media/' + encodeURIComponent(fn) + '/upload', { method: 'POST' });
            ok++;
        } catch { fail++; }
    }
    if (fail === 0) {
        toast('Queued ' + ok + ' of ' + ids.length + ' files for upload', 'success');
    } else {
        toast('Queued ' + ok + ' of ' + ids.length + ', ' + fail + ' failed', 'warning');
    }
    deselectAll();
    loadMedia();
}

async function batchDelete() {
    const ids = Array.from(selectedIds);
    if (ids.length === 0) return;
    if (!confirm('Delete ' + ids.length + ' file(s)? This cannot be undone.')) return;
    let ok = 0, fail = 0;
    for (const fn of ids) {
        try {
            await api('/api/media/' + encodeURIComponent(fn), { method: 'DELETE' });
            ok++;
        } catch { fail++; }
    }
    if (fail === 0) {
        toast('Deleted ' + ok + ' of ' + ids.length + ' files', 'success');
    } else {
        toast('Deleted ' + ok + ' of ' + ids.length + ', ' + fail + ' failed', 'warning');
    }
    deselectAll();
    loadMedia();
}

// --- End Selection Mode ---

async function loadVisibleThumbnails(items) {
    const concurrency = 4;
    let idx = 0;

    async function showImage(img, ph, url) {
        img.src = url;
        img.classList.remove('loading');
        img.style.display = 'block';
        if (ph) ph.style.display = 'none';
    }

    async function showPlaceholder(img, ph, item) {
        img.style.display = 'none';
        if (ph) {
            ph.style.display = 'flex';
            let icon = '📷';
            let text = 'No Preview';

            if (item.type === 'video') {
                icon = '🎥';
                text = 'Video';
            } else if (item.localOriginalExists === false && item.verified) {
                icon = '☁️';
                text = 'Archived to cloud';
            } else if (item.localOriginalExists === false) {
                icon = '❓';
                text = 'Local file missing';
            } else {
                const size = Number(item.fileSize || 0);
                if (size >= 20 * 1024 * 1024) {
                    icon = '💾';
                    text = 'Large file (>20MB)';
                } else {
                    icon = '📷';
                    text = 'Photo unavailable';
                }
            }
            ph.innerHTML = `<span style="font-size:24px; margin-bottom:4px;">${icon}</span><span style="font-size:11px; font-weight:600; color:var(--text-secondary); text-align:center; padding:0 8px;">${text}</span>`;
        }
    }

    async function next() {
        while (idx < items.length) {
            const item = items[idx++];
            const img = document.querySelector(`img[data-file="${item.fileName}"]`);
            if (!img) continue;
            const ph = img.parentElement.querySelector('.thumb-placeholder');

            // 1. Try `/thumbnail`
            let url = await fetchBlobURLSilent('/api/media/' + encodeURIComponent(item.fileName) + '/thumbnail');
            if (url) {
                await showImage(img, ph, url);
                continue;
            }

            // 2. Try `/file` fallback for photo (size < 20MB, local exists)
            if (item.type === 'photo' && item.localOriginalExists !== false) {
                const size = Number(item.fileSize || 0);
                if (!size || size < 20 * 1024 * 1024) {
                    url = await fetchBlobURLSilent('/api/media/' + encodeURIComponent(item.fileName) + '/file');
                    if (url) {
                        await showImage(img, ph, url);
                        continue;
                    }
                }
            }

            // 3. Fail, show placeholder
            await showPlaceholder(img, ph, item);
        }
    }

    const workers = [];
    for (let i = 0; i < concurrency; i++) workers.push(next());
    await Promise.all(workers);
}

function renderPagination(page, totalPages) {
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = '<span style="font-size:13px; color:var(--text-secondary); font-weight:600;">' + t('page') + ' ' + page + ' / ' + totalPages + '</span>';
    if (page > 1) html += '<button class="secondary" onclick="goPage(' + (page-1) + ')" style="min-height:34px; padding:4px 12px; margin-left:8px;">' + t('prev') + '</button>';
    if (page < totalPages) html += '<button class="secondary" onclick="goPage(' + (page+1) + ')" style="min-height:34px; padding:4px 12px; margin-left:8px;">' + t('next') + '</button>';
    el.innerHTML = html;
}

function goPage(p) { currentPage = p; loadMedia(); }

async function showDetail(fileName) {
    const data = await api('/api/media/' + encodeURIComponent(fileName));
    if (!data) return;
    const archived = !data.localOriginalExists && data.verified;
    const statusColors = { notQueued:'var(--text-secondary)', queued:'var(--accent)', uploading:'var(--warning)', completed:'var(--success)', failed:'var(--danger)', retrying:'var(--warning)' };
    const statusColor = statusColors[data.uploadStatus] || 'var(--text-secondary)';

    // Group 1: Preview Area
    const previewHTML = `<div class="preview-area" id="detailPreview" style="background:#000; border-radius:var(--radius-lg); aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; overflow:hidden;"><span style="color:var(--text-secondary); font-weight:600;">${t('loadingPreview')}</span></div>`;

    // Group 2: Cloud status & Local Status indicators
    let statusText = t(data.uploadStatus) || data.uploadStatus;
    if (archived) statusText = t('archived');

    let statusSectionHTML = `<div class="media-detail-section">
        <div class="media-detail-section-title" data-i18n="cloudStatus">Upload Status</div>
        <div class="status-row"><span class="status-row-label">${t('uploadStatus')}</span><span class="status-row-value" style="color:${statusColor}; font-weight:700;">${statusText}</span></div>
        <div class="status-row"><span class="status-row-label">${t('provider')}</span><span class="status-row-value">${data.uploadProvider || '-'}</span></div>
        <div class="status-row"><span class="status-row-label">${t('verified')}</span><span class="status-row-value">${data.verified ? '✅ '+t('yes') : '❌ '+t('no')}</span></div>
    </div>`;

    // Group 3: Primary Actions (Download vs Open in GDrive)
    let actionsHTML = '';
    if (data.localOriginalExists) {
        actionsHTML += `<button onclick="downloadFile('${fileName}')" class="primary-action" style="background:var(--accent); border:none; height:44px; margin-bottom:8px; font-weight:700;">${t('download')}</button>`;
    }
    if (data.remoteURL) {
        actionsHTML += `<button onclick="window.open('${data.remoteURL}','_blank')" class="primary-action" style="background:var(--success); border:none; height:44px; margin-bottom:8px; font-weight:700;">${t('openInGoogleDrive')}</button>`;
    }

    // Toggle Favorites & Toggle Protection
    actionsHTML += `<div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; width:100%; margin-bottom:8px;">
        <button class="secondary" onclick="toggleFav('${fileName}')" style="height:40px; font-size:13px; font-weight:600;">${data.isFavorite ? t('unfavorite') : t('favorite')}</button>
        <button class="secondary" onclick="toggleProtect('${fileName}')" style="height:40px; font-size:13px; font-weight:600;">${data.protected ? t('unprotect') : t('protect')}</button>
    </div>`;

    if (data.uploadStatus === 'notQueued' && data.localOriginalExists) {
        actionsHTML += `<button class="secondary" onclick="queueUpload('${fileName}')" style="width:100%; height:40px; font-size:13px; font-weight:600; margin-bottom:8px;">${t('uploadNow')}</button>`;
    }

    // Group 4: Metadata details
    const metadataSectionHTML = `<div class="media-detail-section">
        <div class="media-detail-section-title" data-i18n="metadata">Metadata</div>
        <div class="status-row"><span class="status-row-label">${t('type')}</span><span class="status-row-value">${data.type}</span></div>
        <div class="status-row"><span class="status-row-label">${t('source')}</span><span class="status-row-value">${data.source}</span></div>
        <div class="status-row"><span class="status-row-label">${t('size')}</span><span class="status-row-value">${formatSize(data.fileSize)}</span></div>
        ${data.uploadDate ? `<div class="status-row"><span class="status-row-label">${t('uploadedAt')}</span><span class="status-row-value">${new Date(data.uploadDate).toLocaleString()}</span></div>` : ''}
        ${data.localDeletedAt ? `<div class="status-row"><span class="status-row-label">${t('localDeleted')}</span><span class="status-row-value">${new Date(data.localDeletedAt).toLocaleString()}</span></div>` : ''}
    </div>`;

    // Group 5: Isolated Danger Zone Block
    let dangerActionsHTML = '';
    if (!data.protected) {
        dangerActionsHTML = `<div class="danger-zone" style="margin-top:16px;">
            <h4 data-i18n="dangerZone">Danger Zone</h4>
            <button class="danger" onclick="deleteMedia('${fileName}')" style="width:100%; height:44px; font-weight:700;">${t('delete')}</button>
        </div>`;
    }

    const modal = document.getElementById('detailModal');
    modal.innerHTML = `
        <div class="detail-overlay" onclick="closeDetail(event)">
            <div class="detail-card" onclick="event.stopPropagation()" style="display:flex; flex-direction:column; background:var(--surface-elevated); box-shadow:var(--shadow-card);">
                <button class="close-btn" onclick="document.getElementById('detailModal').innerHTML=''">&times;</button>
                ${previewHTML}
                <div class="detail-body" style="flex:1; overflow-y:auto; padding:20px;">
                    <h2 style="font-size:16px; font-weight:700; word-break:break-all; margin-bottom:14px; color:var(--text-primary);">${fileName}</h2>

                    <!-- Primary actions layout -->
                    <div style="margin-bottom:16px;">
                        ${actionsHTML}
                    </div>

                    ${statusSectionHTML}
                    ${metadataSectionHTML}
                    ${dangerActionsHTML}
                </div>
            </div>
        </div>
    `;

    loadDetailPreview(fileName, data);
}

function closeDetail(event) {
    if (event.target.classList.contains('detail-overlay')) {
        document.getElementById('detailModal').innerHTML = '';
    }
}

async function loadDetailPreview(fileName, data) {
    const el = document.getElementById('detailPreview');
    if (!el) return;

    if (!data.localOriginalExists) {
        el.innerHTML = `<div style="padding:40px 20px; text-align:center; color:var(--text-secondary);">
            <p style="margin-bottom:12px; font-weight:600; font-size:13px;">${t('originalArchived')}</p>
            ${data.remoteURL ? `<a href="${data.remoteURL}" target="_blank" class="btn" style="text-decoration:none; height:38px; line-height:38px; padding:0 20px; border-radius:var(--radius-md);">${t('openRemote')}</a>` : ''}
            </div>`;
        return;
    }

    const maxPreviewBytes = 50 * 1024 * 1024;
    const fileSize = data.fileSize || 0;

    try {
        if (data.type === 'photo') {
            const url = await fetchBlobURL('/api/media/' + encodeURIComponent(fileName) + '/file');
            el.innerHTML = `<img src="${url}" alt="${fileName}" style="width:100%; height:100%; object-fit:contain;">`;
        } else if (data.type === 'video') {
            if (fileSize > maxPreviewBytes) {
                try {
                    const thumbURL = await fetchBlobURL('/api/media/' + encodeURIComponent(fileName) + '/thumbnail');
                    el.innerHTML = `<img src="${thumbURL}" alt="${fileName}" style="width:100%; height:100%; object-fit:contain;">
                        <div class="video-notice" style="position:absolute; bottom:10px; left:10px; right:10px; background:rgba(0,0,0,0.8); border:1px solid var(--border-subtle); padding:8px 12px; border-radius:var(--radius-sm); color:var(--warning); text-align:center;">${t('largeVideoPreviewDisabled')} (${formatSize(fileSize)})</div>`;
                } catch {
                    el.innerHTML = `<div style="padding:40px 20px; text-align:center; color:var(--text-secondary);">${t('videoPreviewLimited')} (${formatSize(fileSize)})</div>`;
                }
            } else {
                const url = await fetchBlobURL('/api/media/' + encodeURIComponent(fileName) + '/file');
                el.innerHTML = `<video src="${url}" controls autoplay playsinline loop style="width:100%; height:100%; object-fit:contain;"></video>`;
            }
        }
    } catch (err) {
        el.innerHTML = `<div style="padding:40px 20px; text-align:center; color:var(--danger); font-weight:600;">${t('previewFailed')}</div>`;
    }
}

async function downloadFile(fileName) {
    const token = getToken();
    const url = '/api/media/' + encodeURIComponent(fileName) + '/file';
    const a = document.createElement('a');
    a.href = url + '?token=' + encodeURIComponent(token);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

async function toggleFav(fileName) {
    try {
        const data = await api('/api/media/' + encodeURIComponent(fileName) + '/favorite', { method: 'POST' });
        if (data) {
            toast(data.isFavorite ? t('favorite') + ' ' + t('success') : t('unfavorite') + ' ' + t('success'), 'success');
            showDetail(fileName);
            loadMedia();
        }
    } catch(e){}
}

async function toggleProtect(fileName) {
    try {
        const data = await api('/api/media/' + encodeURIComponent(fileName) + '/protect', { method: 'POST' });
        if (data) {
            toast(data.protected ? t('protect') + ' ' + t('success') : t('unprotect') + ' ' + t('success'), 'success');
            showDetail(fileName);
            loadMedia();
        }
    } catch(e){}
}

async function queueUpload(fileName) {
    try {
        const data = await api('/api/media/' + encodeURIComponent(fileName) + '/upload', { method: 'POST' });
        if (data) {
            toast(t('queuedForUpload'), 'success');
            showDetail(fileName);
            loadMedia();
        }
    } catch(e){}
}

async function deleteMedia(fileName) {
    if (!confirm(t('deleteConfirm') + '\n' + fileName)) return;
    try {
        await api('/api/media/' + encodeURIComponent(fileName), { method: 'DELETE' });
        toast(t('deletedSuccess'), 'success');
        document.getElementById('detailModal').innerHTML = '';
        loadMedia();
    } catch(e){}
}

function formatSize(bytes) {
    if (!bytes) return '-';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

// Bind search triggers (use global window.debounce from app.js)
document.getElementById('searchInput').addEventListener('input', window.debounce(loadMedia, 300));
</script>

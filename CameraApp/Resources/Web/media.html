<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="macMonitorSystem">Mac监控系统 - Media Library</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50;
    display: flex; align-items: center; justify-content: center;
}
.detail-card {
    background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px;
    width: 90vw; max-width: 800px; max-height: 90vh; overflow: auto; position: relative;
}
.detail-card .preview-area { min-height: 200px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 12px 12px 0 0; }
.detail-card .preview-area img, .detail-card .preview-area video { max-width: 100%; max-height: 60vh; display: block; border-radius: 12px 12px 0 0; }
.detail-body { padding: 16px 20px; }
.detail-body h2 { font-size: 14px; word-break: break-all; margin-bottom: 12px; }
.detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; color: var(--fg2); margin-bottom: 16px; }
.detail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.detail-actions button { font-size: 13px; padding: 6px 14px; }
.close-btn { position: absolute; top: 12px; right: 16px; background: rgba(0,0,0,0.6); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 2; }
.archived-badge { background: rgba(255,152,0,0.15); color: var(--orange); font-size: 11px; padding: 2px 6px; border-radius: 8px; margin-left: 6px; }
.thumb-placeholder { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; color: var(--fg2); font-size: 12px; background: var(--bg3); }
.media-item img { width: 100%; height: 100%; object-fit: cover; }
.media-item img.loading { display: none; }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar">
    <div class="sidebar-header" data-i18n="appName">Mac监控系统</div>
    <a href="/" class="nav-item" data-i18n="dashboard">Dashboard</a>
    <a href="/live.html" class="nav-item" data-i18n="liveView">Live View</a>
    <a href="/media.html" class="nav-item active" data-i18n="mediaLibrary">Media Library</a>
    <a href="/tasks.html" class="nav-item" data-i18n="automation">Automation</a>
    <a href="/uploads.html" class="nav-item" data-i18n="uploadQueue">Upload Queue</a>
    <a href="/health.html" class="nav-item" data-i18n="health">Health</a>
    <a href="/logs.html" class="nav-item" data-i18n="activityLog">Activity Log</a>
    <a href="/settings.html" class="nav-item" data-i18n="settings">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout" data-i18n="logout">Logout</a></div>
</nav>
<main class="content">
    <button class="hamburger" id="menuBtn">&#9776;</button>
    <h1><span data-i18n="mediaLibrary">Media Library</span> <span id="totalCount" style="font-size:14px;color:var(--fg2);font-weight:400;"></span></h1>
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search filename..." data-i18n="search" style="width:180px;">
        <select id="typeFilter"><option value="" data-i18n="allTypes">All Types</option><option value="photo" data-i18n="photos">Photos</option><option value="video" data-i18n="videos">Videos</option></select>
        <select id="sourceFilter"><option value="" data-i18n="allSources">All Sources</option><option value="manual" data-i18n="manual">Manual</option><option value="automation" data-i18n="automationSrc">Automation</option><option value="motion" data-i18n="motion">Motion</option></select>
        <select id="statusFilter"><option value="" data-i18n="allStatus">All Status</option><option value="notQueued" data-i18n="notUploaded">Not uploaded</option><option value="queued" data-i18n="queued">Queued</option><option value="uploading" data-i18n="uploading">Uploading</option><option value="completed" data-i18n="uploaded">Uploaded</option><option value="failed" data-i18n="failed">Failed</option></select>
        <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--fg2);cursor:pointer;">
            <input type="checkbox" id="favFilter" style="width:auto;margin:0;"> <span data-i18n="favorites">Favorites</span>
        </label>
    </div>
    <div class="media-grid" id="mediaGrid"></div>
    <div class="pagination" id="pagination"></div>
</main>
<div id="detailModal"></div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('mediaLibrary');
});

let currentPage = 1;
const perPage = 30;
const blobURLs = new Set();

function revokeBlobURLs() {
    for (const u of blobURLs) URL.revokeObjectURL(u);
    blobURLs.clear();
}

async function authFetch(url) {
    const token = getToken();
    const res = await fetch(url, {
        headers: { 'Authorization': 'Bearer ' + token },
        cache: 'no-cache'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res;
}

async function fetchBlobURL(url) {
    const res = await authFetch(url);
    const blob = await res.blob();
    const blobURL = URL.createObjectURL(blob);
    blobURLs.add(blobURL);
    return blobURL;
}

function buildURL() {
    let url = '/api/media?page=' + currentPage + '&perPage=' + perPage;
    const search = document.getElementById('searchInput').value.trim();
    const type = document.getElementById('typeFilter').value;
    const source = document.getElementById('sourceFilter').value;
    const status = document.getElementById('statusFilter').value;
    const fav = document.getElementById('favFilter').checked;
    if (search) url += '&search=' + encodeURIComponent(search);
    if (type) url += '&type=' + type;
    if (source) url += '&source=' + source;
    if (status) url += '&uploadStatus=' + status;
    if (fav) url += '&favorite=true';
    return url;
}

async function loadMedia() {
    revokeBlobURLs();
    const data = await api(buildURL());
    if (!data) return;
    document.getElementById('totalCount').textContent = '(' + data.total + ')';
    const grid = document.getElementById('mediaGrid');
    if (data.items.length === 0) {
        grid.innerHTML = '<p style="color:var(--fg2);padding:40px 0;text-align:center;">' + t('noMediaFound') + '</p>';
    } else {
        grid.innerHTML = data.items.map(item => {
            const archived = !item.localOriginalExists && item.verified;
            const badges = [];
            if (item.isFavorite) badges.push('<span style="color:#f44336;">&#9829;</span>');
            if (item.protected) badges.push('<span style="color:var(--accent);">&#128274;</span>');
            if (item.verified) badges.push('<span class="verified-badge">' + t('verifiedBadge') + '</span>');
            if (item.remoteFileID) badges.push('<span class="cloud-badge">' + t('cloudBadge') + '</span>');
            if (archived) badges.push('<span class="archived-badge">' + t('archivedBadge') + '</span>');
            return '<div class="media-item" onclick="showDetail(\'' + item.fileName + '\')">' +
                '<div class="thumb-placeholder">' + t('noPreview') + '</div>' +
                '<img class="loading" data-file="' + item.fileName + '" alt="">' +
                '<div class="overlay"><span>' + item.type + '</span> ' + badges.join(' ') + '</div></div>';
        }).join('');
        loadVisibleThumbnails(data.items);
    }
    renderPagination(data.page, data.totalPages);
}

async function loadVisibleThumbnails(items) {
    const concurrency = 4;
    let idx = 0;
    async function next() {
        while (idx < items.length) {
            const item = items[idx++];
            const img = document.querySelector('img[data-file="' + item.fileName + '"]');
            if (!img) continue;
            try {
                const url = await fetchBlobURL('/api/media/' + encodeURIComponent(item.fileName) + '/thumbnail');
                img.src = url;
                img.classList.remove('loading');
            } catch {
                img.style.display = 'none';
                const ph = img.parentElement.querySelector('.thumb-placeholder');
                if (ph) ph.style.display = 'flex';
            }
        }
    }
    const workers = [];
    for (let i = 0; i < concurrency; i++) workers.push(next());
    await Promise.all(workers);
}

function renderPagination(page, totalPages) {
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = '<span style="font-size:13px;color:var(--fg2);">' + t('page') + ' ' + page + ' / ' + totalPages + '</span>';
    if (page > 1) html += '<button class="secondary" onclick="goPage(' + (page-1) + ')">' + t('prev') + '</button>';
    if (page < totalPages) html += '<button class="secondary" onclick="goPage(' + (page+1) + ')">' + t('next') + '</button>';
    el.innerHTML = html;
}

function goPage(p) { currentPage = p; loadMedia(); }

async function showDetail(fileName) {
    const data = await api('/api/media/' + encodeURIComponent(fileName));
    if (!data) return;
    const archived = !data.localOriginalExists && data.verified;
    const statusColors = { notQueued:'var(--fg2)', queued:'var(--accent)', uploading:'var(--orange)', completed:'var(--green)', failed:'var(--red)', retrying:'var(--orange)' };
    const statusColor = statusColors[data.uploadStatus] || 'var(--fg2)';

    let actions = '';
    if (data.localOriginalExists) {
        actions += '<button onclick="downloadFile(\'' + fileName + '\')">' + t('download') + '</button>';
    } else if (archived) {
        actions += '<button disabled style="opacity:0.4;cursor:not-allowed;">' + t('download') + '</button>';
    }
    if (data.remoteURL) {
        actions += '<button class="secondary" onclick="window.open(\'' + data.remoteURL + '\',\'_blank\')">' + t('openInGoogleDrive') + '</button>';
    }
    actions += '<button class="secondary" onclick="toggleFav(\'' + fileName + '\')">' + (data.isFavorite ? t('unfavorite') : t('favorite')) + '</button>';
    actions += '<button class="secondary" onclick="toggleProtect(\'' + fileName + '\')">' + (data.protected ? t('unprotect') : t('protect')) + '</button>';
    if (data.uploadStatus === 'notQueued' && data.localOriginalExists) {
        actions += '<button class="secondary" onclick="queueUpload(\'' + fileName + '\')">' + t('uploadNow') + '</button>';
    }
    if (!data.protected) {
        actions += '<button class="danger" onclick="deleteMedia(\'' + fileName + '\')">' + t('delete') + '</button>';
    }

    const previewHTML = '<div class="preview-area" id="detailPreview"><span style="color:var(--fg2);">' + t('loadingPreview') + '</span></div>';
    const modal = document.getElementById('detailModal');
    modal.innerHTML = '<div class="detail-overlay" onclick="closeDetail(event)">' +
        '<div class="detail-card" onclick="event.stopPropagation()">' +
        '<button class="close-btn" onclick="document.getElementById(\'detailModal\').innerHTML=\'\'">&times;</button>' +
        previewHTML +
        '<div class="detail-body">' +
        '<h2>' + fileName + (data.verified ? ' <span class="verified-badge">' + t('verifiedBadge') + '</span>' : '') + (data.remoteFileID ? ' <span class="cloud-badge">' + t('cloudBadge') + '</span>' : '') + (archived ? ' <span class="archived-badge">' + t('archivedBadge') + '</span>' : '') + '</h2>' +
        '<div class="detail-meta">' +
        '<span>' + t('type') + ': ' + data.type + '</span>' +
        '<span>' + t('source') + ': ' + data.source + '</span>' +
        '<span>' + t('size') + ': ' + formatSize(data.fileSize) + '</span>' +
        '<span>' + t('status') + ': <span style="color:' + statusColor + ';">' + data.uploadStatus + '</span></span>' +
        '<span>' + t('provider') + ': ' + (data.uploadProvider || '-') + '</span>' +
        '<span>' + t('verified') + ': ' + (data.verified ? t('yes') : t('no')) + '</span>' +
        (data.remoteURL ? '<span style="grid-column:span 2;word-break:break-all;">' + t('remote') + ': <a href="' + data.remoteURL + '" target="_blank" style="color:var(--accent);">' + data.remoteURL + '</a></span>' : '') +
        (data.uploadDate ? '<span>' + t('uploadedAt') + ': ' + new Date(data.uploadDate).toLocaleString() + '</span>' : '') +
        (data.localDeletedAt ? '<span>' + t('localDeleted') + ': ' + new Date(data.localDeletedAt).toLocaleString() + '</span>' : '') +
        '</div>' +
        '<div class="detail-actions">' + actions + '</div>' +
        '</div></div>';

    loadDetailPreview(fileName, data);
}

async function loadDetailPreview(fileName, data) {
    const el = document.getElementById('detailPreview');
    if (!el) return;

    if (!data.localOriginalExists) {
        el.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--fg2);">' +
            '<p style="margin-bottom:8px;">' + t('originalArchived') + '</p>' +
            (data.remoteURL ? '<a href="' + data.remoteURL + '" target="_blank" style="color:var(--accent);">' + t('openRemote') + '</a>' : '') +
            '</div>';
        return;
    }

    const maxPreviewBytes = 50 * 1024 * 1024;
    const fileSize = data.fileSize || 0;

    try {
        if (data.type === 'photo') {
            const url = await fetchBlobURL('/api/media/' + encodeURIComponent(fileName) + '/file');
            el.innerHTML = '<img src="' + url + '" alt="' + fileName + '">';
        } else if (data.type === 'video') {
            if (fileSize > maxPreviewBytes) {
                // Large video: show thumbnail instead
                try {
                    const thumbURL = await fetchBlobURL('/api/media/' + encodeURIComponent(fileName) + '/thumbnail');
                    el.innerHTML = '<img src="' + thumbURL + '" alt="' + fileName + '" style="max-height:400px;">' +
                        '<div style="padding:12px;text-align:center;color:var(--fg2);">' + t('largeVideoPreviewDisabled') + ' (' + formatSize(fileSize) + ')</div>';
                } catch {
                    el.innerHTML = '<div style="padding:60px;text-align:center;color:var(--fg2);">' + t('videoPreviewLimited') + ' (' + formatSize(fileSize) + ')</div>';
                }
            } else {
                const url = await fetchBlobURL('/api/media/' + encodeURIComponent(fileName) + '/file');
                el.innerHTML = '<video controls src="' + url + '" style="max-width:100%;max-height:60vh;"></video>';
            }
        }
    } catch (e) {
        el.innerHTML = '<div style="padding:60px;text-align:center;color:var(--red);">' + t('previewFailed') + ': ' + e.message + '</div>';
    }
}

function closeDetail(e) {
    if (e.target.classList.contains('detail-overlay')) document.getElementById('detailModal').innerHTML = '';
}

async function downloadFile(fileName) {
    try {
        const res = await authFetch('/api/media/' + encodeURIComponent(fileName) + '/file');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
        toast(t('downloadFailed') + ': ' + e.message, 'error');
    }
}

async function toggleFav(fileName) {
    await api('/api/media/' + encodeURIComponent(fileName) + '/favorite', { method: 'POST', body: {} });
    showDetail(fileName);
    loadMedia();
}

async function toggleProtect(fileName) {
    await api('/api/media/' + encodeURIComponent(fileName) + '/protect', { method: 'POST', body: {} });
    showDetail(fileName);
    loadMedia();
}

async function queueUpload(fileName) {
    try {
        await api('/api/media/' + encodeURIComponent(fileName) + '/upload', { method: 'POST', body: {} });
        toast(t('queuedForUpload'));
        showDetail(fileName);
    } catch (e) {}
}

async function deleteMedia(fileName) {
    if (!confirm(t('deleteConfirm'))) return;
    try {
        await api('/api/media/' + encodeURIComponent(fileName), { method: 'DELETE' });
        document.getElementById('detailModal').innerHTML = '';
        toast(t('deletedSuccess'));
        loadMedia();
    } catch (e) {}
}

function formatSize(bytes) {
    if (!bytes || bytes === 0) return '-';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
    return (bytes/1073741824).toFixed(1) + ' GB';
}

// Debounce search
let searchTimer;
document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentPage = 1; loadMedia(); }, 300);
});
document.getElementById('typeFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });
document.getElementById('sourceFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });
document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });
document.getElementById('favFilter').addEventListener('change', () => { currentPage = 1; loadMedia(); });

// ESC to close modal
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.getElementById('detailModal').innerHTML = '';
});

loadMedia();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Activity Log</title>
<link rel="stylesheet" href="/css/style.css?v=2.4.11">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content has-cards">
    <h1 data-i18n="activityLog">Activity Log</h1>
    
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search..." data-i18n="searchPlaceholder">
        <select id="categoryFilter">
            <option value="" data-i18n="allCategories">All Categories</option>
            <option value="camera">Camera</option>
            <option value="automation">Automation</option>
            <option value="telegram">Telegram</option>
            <option value="motion">Motion</option>
            <option value="webServer">Web Server</option>
            <option value="upload">Upload</option>
        </select>
        <button class="secondary" onclick="loadLogs()" data-i18n="refresh" style="min-height:38px;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            <span data-i18n="refresh">Refresh</span>
        </button>
        <a href="/api/logs/export" class="btn secondary" target="_blank" data-i18n="export" style="min-height:38px; text-decoration:none;">Export</a>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th data-i18n="time">Time</th>
                    <th data-i18n="level">Level</th>
                    <th data-i18n="category">Category</th>
                    <th data-i18n="message">Message</th>
                </tr>
            </thead>
            <tbody id="logList"></tbody>
        </table>
    </div>
    
    <div class="task-cards" id="logCards"></div>
</main>

<script src="/js/i18n.js?v=2.4.11"></script>
<script src="/js/app.js?v=2.4.11"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('activityLog');
});

async function loadLogs() {
    const search = document.getElementById('searchInput').value;
    const cat = document.getElementById('categoryFilter').value;
    let url = '/api/logs?limit=200';
    if (search) url += `&search=${encodeURIComponent(search)}`;
    if (cat) url += `&category=${cat}`;
    const data = await api(url);
    if (!data) return;
    
    document.getElementById('logList').innerHTML = data.logs.map(l => {
        const lvlClass = l.level === 'error' ? 'badge-red' : l.level === 'warning' ? 'badge-orange' : 'badge-green';
        return `<tr>
            <td style="font-size:13px; color:var(--text-secondary);">${l.timestamp}</td>
            <td><span class="badge ${lvlClass}">${l.level}</span></td>
            <td><strong>${l.category}</strong></td>
            <td><span style="font-weight:600; color:var(--text-primary);">${l.message}${l.detail ? ' — '+l.detail : ''}</span></td>
        </tr>`;
    }).join('');
    
    // Mobile cards
    document.getElementById('logCards').innerHTML = data.logs.map(l => {
        const lvlClass = l.level === 'error' ? 'badge-red' : l.level === 'warning' ? 'badge-orange' : 'badge-green';
        return `<div class="task-card">
            <div class="task-card-header">
                <span class="badge ${lvlClass}">${l.level}</span>
                <span style="font-size:12px; color:var(--text-secondary);">${l.timestamp}</span>
            </div>
            <div style="font-size:14px; color:var(--text-primary); font-weight:600; margin-top:4px; line-height:1.45;">
                ${l.message}${l.detail ? ' — ' + l.detail : ''}
            </div>
            <div class="task-card-meta">
                <span>Category: <strong>${l.category}</strong></span>
            </div>
        </div>`;
    }).join('');
}

document.getElementById('searchInput').addEventListener('input', debounce(loadLogs, 300));
document.getElementById('categoryFilter').addEventListener('change', loadLogs);

function debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

loadLogs();
</script>
</body>
</html>

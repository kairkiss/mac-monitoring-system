<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="macMonitorSystem">Mac监控系统 - Activity Log</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header" data-i18n="appName">Mac监控系统</div>
    <a href="/" class="nav-item" data-i18n="dashboard">Dashboard</a>
    <a href="/live.html" class="nav-item" data-i18n="liveView">Live View</a>
    <a href="/media.html" class="nav-item" data-i18n="mediaLibrary">Media Library</a>
    <a href="/tasks.html" class="nav-item" data-i18n="automation">Automation</a>
    <a href="/uploads.html" class="nav-item" data-i18n="uploadQueue">Upload Queue</a>
    <a href="/health.html" class="nav-item" data-i18n="health">Health</a>
    <a href="/logs.html" class="nav-item active" data-i18n="activityLog">Activity Log</a>
    <a href="/settings.html" class="nav-item" data-i18n="settings">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout" data-i18n="logout">Logout</a></div>
</nav>
<main class="content">
    <h1 data-i18n="activityLog">Activity Log</h1>
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search..." data-i18n="searchPlaceholder">
        <select id="categoryFilter">
            <option value="" data-i18n="allCategories">All Categories</option>
            <option value="camera">Camera</option>
            <option value="automation">Automation</option>
            <option value="telegram">Telegram</option>
            <option value="motion">Motion</option>
            <option value="webServer">Web Server</option>
            <option value="upload">Upload</option>
        </select>
        <button class="secondary" onclick="loadLogs()" data-i18n="refresh">Refresh</button>
        <a href="/api/logs/export" class="btn secondary" target="_blank" data-i18n="export">Export</a>
    </div>
    <table>
        <thead><tr><th data-i18n="time">Time</th><th data-i18n="level">Level</th><th data-i18n="category">Category</th><th data-i18n="message">Message</th></tr></thead>
        <tbody id="logList"></tbody>
    </table>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('activityLog');
});

async function loadLogs() {
    const search = document.getElementById('searchInput').value;
    const cat = document.getElementById('categoryFilter').value;
    let url = '/api/logs?limit=200';
    if (search) url += `&search=${encodeURIComponent(search)}`;
    if (cat) url += `&category=${cat}`;
    const data = await api(url);
    if (!data) return;
    document.getElementById('logList').innerHTML = data.logs.map(l => {
        const lvlColor = l.level === 'error' ? 'badge-red' : l.level === 'warning' ? 'badge-orange' : 'badge-green';
        return `<tr><td>${l.timestamp}</td><td><span class="badge ${lvlColor}">${l.level}</span></td><td>${l.category}</td><td>${l.message}${l.detail ? ' — '+l.detail : ''}</td></tr>`;
    }).join('');
}
document.getElementById('searchInput').addEventListener('input', debounce(loadLogs, 300));
document.getElementById('categoryFilter').addEventListener('change', loadLogs);
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
loadLogs();
</script>
</body>
</html>

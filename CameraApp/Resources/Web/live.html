<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="macMonitorSystem">Mac监控系统 - Live View</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar">
    <div class="sidebar-header" data-i18n="appName">Mac监控系统</div>
    <a href="/" class="nav-item" data-i18n="dashboard">Dashboard</a>
    <a href="/live.html" class="nav-item active" data-i18n="liveView">Live View</a>
    <a href="/media.html" class="nav-item" data-i18n="mediaLibrary">Media Library</a>
    <a href="/tasks.html" class="nav-item" data-i18n="automation">Automation</a>
    <a href="/uploads.html" class="nav-item" data-i18n="uploadQueue">Upload Queue</a>
    <a href="/health.html" class="nav-item" data-i18n="health">Health</a>
    <a href="/logs.html" class="nav-item" data-i18n="activityLog">Activity Log</a>
    <a href="/settings.html" class="nav-item" data-i18n="settings">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout" data-i18n="logout">Logout</a></div>
</nav>
<main class="content">
    <button class="hamburger" id="menuBtn">&#9776;</button>
    <h1 data-i18n="liveView">Live View</h1>
    <div class="card" style="max-width:640px;padding:16px;">
        <div id="snapshotWrap" style="text-align:center;min-height:360px;display:flex;align-items:center;justify-content:center;">
            <img id="snapshot" src="" alt="Live snapshot" style="max-width:100%;border-radius:var(--radius);display:none;">
            <p id="snapshotPlaceholder" style="color:var(--fg2);" data-i18n="connectingCamera">Connecting to camera...</p>
        </div>
        <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;">
            <span id="deviceName" style="color:var(--fg2);font-size:13px;"></span>
            <span id="snapshotInfo" style="color:var(--fg2);font-size:12px;"></span>
        </div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px;align-items:center;">
        <button id="captureBtn" data-i18n="capturePhoto">Capture Photo</button>
        <button id="recordBtn" style="background:#e53935;" data-i18n="startRecording">Start Recording</button>
        <span id="recordStatus" style="color:#a0a0a0;font-size:13px;"></span>
    </div>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('liveView');
});

let isRecording = false;
let refreshInterval = 2000;
let timer = null;
let consecutiveErrors = 0;

function startSnapshotRefresh() {
    if (timer) clearInterval(timer);
    timer = setInterval(refreshSnapshot, refreshInterval);
}

async function refreshSnapshot() {
    const img = document.getElementById('snapshot');
    const placeholder = document.getElementById('snapshotPlaceholder');
    const info = document.getElementById('snapshotInfo');
    try {
        const token = getToken();
        const res = await fetch('/api/camera/snapshot.jpg', {
            headers: { 'Authorization': 'Bearer ' + token },
            cache: 'no-cache'
        });
        if (!res.ok) {
            throw new Error('HTTP ' + res.status);
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        // Revoke previous URL to avoid memory leak
        if (img.src && img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
        img.src = url;
        img.style.display = 'block';
        placeholder.style.display = 'none';
        consecutiveErrors = 0;
        const now = new Date();
        info.textContent = now.toLocaleTimeString();
        // Restore fast refresh if it was slowed down
        if (refreshInterval !== 2000) {
            refreshInterval = 2000;
            startSnapshotRefresh();
        }
    } catch (e) {
        consecutiveErrors++;
        if (consecutiveErrors >= 3) {
            placeholder.textContent = t('cameraNotAvailable');
            placeholder.style.display = 'block';
            img.style.display = 'none';
            // Slow down polling on persistent errors
            if (refreshInterval !== 5000) {
                refreshInterval = 5000;
                startSnapshotRefresh();
            }
        }
    }
}

async function refreshStatus() {
    try {
        const data = await api('/api/camera/record/status');
        if (!data) return;
        isRecording = data.isRecording;
        document.getElementById('deviceName').textContent = data.deviceName ? 'Camera: ' + data.deviceName : '';
        const btn = document.getElementById('recordBtn');
        const status = document.getElementById('recordStatus');
        if (isRecording) {
            btn.textContent = t('stopRecording');
            btn.style.background = '#666';
            status.textContent = t('recording') + '...';
            status.style.color = '#f44336';
        } else {
            btn.textContent = t('startRecording');
            btn.style.background = '#e53935';
            status.textContent = '';
        }
    } catch (e) {}
}

document.getElementById('captureBtn').addEventListener('click', async () => {
    try {
        const data = await api('/api/camera/capture', { method: 'POST', body: {} });
        if (data) toast(t('captured') + ': ' + data.fileName);
    } catch (e) {}
});

document.getElementById('recordBtn').addEventListener('click', async () => {
    const url = isRecording ? '/api/camera/record/stop' : '/api/camera/record/start';
    try {
        const data = await api(url, { method: 'POST', body: {} });
        if (data) {
            toast(data.status === 'recording' ? t('recordingStarted') : t('recordingSaved') + ': ' + data.fileName);
            refreshStatus();
        }
    } catch (e) {}
});

// Slow down when tab is hidden, restore when visible
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        refreshInterval = 5000;
    } else {
        refreshInterval = 2000;
        refreshSnapshot();
    }
    startSnapshotRefresh();
});

refreshStatus();
refreshSnapshot();
startSnapshotRefresh();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>

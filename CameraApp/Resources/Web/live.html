<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="macMonitorSystem">Mac Monitor - Live View</title>
<link rel="stylesheet" href="/css/style.css?v=2.4.10">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar"></nav>
<main class="content">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h1 data-i18n="liveView" style="margin:0;">Live View</h1>
        <button id="refreshBtn" onclick="refreshSnapshot()" class="secondary" style="min-height:36px; padding:0 12px; font-size:13px;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px;"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            <span data-i18n="refresh">Refresh</span>
        </button>
    </div>
    
    <div class="live-container" style="max-width:100%;">
        <!-- Large full width preview wrapper -->
        <div class="live-preview-card" style="aspect-ratio: 16/9; background:#000; border-radius:var(--radius-xl); overflow:hidden; border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center; position:relative;">
            <img id="snapshot" src="" alt="Live snapshot" style="display:none; width:100%; height:100%; object-fit:contain;">
            
            <!-- fallback empty state -->
            <div id="snapshotPlaceholder" class="empty-state">
                <div class="empty-state-icon">
                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
                <div class="empty-state-text" data-i18n="connectingCamera">Connecting to camera...</div>
            </div>
        </div>
        
        <!-- Metadata metrics card -->
        <div class="mini-card" style="margin-top:16px; display:flex; flex-direction:column; gap:8px;">
            <div class="metric-strip">
                <span style="display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:13px; color:var(--text-secondary);">
                    <span class="status-dot dot-gray" id="cameraStatusDot"></span>
                    <span id="deviceName">Camera: -</span>
                </span>
                <span id="snapshotInfo" style="color:var(--text-tertiary); font-size:12px; font-weight:600;">-</span>
            </div>
            <div class="metric-strip" style="border-top:1px solid var(--border-subtle); padding-top:8px;">
                <span style="font-weight:600; font-size:13px; color:var(--text-secondary);" data-i18n="status">Status</span>
                <span id="recordStatus" style="font-weight:700; font-size:13px; color:var(--danger);">-</span>
            </div>
        </div>
        
        <!-- Enlarged tactile actions -->
        <div class="live-controls" style="margin-top:20px; display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; max-width:100%;">
            <button id="captureBtn" class="secondary" style="height:48px; font-size:14px; font-weight:700; border-radius:var(--radius-md);">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                <span data-i18n="capturePhoto">Capture Photo</span>
            </button>
            <button id="recordBtn" style="background:var(--danger); height:48px; font-size:14px; font-weight:700; border-radius:var(--radius-md); border:none; color:#fff;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg>
                <span data-i18n="startRecording">Start Recording</span>
            </button>
        </div>

        <!-- Security Warning local only banner -->
        <div class="card" style="margin-top:24px; border-left:4px solid var(--accent); background:rgba(0,122,255,0.04); padding:16px; border-radius:0 var(--radius-lg) var(--radius-lg) 0;">
            <p style="font-size:13px; line-height:1.45; color:var(--text-secondary);">
                <strong style="color:var(--text-primary);" data-i18n="localOnly">Local Only</strong>: 
                <span data-i18n="localOnlyNotice">Manual capture defaulted to save locally, won't auto-upload to cloud.</span>
            </p>
        </div>
    </div>
</main>

<script src="/js/i18n.js?v=2.4.10"></script>
<script src="/js/app.js?v=2.4.10"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.title = t('macMonitorSystem') + ' - ' + t('liveView');
});

let isRecording = false;
let refreshInterval = 2000;
let timer = null;
let consecutiveErrors = 0;

function startSnapshotRefresh() {
    if (timer) clearInterval(timer);
    timer = setInterval(refreshSnapshot, refreshInterval);
}

async function refreshSnapshot() {
    const img = document.getElementById('snapshot');
    const placeholder = document.getElementById('snapshotPlaceholder');
    const info = document.getElementById('snapshotInfo');
    const camDot = document.getElementById('cameraStatusDot');
    try {
        const token = getToken();
        const res = await fetch('/api/camera/snapshot.jpg', {
            headers: { 'Authorization': 'Bearer ' + token },
            cache: 'no-cache'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        if (img.src && img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
        img.src = url;
        img.style.display = 'block';
        placeholder.style.display = 'none';
        consecutiveErrors = 0;
        if (camDot) {
            camDot.className = 'status-dot dot-green';
        }
        const now = new Date();
        info.textContent = `${t('lastFrame')}: ${now.toLocaleTimeString()}`;
        if (refreshInterval !== 2000) {
            refreshInterval = 2000;
            startSnapshotRefresh();
        }
    } catch (e) {
        consecutiveErrors++;
        if (consecutiveErrors >= 3) {
            const phText = placeholder.querySelector('.empty-state-text');
            if (phText) phText.textContent = t('previewUnavailable');
            placeholder.style.display = 'block';
            img.style.display = 'none';
            if (camDot) {
                camDot.className = 'status-dot dot-red';
            }
            if (refreshInterval !== 5000) {
                refreshInterval = 5000;
                startSnapshotRefresh();
            }
        }
    }
}

async function refreshStatus() {
    try {
        const data = await api('/api/camera/record/status');
        if (!data) return;
        isRecording = data.isRecording;
        document.getElementById('deviceName').textContent = data.deviceName ? t('camera') + ': ' + data.deviceName : t('noCameraAvailable');
        
        const btn = document.getElementById('recordBtn');
        const status = document.getElementById('recordStatus');
        
        if (isRecording) {
            btn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><rect x="4" y="4" width="16" height="16" rx="2" ry="2" fill="currentColor"></rect></svg> <span>${t('stopRecording')}</span>`;
            btn.style.background = 'var(--text-tertiary)';
            status.textContent = t('recording') + '...';
            status.style.color = 'var(--danger)';
        } else {
            btn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg> <span>${t('startRecording')}</span>`;
            btn.style.background = 'var(--danger)';
            status.textContent = t('idle');
            status.style.color = 'var(--text-secondary)';
        }
    } catch (e) {}
}

document.getElementById('captureBtn').addEventListener('click', async () => {
    try {
        const data = await api('/api/camera/capture', { method: 'POST', body: {} });
        if (data) toast(t('captured') + ': ' + data.fileName, 'success');
    } catch (e) {}
});

document.getElementById('recordBtn').addEventListener('click', async () => {
    const url = isRecording ? '/api/camera/record/stop' : '/api/camera/record/start';
    try {
        const data = await api(url, { method: 'POST', body: {} });
        if (data) {
            toast(data.status === 'recording' ? t('recordingStarted') : t('recordingSaved') + ': ' + data.fileName, 'success');
            refreshStatus();
        }
    } catch (e) {}
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        refreshInterval = 5000;
    } else {
        refreshInterval = 2000;
        refreshSnapshot();
    }
    startSnapshotRefresh();
});

refreshStatus();
refreshSnapshot();
startSnapshotRefresh();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac监控系统 - Live View</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header">Mac监控系统</div>
    <a href="/" class="nav-item">Dashboard</a>
    <a href="/live.html" class="nav-item active">Live View</a>
    <a href="/media.html" class="nav-item">Media Library</a>
    <a href="/tasks.html" class="nav-item">Automation</a>
    <a href="/uploads.html" class="nav-item">Upload Queue</a>
    <a href="/health.html" class="nav-item">Health</a>
    <a href="/logs.html" class="nav-item">Activity Log</a>
    <a href="/settings.html" class="nav-item">Settings</a>
    <div class="sidebar-footer"><span id="userInfo"></span><a href="#" id="logoutBtn" class="logout">Logout</a></div>
</nav>
<main class="content">
    <h1>Live View</h1>
    <div class="card" style="max-width:640px;padding:24px;text-align:center;">
        <p style="color:var(--fg2);margin-bottom:12px;">Live snapshot preview is not available in v2.0.2. Remote capture and recording controls are available below.</p>
        <span id="deviceName" style="color:var(--fg2);font-size:13px;"></span>
    </div>
    <div style="margin-top:16px; display:flex; gap:8px; align-items:center;">
        <button id="captureBtn">Capture Photo</button>
        <button id="recordBtn" style="background:#e53935;">Start Recording</button>
        <span id="recordStatus" style="color:#a0a0a0;font-size:13px;"></span>
    </div>
</main>
<script src="/js/app.js"></script>
<script>
let isRecording = false;

async function refreshStatus() {
    try {
        const data = await api('/api/camera/record/status');
        if (!data) return;
        isRecording = data.isRecording;
        document.getElementById('deviceName').textContent = data.deviceName ? `Camera: ${data.deviceName}` : '';
        const btn = document.getElementById('recordBtn');
        const status = document.getElementById('recordStatus');
        if (isRecording) {
            btn.textContent = 'Stop Recording';
            btn.style.background = '#666';
            status.textContent = 'Recording...';
            status.style.color = '#f44336';
        } else {
            btn.textContent = 'Start Recording';
            btn.style.background = '#e53935';
            status.textContent = '';
        }
    } catch (e) {}
}

document.getElementById('captureBtn').addEventListener('click', async () => {
    try {
        const data = await api('/api/camera/capture', { method: 'POST', body: {} });
        if (data) toast(`Captured: ${data.fileName}`);
    } catch (e) {}
});

document.getElementById('recordBtn').addEventListener('click', async () => {
    const url = isRecording ? '/api/camera/record/stop' : '/api/camera/record/start';
    try {
        const data = await api(url, { method: 'POST', body: {} });
        if (data) {
            toast(data.status === 'recording' ? 'Recording started' : `Recording saved: ${data.fileName}`);
            refreshStatus();
        }
    } catch (e) {}
});

refreshStatus();
setInterval(refreshStatus, 3000);
</script>
</body>
</html>
